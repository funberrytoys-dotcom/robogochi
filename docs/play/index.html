  },
  *sleep(r) {
    const w = r.world;
    r.face('sleepy', 30);
    yield* walk(r, w.dock.x, w.dock.y + 2, 0.75, 6);
    r.crouchT = 0.6; yield* wait(0.15); r.crouchT = 0; r.hop(0.45);
    yield* waitUntil(() => r.grounded, 2);
    r.target = null; r.x = w.dock.x; r.y = w.dock.y + 2;
    r.mode = 'sleep'; Snd.sfx.plop();
    r.billHold = 1; r.say('yawn'); yield* wait(0.9); r.billHold = 0;
    r.sleeping = true; r.face('closed', 9999);
    let zt = 0, st = 1.5;
    while (r.sleeping) {
      const dt = yield; zt -= dt; st -= dt;
      r.headTarget.y = 0.05 + Math.sin(r.t * 1.3) * 0.015; r.headTarget.rot = 0.14;
      if (zt <= 0) { zt = 1.1; const h = r.headWorld(); FX.add({ kind: 'z', x: h.x + r.px * 0.35, y: h.y - r.px * 0.3, vx: 18, vy: -32, life: 2.2, grow: 0.8, s: 0.7 }); }
      if (st <= 0) { st = 3.2; Snd.sfx.snore(); }
    }
    // woken up
    resetHead(r); r.face('sleepy', 1.4); r.billHold = 1; r.say('yawn'); r.neckT = 1; r.flap = 0.5;
    yield* wait(0.9); r.billHold = 0; r.neckT = 0; r.flap = 0;
    r.mode = 'stand'; r.face('happy', 1.2); r.say(r.wokeEarly ? 'grumpy' : 'hello'); r.hop(0.5);
    yield* waitUntil(() => r.grounded, 2);
    yield* walk(r, w.cx, lerp(w.floorTop, w.floorBottom, 0.62), 1, 4);
  },
  *knockReply(r, intervals, pt) {
    r.lookAt(pt.x, pt.y, 5); r.face('look', 0.7); r.headTarget.rot = 0.22; r.say('question');
    yield* wait(0.45); resetHead(r);
    yield* walk(r, clamp(lerp(r.x, pt.x, 0.7), r.world.W * 0.25, r.world.W * 0.75), r.world.floorBottom - 10, 1.4, 3);
    r.lookAt(pt.x, pt.y, 4);
    yield* wait(0.15);
    for (let i = 0; i <= intervals.length; i++) {
      r.headTarget.y = 0.09; r.headTarget.rot = 0.05; r.billHold = 0.5; r.say('beep', { pitch: 1 + (i % 4) * 0.12 }); Snd.sfx.knock();
      const h = r.headWorld(); FX.add({ kind: 'ripple', x: h.x, y: h.y + r.px * 0.3, life: 0.5, s: 0.6, layer: 1 });
      yield* wait(0.07); r.headTarget.y = 0; r.headTarget.rot = 0; r.billHold = 0;
      if (i < intervals.length) yield* wait(Math.max(0.06, intervals[i] - 0.07));
    }
    yield* wait(0.3); r.face('happy', 1.3); r.say('happy'); r.flap = 1;
    FX.add({ kind: 'heart', x: r.headWorld().x, y: r.headWorld().y - r.px * 0.4, vy: -60, life: 1.2 });
    yield* wait(0.6); r.flap = 0;
    Game.friend(2, 'knock');
  },
  *kick(r, ball) {
    r.face('star', 1.5); r.say('wow');
    let tries = 0;
    while (tries++ < 6 && ball.alive) {
      const side = ball.x > r.x ? -1 : 1;
      r.walkTo(ball.x + side * r.px * 0.18, ball.y + 4, 1.6);
      let t = 0;
      while (r.target && t < 3) { t += yield; r.target = r.world.clampFloor(ball.x + side * r.px * 0.18, ball.y + 4); r.lookAt(ball.x, ball.y - ball.z, 0.3); if (dist(r.x, r.y, ball.x, ball.y) < r.px * 0.3) break; }
      if (dist(r.x, r.y, ball.x, ball.y) < r.px * 0.42 && ball.z < r.px * 0.3) {
        r.tiltBias = side * 0.15; r.crouchT = 0.4;
        yield* wait(0.08);
        const ang = rand(-Math.PI * 0.85, -Math.PI * 0.15) + (side > 0 ? 0 : 0);
        const toward = r.world.cx - ball.x;
        ball.vx = (sign(toward) * rand(0.6, 1.4) - side * 0.6) * r.world.S * 2.2;
        ball.vy = rand(-1, 1) * r.world.S * 1.2; ball.vz = r.world.S * rand(2.4, 3.4); ball.spin = ball.vx * 0.02;
        Snd.sfx.kick(); r.say('happy'); r.face('happy', 1); r.tiltBias = -side * 0.1; r.crouchT = 0;
        Game.stat('kicks'); Game.need('fun', 6); Game.friend(1, 'ball');
        void ang;
        yield* wait(0.3); r.tiltBias = 0;
        return;
      }
    }
    resetHead(r);
  },
  *celebrate(r) {
    Snd.sfx.fanfare(); r.face('star', 2.4); r.say('wow');
    const h = r.headWorld();
    for (let i = 0; i < 30; i++) FX.add({ kind: 'confetti', x: h.x + rand(-60, 60), y: h.y - rand(20, 80), vx: rand(-160, 160), vy: rand(-320, -80), g: 500, life: 1.8, col: pick(['#FF5C8A', '#FFD84A', '#4FC3FF', '#7BE07A', '#B266FF']), vr: rand(-10, 10) });
    yield* B.spin(r);
    yield* B.happyHop(r, 2);
  },
  *tryHat(r) {
    r.face('surprised', 0.6); r.say('surprise'); r.neckT = 1;
    yield* wait(0.5); r.neckT = 0; r.face('love', 1.4); r.say('love');
    yield* B.happyHop(r, 2);
  },
  *fly(r) {
    r.face('star', 4); r.say('wow'); r.flying = 3.2; r.vz = r.world.S * 1.6;
    let t = 0;
    while (t < 3) {
      const dt = yield; t += dt;
      r.vz = damp(r.vz, (r.z < r.world.S * 0.9 ? 1 : -0.2) * r.world.S * 0.8, 3, dt);
      r.vx = Math.sin(t * 1.7) * r.world.S * 0.9;
      r.flap = 1;
      if (chance(dt * 8)) FX.add({ kind: 'spark', x: r.x + rand(-20, 20), y: r.y - r.z - r.px * 1.4, life: 0.5, s: 0.5 });
    }
    r.flap = 0; r.flying = 0;
    yield* waitUntil(() => r.grounded, 4);
    r.face('happy', 1); r.say('happy');
  },
  *think(r, icon) {
    r.thinkOf(icon, 3); r.face(icon === 'energy' ? 'sleepy' : 'sad', 1.5); r.say(icon === 'energy' ? 'yawn' : 'sad');
    r.headTarget.rot = 0.18; yield* wait(1.4); resetHead(r); yield* wait(0.6);
  },
};

const TRAITS = { hop: 'happyHop', sit: 'sitIdle', dig: 'dig', nod: 'nod', spin: 'spin', wobble: 'wobble', glow: 'glow', bubbles: 'bubbles', dance: 'dance', pose: 'pose', grow: 'grow', float: 'float', dash: 'dash', orbit: 'orbit', zap: 'zapIt', buzz: 'buzz' };

// ---- room.js ----
'use strict';
// The hideout inside the phone: layout, background, dock, toys, furniture and finger gestures.

const World = {
  W: 390, H: 844, S: 140, cx: 195, floorTop: 400, floorBottom: 720, topUI: 104,
  dock: { x: 80, y: 470 }, shakeAmt: 0, washing: false, night: 0, nightT: 0,
  bg: null, bgDirty: true,
  layout(W, H, topUI = 104, botUI = 112) {
    this.W = W; this.H = H; this.cx = W / 2; this.topUI = topUI;
    this.floorBottom = H - botUI - 6;
    this.floorTop = Math.min(H * 0.48, this.floorBottom - H * 0.25);
    this.S = clamp(Math.min(W * 0.37, (this.floorBottom - topUI) * 0.36), 80, 230);
    this.dock = { x: W * 0.22, y: lerp(this.floorTop, this.floorBottom, 0.2) };
    this.spots = {
      lamp: { x: W * 0.86, y: lerp(this.floorTop, this.floorBottom, 0.12) },
      plant: { x: W * 0.09, y: lerp(this.floorTop, this.floorBottom, 0.82) },
      rug: { x: W * 0.52, y: lerp(this.floorTop, this.floorBottom, 0.6) },
    };
    this.bgDirty = true;
  },
  depthScale(y) { return lerp(0.8, 1.05, clamp(invLerp(this.floorTop, this.floorBottom, y), 0, 1)); },
  clampFloor(x, y) {
    y = clamp(y, this.floorTop + this.H * 0.025, this.floorBottom);
    const t = invLerp(this.floorTop, this.floorBottom, y);
    const m = lerp(this.W * 0.15, this.W * 0.13, t);
    return { x: clamp(x, m, this.W - m), y };
  },
  shake(a) { this.shakeAmt = Math.max(this.shakeAmt, a); },
};

// ---------------- background (pre-rendered) ----------------
function renderRoomBg(owned) {
  const W = World.W, H = World.H, ft = World.floorTop, fb = World.floorBottom;
  const c = document.createElement('canvas');
  c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  // wall
  let gr = g.createLinearGradient(0, 0, 0, ft);
  gr.addColorStop(0, '#9E88E8'); gr.addColorStop(1, '#C8B4F6');
  g.fillStyle = gr; g.fillRect(0, 0, W, ft + 2);
  // wall panels with screws
  const panel = (x, y, w, h) => {
    g.beginPath(); rrect(g, x, y, w, h, 18); g.fillStyle = 'rgba(255,255,255,0.10)'; g.fill();
    g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,0.22)'; g.stroke();
    g.fillStyle = 'rgba(110,84,190,0.55)';
    for (const [sx, sy] of [[x + 12, y + 12], [x + w - 12, y + 12], [x + 12, y + h - 12], [x + w - 12, y + h - 12]]) { g.beginPath(); circ(g, sx, sy, 3.2); g.fill(); }
  };
  panel(W * 0.03, H * 0.08, W * 0.34, ft - H * 0.12);
  panel(W * 0.4, H * 0.08, W * 0.57, ft - H * 0.12);
  // pipes
  const pipe = (pts, col, wdt) => {
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.lineWidth = wdt + 5; g.strokeStyle = darken(col, 0.35); g.stroke();
    g.lineWidth = wdt; g.strokeStyle = col; g.stroke();
    g.lineWidth = wdt * 0.28; g.strokeStyle = 'rgba(255,255,255,0.45)';
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x - 2, y - 2) : g.moveTo(x - 2, y - 2))); g.stroke();
    for (const [x, y] of pts.slice(1, -1)) { g.beginPath(); circ(g, x, y, wdt * 0.85); g.fillStyle = lighten(col, 0.1); g.fill(); g.lineWidth = 2; g.strokeStyle = darken(col, 0.35); g.stroke(); }
  };
  pipe([[-10, H * 0.155], [W * 0.3, H * 0.155], [W * 0.3, H * 0.06], [W * 0.62, H * 0.06], [W + 10, H * 0.06]], '#FF9A5A', 13);
  pipe([[W * 0.965, H * 0.13], [W * 0.965, ft + 4]], '#7FE0C4', 12);
  pipe([[W * 0.035, H * 0.2], [W * 0.035, ft + 4]], '#FFC94D', 10);
  // phone battery tank on the wall (cute in-phone detail)
  const bx = W * 0.1, by = H * 0.215, bw = W * 0.2, bh = H * 0.075;
  g.beginPath(); rrect(g, bx, by, bw, bh, 10); g.fillStyle = '#5A47A8'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#3D2E80'; g.stroke();
  g.fillStyle = '#3D2E80'; g.fillRect(bx + bw, by + bh * 0.3, 6, bh * 0.4);
  // porthole: window to the phone's home screen
  const px = W * 0.74, py = H * 0.205, pr = Math.min(W * 0.17, H * 0.095);
  g.save(); g.beginPath(); circ(g, px, py, pr); g.clip();
  gr = g.createLinearGradient(px, py - pr, px, py + pr);
  gr.addColorStop(0, '#5B8CFF'); gr.addColorStop(1, '#C277FF');
  g.fillStyle = gr; g.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  const icons = ['#FF5C5C', '#FFD84A', '#4FD27A', '#4FC3FF', '#FF8AD8', '#FFFFFF', '#FF9A3D', '#7B61FF', '#2ED3B7'];
  try { g.filter = 'blur(1.2px)'; } catch (e) { /* no filter */ }
  const isz = pr * 0.42;
  for (let i = 0; i < 16; i++) {
    const ix = px - pr * 1.05 + (i % 4) * isz * 1.35 + isz * 0.25, iy = py - pr * 1.0 + Math.floor(i / 4) * isz * 1.35 + isz * 0.2;
    g.beginPath(); rrect(g, ix, iy, isz, isz, isz * 0.28); g.fillStyle = icons[(i * 5) % icons.length]; g.fill();
  }
  try { g.filter = 'none'; } catch (e) { /* no filter */ }
  g.fillStyle = 'rgba(255,255,255,0.22)';
  g.beginPath(); g.moveTo(px - pr, py - pr * 0.2); g.lineTo(px - pr * 0.2, py - pr); g.lineTo(px + pr * 0.1, py - pr); g.lineTo(px - pr, py + pr * 0.1); g.fill();
  g.restore();
  g.lineWidth = pr * 0.2; g.strokeStyle = '#ECE6FA'; g.beginPath(); circ(g, px, py, pr + pr * 0.08); g.stroke();
  g.lineWidth = 2.5; g.strokeStyle = '#7A68B8'; g.beginPath(); circ(g, px, py, pr + pr * 0.18); g.stroke(); g.beginPath(); circ(g, px, py, pr - pr * 0.02); g.stroke();
  g.fillStyle = '#9C8CCF';
  for (let i = 0; i < 8; i++) { const a = (i * TAU) / 8 + 0.2; g.beginPath(); circ(g, px + Math.cos(a) * pr * 1.08, py + Math.sin(a) * pr * 1.08, 2.6); g.fill(); }
  // hatch door to the next compartment

class Ball {
  constructor(x, y) { this.x = x; this.y = y; this.z = 0; this.vx = 0; this.vy = 0; this.vz = 0; this.rot = 0; this.spin = 0; this.alive = true; this.grab = null; }

    if (this.z < 0) { this.z = 0; if (this.vz < -S * 0.8) { this.vz = -this.vz * 0.55; Snd.sfx.pop(0.6); } else this.vz = 0; }

    const f = this.z > 0 ? 0.3 : 1.6;
    this.vx *= 1 - f * dt; this.vy *= 1 - f * dt * 1.4;
    const p = World.clampFloor(this.x, this.y);
    if (p.x !== this.x) { this.vx = -this.vx * 0.7; Snd.sfx.pop(0.5); }
    if (p.y !== this.y) this.vy = -this.vy * 0.6;
    this.x = p.x; this.y = p.y;
    this.rot += (this.vx / Math.max(8, this.r)) * dt;
  }
  get moving() { return Math.abs(this.vx) + Math.abs(this.vy) + Math.abs(this.vz) > 25; }

    ctx.fillStyle = 'rgba(60,30,80,0.2)';

}

// ---------------- the room scene ----------------
const Room = {
  robot: null, ball: null, foods: [], gesture: null, knock: { taps: [], last: 0, x: 0, y: 0 },
  petAcc: 0, purrT: 0, heartAcc: 0, tapLog: [], scrub: 0, sponge: null, showerT: 0,
  enter() {
    World.bgDirty = true;
    const r = this.robot;
    if (this.greetOnEnter) {
      this.greetOnEnter = false;
      r.play(B.greet(r), 2, 'greet');
      if (Game.away > 20) setTimeout(() => { UI.toast(`Пока тебя не было, ${Game.s.name} нашёл 5 винтиков!`, 'bolt'); Game.addBolts(5, r.x, r.y - r.px); }, 1800);
      setTimeout(() => Game.hint(), 2500);
    }
  },
  switchRobot(def) {
    const old = this.robot, x = old.x, y = old.y;
    FX.burst('spark', x, y - old.px * 0.7, 14, { min: 80, max: 220, p: { life: 0.8, col: '#FFFFFF' } });
    FX.burst('dust', x, y - old.px * 0.4, 8, { min: 40, max: 120, p: { life: 0.7, col: 'rgba(255,255,255,0.7)' } });
    Snd.sfx.whoosh(); Snd.sfx.sparkle();
    this.setRobot(def, true);
    const r = this.robot; r.x = x; r.y = y; r.sq.v -= 6;
    r.play(B.hello(r), 2, 'hello');
  },
  setRobot(def, keepPos) {
    const old = this.robot;
    const x = keepPos && old ? old.x : World.cx, y = keepPos && old ? old.y : lerp(World.floorTop, World.floorBottom, 0.62);
    this.robot = new Robot(def, World, x, y);
    this.robot.hat = Game.s.hat;
    this.robot.dirt = clamp(1 - Game.s.needs.clean / 70, 0, 1);
  },
  ensureToys() { if (!this.ball) this.ball = new Ball(World.W * 0.75, lerp(World.floorTop, World.floorBottom, 0.75)); },

  // ---------- gestures ----------
  down(x, y, id) {
    const r = this.robot;
    if (World.washing) { this.gesture = { type: 'scrub', x, y, id }; this.sponge = { x, y }; return; }
    if (this.ball && this.ball.hit(x, y)) {
      this.ball.grab = { x, y, t: performance.now(), hist: [[x, y, performance.now()]] };
      this.gesture = { type: 'ball', id }; return;
    }
    const hit = r.hitTest(x, y);
    if (hit && r.mode === 'sleep') { this.wake(true); this.gesture = { type: 'none' }; return; }
    if (hit) this.gesture = { type: hit, x0: x, y0: y, x, y, t0: performance.now(), moved: 0, id, petting: false };
    else this.gesture = { type: 'glass', x0: x, y0: y, t0: performance.now(), moved: 0, id };
  },
  move(x, y) {
    const g = this.gesture, r = this.robot;
    if (!g) return;
    if (g.type === 'scrub') { this.doScrub(x, y); return; }
    if (g.type === 'ball') { const b = this.ball; b.grab.x = x; b.grab.y = y; b.grab.hist.push([x, y, performance.now()]); if (b.grab.hist.length > 6) b.grab.hist.shift(); b.x = x; const fl = World.clampFloor(x, Math.max(y + b.r, World.floorTop + 10)); b.y = fl.y; b.z = Math.max(0, fl.y - y - b.r); return; }
    if (g.type === 'held') { r.hold.x = x; r.hold.y = y; return; }
    const d = Math.hypot(x - g.x, y - g.y);
    g.moved += d;
    const fromStart = Math.hypot(x - g.x0, y - g.y0);
    if (g.type === 'head') {
      if (fromStart > 10) g.petting = true;
      if (g.petting) this.pet(x, y, d);
      if (g.petting && !r.hitTest(x, y) && fromStart > r.px * 1.5) g.type = 'none';
    } else if (g.type === 'body' && fromStart > 12) {
      this.pickUp(x, y);
    } else if (g.type === 'glass') {
      // nothing
    }
    g.x = x; g.y = y;
  },
  up(x, y) {
    const g = this.gesture, r = this.robot;
    this.gesture = null;
    if (!g) return;
    const quick = performance.now() - (g.t0 || 0) < 350 && (g.moved || 0) < 14;
    if (g.type === 'scrub') { this.sponge = null; return; }
    if (g.type === 'ball') { this.throwBall(); return; }
    if (g.type === 'held') { this.release(); return; }
    if (g.type === 'head') { if (quick) this.tapRobot('head'); else if (g.petting) this.petEnd(); return; }
    if (g.type === 'body') { if (quick) this.tapRobot('body'); return; }
    if (g.type === 'glass' && quick) this.knockGlass(x, y);
  },
  tick(dt) {
    // long press on head picks the robot up
    const g = this.gesture;
    if (g && (g.type === 'head') && !g.petting && performance.now() - g.t0 > 420 && g.moved < 10) this.pickUp(g.x, g.y);
  },

  pet(x, y, d) {
    const r = this.robot;
    if (r.mode === 'sleep' || r.busy && r.coPri >= 3) return;
    if (r.busy && r.coPri < 3) r.stop();
    const h = r.headWorld();
    r.face('happy', 0.4);
    r.crouchT = 0.28;
    r.headTarget.rot = clamp((x - h.x) / r.px * -0.5, -0.3, 0.3);
    r.lookAt(x, y, 0.3);
    this.petAcc += d; this.heartAcc += d;
    this.purrT -= 1 / 60;
    if (this.purrT <= 0) { this.purrT = 1.15; Snd.purr(r.def.voice, 1.1); }
    if (this.heartAcc > 70) { this.heartAcc = 0; FX.add({ kind: 'heart', x: x + rand(-10, 10), y: y - 20, vy: -70, vx: rand(-20, 20), life: 1, s: rand(0.8, 1.2) }); }
    if (this.petAcc > 260) { this.petAcc = 0; Game.friend(1, 'pet'); Game.need('fun', 4); }
  },
  petEnd() {
    const r = this.robot;
    r.crouchT = 0; r.headTarget.rot = 0;
    if (r.mode !== 'sleep') { r.face('love', 1.2); r.say('love'); }
    Game.hint('pet');
  },
  tapRobot(part) {
    const r = this.robot, now = performance.now();
    this.tapLog = this.tapLog.filter((t) => now - t < 2200); this.tapLog.push(now);
    if (r.coPri >= 3) return;
    if (this.tapLog.length >= 5 && r.mode === 'stand' && r.grounded) { this.tapLog = []; r.stop(); r.play(chance(0.6) ? B.fall(r) : B.plop(r), 2, 'fall'); Game.friend(1, 'tap'); return; }
    if (r.busy && r.coPri >= 2) return;
    r.stop();
    if (part === 'body') { r.play(B.giggle(r), 2, 'tickle'); Game.need('fun', 3); }
    else r.play(pick([B.surprised(r), B.question(r), B.happyHop(r, 1), B.giggle(r, 0.7), B[TRAITS[r.def.trait]](r)]), 2, 'tap');
    Game.friend(1, 'tap');
    Game.hint('tap');
  },
  pickUp(x, y) {
    const r = this.robot;
    if (r.mode === 'sleep') return;
    r.stop(); r.mode = 'stand'; r.held = true; r.hold = { x, y };
    this.gesture = { type: 'held' };
    r.face('surprised', 0.6); r.say('surprise'); r.flap = 1;
    setTimeout(() => { if (r.held) { r.face('happy', 99); r.say('giggle'); } }, 600);
    Game.hint('lift');
  },
  release() {
    const r = this.robot;
    r.held = false; r.flap = 0; r.expr = null;
    r.vz = 0; r.vx = (r.vx || 0) * 0.5; r.vy = 0;
    r.onLand = (k) => {
      r.onLand = null;
      if (k > 1.1 && chance(0.5)) r.play(B.plop(r), 2, 'plop');
      else if (k > 0.5) r.play(B.happyHop(r, 1), 2, 'land');
    };
    if (r.z < 4) { r.z = 0; r.onLand(0.6); }
  },
  knockGlass(x, y) {
    const k = this.knock, now = performance.now() / 1000, r = this.robot;
    Snd.sfx.knock();
    FX.add({ kind: 'ripple', x, y, life: 0.55, layer: 1 });
    if (r.mode === 'sleep') { r.face('closed', 9999); r.say('grumpy', { vol: 0.5 }); return; }
    if (now - k.last > 1.4) k.taps = [];
    k.taps.push(now); k.last = now; k.x = x; k.y = y;
    if (k.taps.length === 1 && r.coPri < 2) { r.lookAt(x, y, 2); r.face('look', 0.6); }
  },
  throwBall() {
    const b = this.ball, h = b.grab.hist, now = performance.now();
    b.grab = null;
    const a = h[0], z = h[h.length - 1], dt = Math.max(16, now - a[2]) / 1000;
    let vx = (z[0] - a[0]) / dt, vy = (z[1] - a[1]) / dt;
    const sp = Math.hypot(vx, vy);
    if (sp < 60) { // a tap: give it a little kick
      vx = rand(-1, 1) * World.S * 1.5; vy = rand(-0.5, 0.5) * World.S; b.vz = World.S * 2.2; Snd.sfx.kick();
    } else { b.vz = Math.max(0, -vy) * 0.6 + World.S * 0.8; vy *= 0.25; }
    b.vx = clamp(vx, -World.S * 5, World.S * 5); b.vy = clamp(vy, -World.S * 2, World.S * 2);
    Game.need('fun', 2);
    const r = this.robot;
    if (r.mode === 'stand' && r.coPri < 2) { r.stop(); r.play(B.kick(r, b), 1, 'kick'); }
  },
  // ---------- food ----------
  startFood(kind, x, y) {
    const f = new Food(kind, x, y); this.foods.push(f); this.dragFood = f;
    const r = this.robot;
    if (r.mode === 'sleep') this.wake(true);
    Snd.sfx.open();
  },
  moveFood(x, y) {
    const f = this.dragFood; if (!f) return;
    f.x = x; f.y = y - 30;
    const r = this.robot, h = r.headWorld();
    const d = dist(f.x, f.y, h.x, h.y + r.px * 0.3);
    if (r.coPri < 3 && r.mode !== 'down') {
      r.lookAt(f.x, f.y, 0.4);
      if (d < r.px * 1.4) { r.billHold = 0.6; r.face('star', 0.3); if (!f.wanted) { f.wanted = true; r.say('wow'); } }
      else r.billHold = 0;
    }
    if (d < r.px * 0.5 && r.coPri < 3) this.feed(f);
  },
  dropFood() {
    const f = this.dragFood; this.dragFood = null;
    if (!f || !f.alive) return;
    const r = this.robot; r.billHold = 0;
    f.held = false;
    const fl = World.clampFloor(f.x, Math.max(f.y + 40, World.floorTop + 30));
    f.floorY = fl.y; f.x = fl.x; f.z = Math.max(0, fl.y - f.y); f.vz = 0;
    // the robot fetches it
    if (r.mode !== 'down') { r.stop(); r.play((function* () { yield* waitUntil(() => f.z <= 0, 2); yield* walk(r, f.x, f.floorY + 4, 1.3, 4); if (f.alive) Room.feed(f); })(), 1, 'fetch'); }
  },
  feed(f) {
    f.alive = false; if (this.dragFood === f) this.dragFood = null;
    const r = this.robot, F = FOODS[f.kind];
    r.stop(); r.play(B.eat(r, f.kind), 3, 'eat');
    Game.need('food', F.food); Game.need('fun', F.fun); Game.need('energy', F.energy);
    Game.friend(2, 'feed'); Game.stat('feeds');
    Game.hint('feed');
  },
  // ---------- wash ----------
  startWash() {
    const r = this.robot;
    if (r.mode === 'sleep') this.wake(true);
    r.stop(); r.mode = 'stand'; World.washing = true; this.scrub = 0;
    r.face('surprised', 0.6); r.say('question');
  },
  doScrub(x, y) {
    const r = this.robot;
    if (!World.washing) { this.sponge = null; return; }
    this.sponge = { x, y };
    const hit = r.hitTest(x, y);
    if (!hit) return;
    this.scrub += 0.012;
    if (chance(0.5)) Snd.sfx.scrub();
    const h = r.headWorld(), px = r.px;
    if (r.foam.length < 40 && chance(0.6)) {
      const lx = (x - h.x) / (r.def.head.w * px), ly = (y - h.y) / (r.def.head.h * px);
      r.foam.push({ x: clamp(lx, -0.55, 0.55) + rand(-0.06, 0.06), y: clamp(ly, -0.6, 0.6) + rand(-0.06, 0.06), r: rand(0.03, 0.06), life: 6 });
    }
    r.dirt = Math.max(0, r.dirt - 0.01);
    r.face(chance(0.5) ? 'squint' : 'giggle', 0.4);
    if (chance(0.04)) r.say('giggle', { vol: 0.6 });
    if (chance(0.15)) FX.add({ kind: 'bubble', x: x + rand(-20, 20), y: y + rand(-20, 20), vy: -rand(30, 70), life: 1.3, r: rand(4, 9) });
    UI.$('washM').style.width = Math.round(clamp(this.scrub, 0, 1) * 100) + '%';
    if (this.scrub >= 1) this.rinse();
  },
  rinse() {
    World.washing = false; this.sponge = null; this.showerT = 1.0; this.scrub = 0;
    const r = this.robot;
    Snd.sfx.splash();
    r.play((function* () { r.face('closed', 1); yield* wait(0.9); yield* B.shakeOff(r); })(), 3, 'shake');
    Game.need('clean', 100); Game.stat('washes'); Game.friend(2, 'wash');
    UI.setWash(false);
  },
  cancelWash() { World.washing = false; this.sponge = null; if (this.robot.foam.length) this.rinse(); else UI.setWash(false); },
  // ---------- sleep ----------
  goSleep() {
    const r = this.robot;
    if (r.mode === 'sleep') { this.wake(false); return; }
    r.stop(); r.mode = 'stand'; r.play(B.sleep(r), 3, 'sleep');
    Game.stat('sleeps');
  },
  wake(early) {
    const r = this.robot;
    if (!r.sleeping && r.coName !== 'sleep') return;
    r.wokeEarly = early && Game.s.needs.energy < 60;
    r.sleeping = false; r.expr = null;
    Snd.sfx.lightOn();
  },

  // ---------- frame ----------
  update(dt) {
    const r = this.robot;
    this.tick(dt);
    r.battery = Game.s.needs.energy / 100;
    if (!World.washing) r.dirt = clamp(1 - Game.s.needs.clean / 70, 0, 1) * (r.foam.length ? 0.3 : 1);
    r.update(dt);
    if (this.ball) {
      this.ball.update(dt);
      // the robot notices a rolling ball
      if (this.ball.moving && !r.busy && r.mode === 'stand' && !r.held && chance(dt * 1.2)) r.play(B.kick(r, this.ball), 1, 'kick');
    }
    for (const f of this.foods) f.update(dt);
    this.foods = this.foods.filter((f) => f.alive);
    // knock reply
    const k = this.knock, now = performance.now() / 1000;
    if (k.taps.length && now - k.last > 0.75) {
      const taps = k.taps; k.taps = [];
      const iv = []; for (let i = 1; i < taps.length; i++) iv.push(taps[i] - taps[i - 1]);
      if (r.mode !== 'sleep' && r.coPri < 3) { r.stop(); if (r.mode === 'sit') r.mode = 'stand'; r.play(B.knockReply(r, iv.slice(0, 5), { x: k.x, y: k.y }), 2, 'knock'); }
      Game.hint('knock');
    }
    // night follows sleep; keep the sleep button in sync
    const sleeping = r.mode === 'sleep';
    const asleep = r.coName === 'sleep';
    if (asleep !== this.wasAsleep) { this.wasAsleep = asleep; UI.sleepBtn(); }
    World.night = damp(World.night, sleeping ? 1 : 0, 2.5, dt);
    if (this.showerT > 0) {
      this.showerT -= dt;
      const h = r.headWorld();
      for (let i = 0; i < 3; i++) FX.add({ kind: 'drop', x: h.x + rand(-1, 1) * r.px * 0.6, y: h.y - r.px * rand(0.6, 1.2), vy: rand(300, 450), g: 600, life: 0.5 });
    }
    // idle life
    if (!r.busy && !r.held && r.mode === 'stand' && r.grounded && !this.party && !World.washing) {
      r.idleT -= dt;
      if (r.idleT <= 0) { r.idleT = rand(2.2, 5); this.idle(); }
    } else if (!r.busy && r.mode === 'sit') { r.mode = 'stand'; }
  },
  idle() {
    const r = this.robot, n = Game.s.needs, own = Game.s.owned;
    const low = Game.lowestNeed();
    if (low && low.v < 30 && chance(0.5)) { r.play(B.think(r, low.k === 'fun' ? 'fun' : low.k), 1, 'think'); return; }
    if (n.energy < 12) { r.play(B.sleep(r), 3, 'sleep'); return; }
    if (n.energy < 30 && chance(0.3)) { r.play(B.yawn(r), 1, 'yawn'); return; }
    const opts = [
      [3, () => { const p = World.clampFloor(rand(World.W * 0.15, World.W * 0.85), rand(World.floorTop + 40, World.floorBottom - 10)); r.play(walk(r, p.x, p.y, rand(0.6, 1)), 0, 'wander'); }],
      [2, () => r.play(B[TRAITS[r.def.trait]](r), 1, 'trait')],
      [1, () => r.play(B.stumble(r), 1, 'stumble')],
      [1.2, () => r.play(B.question(r), 0, 'q')],
      [0.8, () => r.play(B.greet(r), 1, 'greet')],
      [1, () => { const b = this.ball; if (b) r.play(B.kick(r, b), 1, 'kick'); }],
    ];
    if (own.rug) opts.push([1.5, () => r.play((function* () { const p = World.spots.rug; yield* walk(r, p.x, p.y + 4, 1); yield* B.dance(r, 8); Game.need('fun', 3); })(), 1, 'rug')]);
    if (own.plant) opts.push([0.8, () => r.play((function* () { const p = World.spots.plant; yield* walk(r, p.x + World.S * 0.5, p.y, 1); r.lookAt(p.x, p.y - 40, 2); yield* B.question(r); r.face('love', 1); r.say('love'); yield* wait(0.8); })(), 1, 'plant')]);
    if (r.hat === 'propeller') opts.push([1, () => r.play(B.fly(r), 1, 'fly')]);
    let sum = opts.reduce((a, o) => a + o[0], 0), pr = rand(sum);
    for (const [w, fn] of opts) { pr -= w; if (pr <= 0) { fn(); return; } }
  },
  draw(ctx) {
    const W = World.W, H = World.H, r = this.robot, own = Game.s.owned;
    if (World.bgDirty || !World.bg) { World.bg = renderRoomBg(own); World.bgDirty = false; }
    ctx.drawImage(World.bg, 0, 0, W, H);
    const charging = r.mode === 'sleep';
    if (own.rug) drawRug(ctx);
    drawDockBack(ctx, charging);
    // depth-sorted floor objects
    const objs = [];
    objs.push({ y: World.dock.y + (r.mode === 'sleep' ? 1 : -1), d: () => drawDockFront(ctx, charging) });
    objs.push({ y: r.y, d: () => { if (World.night > 0.05) { ctx.save(); try { ctx.filter = `brightness(${1 - World.night * 0.4})`; } catch (e) { /* */ } r.draw(ctx); ctx.restore(); } else r.draw(ctx); } });
    if (this.ball) objs.push({ y: this.ball.y, d: () => this.ball.draw(ctx) });
    for (const f of this.foods) if (!f.held) objs.push({ y: f.floorY, d: () => f.draw(ctx) });
    if (own.lamp) objs.push({ y: World.spots.lamp.y, d: () => drawLamp(ctx, World.night > 0.3) });
    if (own.plant) objs.push({ y: World.spots.plant.y, d: () => drawPlant(ctx) });
    objs.sort((a, b) => a.y - b.y).forEach((o) => o.d());
    if (this.party) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const t = performance.now() / 1000;
      for (let i = 0; i < 4; i++) {
        const x = World.W * (0.5 + 0.35 * Math.sin(t * 1.3 + i * 1.7)), y = lerp(World.floorTop, World.floorBottom, 0.5 + 0.4 * Math.cos(t * 1.1 + i * 2.1));
        const col = ['#FF5C8A', '#4FC3FF', '#FFD84A', '#7BE07A'][i], g = ctx.createRadialGradient(x, y, 0, x, y, 100);
        g.addColorStop(0, rgba(col, 0.38)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - 100, y - 100, 200, 200);
      }
      ctx.restore();
    }
    FX.draw(ctx, 0);
    // night
    if (World.night > 0.01) {
      ctx.fillStyle = `rgba(16,12,48,${0.55 * World.night})`; ctx.fillRect(0, 0, W, H);
      if (own.stars) drawStars(ctx, World.night);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const glow = (x, y, rad, col, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2); };
      glow(World.dock.x, World.dock.y - World.S * 0.5, World.S * 1.2, '#6BFF8E', 0.18 * World.night);
      if (own.lamp) glow(World.spots.lamp.x, World.spots.lamp.y - World.S * 0.6, World.S * 1.6, '#FFB347', 0.32 * World.night);
      ctx.restore();
    }
    for (const f of this.foods) if (f.held) f.draw(ctx);
    if (this.sponge) drawSponge(ctx, this.sponge.x, this.sponge.y);
  },
};

function drawSponge(ctx, x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.25 + Math.sin(performance.now() / 80) * 0.08);
  ctx.beginPath(); rrect(ctx, -26, -18, 52, 36, 10); fillOutlined(ctx, '#FFE066', '#B8941E', 2.5);
  ctx.beginPath(); rrect(ctx, -26, 6, 52, 12, 6); ctx.fillStyle = '#5FD38A'; ctx.fill();
  ctx.fillStyle = 'rgba(184,148,30,0.5)';
  for (const [a, b] of [[-12, -8], [4, -10], [14, -2], [-4, 0]]) { ctx.beginPath(); circ(ctx, a, b, 2.5); ctx.fill(); }
  ctx.restore();
}

const UI = {
  el: {}, sheetKind: null, shopTab: 'hats',

// small robot pictures for cards (static pose, optional hat, silhouette when locked)
function drawPreviewRobot(g, def, w, h, hat, visible) {
  const P = defaultPose();
  P.px = Math.min(h / 1.72, w / (def.head.w + 0.12)); P.x = w / 2; P.y = h - 6; P.t = 2.1; P.hat = hat;
  P.blush = 0.6; P.expr = visible ? 'happy' : 'normal'; P.battery = 1;
  if (def.topper === 'speakers' || def.deco === 'saturn') P.px *= 0.82;
  drawRobot(g, def, P);
  if (!visible) {
    g.save(); g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#3B2D72'; g.fillRect(0, 0, w, h); g.restore();
    g.fillStyle = 'rgba(255,255,255,0.75)'; g.font = '900 26px Nunito, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', w / 2, h * 0.38);
  }
}
function drawFurniturePreview(g, id, w, h) {
  const save = { S: World.S, spots: World.spots, dock: World.dock, ft: World.floorTop, fb: World.floorBottom, W: World.W };
  World.S = 70; World.floorTop = 0; World.floorBottom = 100;
  World.spots = { lamp: { x: w / 2, y: h - 8 }, plant: { x: w / 2, y: h - 8 }, rug: { x: w / 2, y: h * 0.62 } };
  if (id === 'lamp') drawLamp(g, false);
  else if (id === 'plant') drawPlant(g);
  else if (id === 'rug') drawRug(g);
  else if (id === 'poster') {
    g.save(); g.translate(w / 2, h / 2); g.rotate(-0.05);
    g.beginPath(); rrect(g, -26, -34, 52, 64, 5); g.fillStyle = '#1F1A4A'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke();
    g.fillStyle = '#FFD84A'; g.beginPath(); circ(g, -4, -6, 10); g.fill();
    g.strokeStyle = '#FF8AD8'; g.lineWidth = 2.5; g.beginPath(); g.ellipse(-4, -6, 18, 5, -0.3, 0, TAU); g.stroke();
    g.restore();
  } else if (id === 'stars') {
    g.fillStyle = '#5B45D6'; g.beginPath(); rrect(g, w / 2 - 18, h - 34, 36, 26, 8); g.fill();
    g.fillStyle = '#FFE59A'; g.beginPath(); circ(g, w / 2, h - 34, 12); g.fill();
    for (let i = 0; i < 7; i++) { g.fillStyle = i % 2 ? '#FFF7C2' : '#BFE9FF'; g.beginPath(); starPath(g, 12 + i * 10, 14 + Math.sin(i * 2) * 10, 5, 2, 4); g.fill(); }
  }
  World.S = save.S; World.spots = save.spots; World.floorTop = save.ft; World.floorBottom = save.fb;
}

'use strict';
// Mini-games: «Лови винтики» (catch) and «Пи-пи-повтори» (Simon), plus a dance party in the room.

function miniWorld(top, bottom, S) {
  return {
    W: World.W, H: World.H, cx: World.W / 2, S, floorTop: top, floorBottom: bottom, washing: false,
    depthScale() { return 1; },
    clampFloor(x, y) { return { x: clamp(x, this.W * 0.12, this.W * 0.88), y: clamp(y, this.floorTop, this.floorBottom) }; },
    shake(a) { World.shake(a); },
  };
}

const Catch = {
  name: 'catch', dur: 40,
  enter() {
    this.t = 0; this.score = 0; this.items = []; this.spawnT = 0.6; this.combo = 0; this.done = false; this.boost = 0;
    this.w = miniWorld(World.H - 150, World.H - 130, World.S * 0.85);
    this.robot = new Robot(Game.def, this.w, World.cx, World.H - 140);
    this.robot.hat = Game.s.hat; this.robot.battery = Game.s.needs.energy / 100;

const PADS = [
  { col: '#FF5C5C', shape: 'circle', f: 523.25 },
  { col: '#FFD84A', shape: 'star', f: 659.25 },
  { col: '#6BE07A', shape: 'tri', f: 783.99 },

const Simon = {
  name: 'simon',
  enter() {
    this.round = 0; this.won = 0; this.miss = 0; this.seq = []; this.inp = 0; this.state = 'intro'; this.stT = 1.2; this.lit = -1; this.litT = 0; this.done = false; this.t = 0;

    this.rects = PADS.map((p, i) => ({ x: x0 + (i % 2) * (pw + gap), y: y0 + Math.floor(i / 2) * (pw * 0.78 + gap), w: pw, h: pw * 0.78 }));

    UI.$('gTime').style.width = Math.min(100, ((this.round - 1) / 5) * 100) + '%';
  },
  light(i, who) {
    this.lit = i; this.litT = 0.32;
    Snd.sfx.tap(PADS[i].f);
    const r = this.robot, R = this.rects[i];
    r.lookAt(R.x + R.w / 2, R.y + R.h / 2, 0.6);

  },
  down(x, y) {
    if (this.state !== 'input' || this.done) return;
    const i = this.rects.findIndex((R) => x > R.x && x < R.x + R.w && y > R.y && y < R.y + R.h);
    if (i < 0) return;
    this.light(i, 'kid');
    const r = this.robot;
    if (i === this.seq[this.inp]) {
      this.inp++;
      if (this.inp >= this.seq.length) {
        this.won++; this.score += 4; UI.$('gScore').querySelector('b').textContent = this.score;
        Game.stat('melodies');

        r.stop(); r.play(B.happyHop(r, 2), 2);
        FX.burst('star', World.cx, World.H * 0.3, 8, { min: 80, max: 200, p: { life: 0.9 } });
      }
    } else {
      this.miss++;
      this.state = 'oops'; this.stT = 1.5;
      Snd.sfx.error(); r.stop(); r.play(B.question(r), 2);

  },
  move() {}, up() {},
  update(dt) {
    this.t += dt;
    this.robot.update(dt);
    if (this.litT > 0) { this.litT -= dt; if (this.litT <= 0) this.lit = -1; }
    if (this.done) return;
    this.stT -= dt;
    if (this.state === 'intro' && this.stT <= 0) this.nextRound();
    else if (this.state === 'show' && this.stT <= 0) {
      if (this.showI < this.seq.length) { this.light(this.seq[this.showI++], 'robot'); this.stT = Math.max(0.42, 0.62 - this.round * 0.03); }
      else { this.state = 'input'; this.inp = 0; this.robot.face('happy', 1); this.robot.say('question'); }
    } else if (this.state === 'good' && this.stT <= 0) {
      if (this.won >= 5) this.finish(); else this.nextRound();
    } else if (this.state === 'oops' && this.stT <= 0) {
      if (this.miss >= 3) this.finish(); else { this.state = 'show'; this.showI = 0; this.stT = 0.5; }
    }
  },
  finish() {
    this.done = true;
    const n = this.score + 2, s = Game.s;
    s.bolts += n; s.stats.boltsTotal += n; Game.need('fun', 20); Game.friend(3); Game.save();
    const r = this.robot; r.stop(); r.play(B.celebrate(r), 3);
    const stars = this.won >= 5 ? 3 : this.won >= 3 ? 2 : 1;
    Games.result(this.won >= 5 ? 'Все мелодии!' : `Мелодий: ${this.won}`, stars, `+${n} винтиков в копилку`, () => Games.start('simon'));
  },
  draw(ctx) {
    const W = World.W, H = World.H;
    if (World.bgDirty || !World.bg) { World.bg = renderRoomBg(Game.s.owned); World.bgDirty = false; }
    ctx.drawImage(World.bg, 0, 0, W, H);
    ctx.fillStyle = 'rgba(24,12,60,0.5)'; ctx.fillRect(0, 0, W, H);
    // little stage
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ell(ctx, World.cx, this.w.floorTop + 2, World.S * 0.7, World.S * 0.12); ctx.fill();
    this.robot.draw(ctx);
    this.rects.forEach((R, i) => {
      const p = PADS[i], on = this.lit === i;
      ctx.save();
      if (on) { ctx.shadowColor = p.col; ctx.shadowBlur = 30 * DPR; }
      ctx.beginPath(); rrect(ctx, R.x, R.y, R.w, R.h, 24);
      ctx.fillStyle = on ? lighten(p.col, 0.35) : rgba(p.col, 0.55); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = on ? '#FFFFFF' : rgba('#FFFFFF', 0.4); ctx.stroke();
      ctx.restore();
      const cx = R.x + R.w / 2, cy = R.y + R.h / 2, s = Math.min(R.w, R.h) * (on ? 0.3 : 0.26);
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath();
      if (p.shape === 'circle') circ(ctx, cx, cy, s);
      else if (p.shape === 'star') starPath(ctx, cx, cy, s * 1.2, s * 0.5);
      else if (p.shape === 'tri') { ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 1.1, cy + s * 0.8); ctx.lineTo(cx - s * 1.1, cy + s * 0.8); ctx.closePath(); }
      else rrect(ctx, cx - s * 0.9, cy - s * 0.9, s * 1.8, s * 1.8, 6);
      ctx.fill();
    });
    FX.draw(ctx, 0);
    const msg = this.state === 'show' || this.state === 'intro' ? 'Слушай…' : this.state === 'input' ? 'Твоя очередь!' : this.state === 'good' ? 'Ура!' : 'Ой! Ещё раз…';
    if (!this.done) caption(ctx, msg, World.topUI * 0.78, 1);
  },

function caption(ctx, text, y, a) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = '900 20px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + 32;

  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.fillText(text, World.W / 2, y + 1);
  ctx.restore();
}

'use strict';
// Game state, scenes, loop, input.
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const LOGO = new Image();
LOGO.src = window.LOGO_SRC || '';

const DECAY = { food: 1.1, energy: 0.8, clean: 0.5, fun: 1.4 }; // per minute
const today = () => new Date().toISOString().slice(0, 10);

const Game = {
  s: null, scene: null, t: 0, saveT: 0,
  fresh() {
    return {
      v: 1, robot: 'pik', name: 'Пик', started: false,
      needs: { food: 58, energy: 78, clean: 62, fun: 50 },
      bolts: 30, xp: 0, level: 1,
      stats: { catchGames: 0, boltsTotal: 0, washes: 0, dances: 0, sleeps: 0, kicks: 0, melodies: 0, days: 1, feeds: 0, level: 1 },
      owned: {}, hats: {}, hat: null,
      unlocked: { pik: true, plusha: true, shursh: true },
      demoAll: false, sound: true, last: Date.now(), day: today(), hints: {},
    };
  },
  load() {
    const s = Store.load();
    this.s = Object.assign(this.fresh(), s || {});
    for (const k of ['needs', 'stats']) this.s[k] = Object.assign(this.fresh()[k], (s || {})[k] || {});
    // time away: needs drift, but never to zero; a little gift waits
    const away = clamp((Date.now() - this.s.last) / 60000, 0, 600);
    this.away = away;
    if (s && away > 1) {
      for (const k in DECAY) this.s.needs[k] = Math.max(Math.min(this.s.needs[k], 22), this.s.needs[k] - DECAY[k] * away * 0.5);
    }
    if (this.s.day !== today()) { this.s.stats.days += 1; this.s.day = today(); }
    Snd.on = this.s.sound;
  },
  save() { this.s.last = Date.now(); Store.save(this.s); },
  get def() { return ROBOT_BY_ID[this.s.robot] || ROBOTS[0]; },
  need(k, d) { const n = this.s.needs; n[k] = clamp(n[k] + d, 0, 100); UI.needs(); },
  lowestNeed() { let best = null; for (const k in this.s.needs) if (!best || this.s.needs[k] < best.v) best = { k, v: this.s.needs[k] }; return best; },
  stat(k, n = 1) { this.s.stats[k] = (this.s.stats[k] || 0) + n; this.checkUnlocks(); },
  friend(n) {
    const s = this.s; s.xp += n;
    const need = 10 + s.level * 6;
    if (s.xp >= need) {
      s.xp -= need; s.level++; s.stats.level = s.level;
      UI.toast(`Дружба: уровень ${s.level}!`, 'heart');
      this.addBolts(10, World.cx, World.H * 0.4);
      if (this.scene === Room && Room.robot) { Room.robot.stop(); Room.robot.play(B.celebrate(Room.robot), 3, 'celebrate'); }
      this.checkUnlocks();
    }
    UI.friend();
  },
  addBolts(n, x, y) {
    const tgt = UI.boltTarget();
    const k = Math.min(n, 10);
    for (let i = 0; i < k; i++) {
      const last = i === k - 1, give = last ? n - (k - 1) : 1;
      setTimeout(() => {
        const p = FX.add({ kind: 'fly', x: x + rand(-20, 20), y: y + rand(-20, 20), life: 0.7, s: 1.4, layer: 1 });
        const sx = p.x, sy = p.y, cx = (sx + tgt.x) / 2 + rand(-60, 60), cy = Math.min(sy, tgt.y) - 80;
        p.update = true;
        const t0 = performance.now();
        const step = () => {
          const k2 = clamp((performance.now() - t0) / 700, 0, 1), e = easeIn(k2);
          p.x = lerp(lerp(sx, cx, e), lerp(cx, tgt.x, e), e); p.y = lerp(lerp(sy, cy, e), lerp(cy, tgt.y, e), e);
          if (k2 < 1) requestAnimationFrame(step); else { this.s.bolts += give; this.s.stats.boltsTotal += give; Snd.sfx.coin(1 + rand(0.1)); UI.bolts(true); this.checkUnlocks(); }
        };
        requestAnimationFrame(step);
      }, i * 70);
    }
  },
  dropBolt(x, y) {
    FX.add({ kind: 'bolt', x, y, vy: -260, vx: rand(-60, 60), g: 900, life: 0.6, floor: y + 30, s: 1.3, vr: 8 });
    setTimeout(() => this.addBolts(1, x, y), 500);
  },
  canUse(def) { return def.access === 'start' || this.s.unlocked[def.id] || this.s.demoAll; },
  checkUnlocks() {
    for (const d of ROBOTS) {
      if (d.access !== 'earn' || this.s.unlocked[d.id] || !d.goal) continue;
      if ((this.s.stats[d.goal.stat] || 0) >= d.goal.n) {
        this.s.unlocked[d.id] = true;
        UI.toast(`Новый друг открыт: ${d.name}!`, 'robots');
        Snd.sfx.fanfare();
        UI.badge('robots', true);
      }
    }
  },
  hint(done) {
    const order = ['pet', 'feed', 'knock', 'tap', 'lift'];
    if (done) this.s.hints[done] = true;
    const next = order.find((k) => !this.s.hints[k]);
    UI.hint(next);
  },
  setScene(sc, ...a) { if (this.scene && this.scene.leave) this.scene.leave(); this.scene = sc; if (sc.enter) sc.enter(...a); UI.scene(sc.name); },
  update(dt) {
    const s = this.s;
    if (this.scene === Room && s.started) {
      const m = dt / 60, sleeping = Room.robot && Room.robot.mode === 'sleep';
      s.needs.food = Math.max(0, s.needs.food - DECAY.food * m);
      s.needs.clean = Math.max(0, s.needs.clean - DECAY.clean * m);
      s.needs.fun = Math.max(0, s.needs.fun - DECAY.fun * m * (sleeping ? 0.2 : 1));
      s.needs.energy = clamp(s.needs.energy + (sleeping ? 14 : -DECAY.energy) * m, 0, 100);
      if (sleeping && s.needs.energy >= 99.5) Room.wake(false);
      this.saveT += dt;
      if (this.saveT > 4) { this.saveT = 0; this.save(); UI.needs(); }
    }
  },
};
Room.name = 'room';

// ---------------- boot: the studio logo on the robot's own face ----------------
const Boot = {
  name: 'boot', t: 0, robot: null, started: false,
  enter() {
    this.t = 0; this.started = false;
    this.robot = new Robot(Game.def, World, World.cx, World.H * 0.62);
    this.robot.hat = Game.s.hat;
  },
  down() {
    if (this.started) { if (this.t > 1.2) this.t = Math.max(this.t, 4.4); return; }
    this.started = true; this.t = 0; Snd.init(); Snd.on = Game.s.sound;
    Snd.sfx.lightOn();
  },
  move() {}, up() {},
  update(dt) {
    const r = this.robot;
    if (!this.started) { r.t += dt; return; }
    this.t += dt;
    const t = this.t;
    r.update(dt);
    if (t < 2.6) { r.expr = 'closed'; r.exprUntil = r.t + 1; }
    if (!this.chirp && t > 2.6) { this.chirp = true; r.expr = null; r.face('happy', 1.5); r.say('hello'); r.flap = 1; setTimeout(() => (r.flap = 0), 700); }
    if (!this.snd2 && t > 0.5) { this.snd2 = true; Snd.sfx.sparkle(); }
    if (t > 5.2) {
      if (Game.s.started) { Room.greetOnEnter = true; Game.setScene(Room); }
      else Game.setScene(Choose);
    }
  },
  draw(ctx) {
    const W = World.W, H = World.H, t = this.t, r = this.robot;
    if (World.bgDirty || !World.bg) { World.bg = renderRoomBg(Game.s.owned); World.bgDirty = false; }
    const reveal = clamp((t - 3.2) / 1.4, 0, 1), e = easeInOut(reveal);
    ctx.fillStyle = '#0D0A1E'; ctx.fillRect(0, 0, W, H);
    if (reveal > 0) { ctx.globalAlpha = e; ctx.drawImage(World.bg, 0, 0, W, H); ctx.globalAlpha = 1; }
    // camera: start on the face, pull back to the room
    const P = r.pose();
    const big = Math.min(W * 1.15, H * 0.5) / r.def.head.w;
    const normal = World.S * World.depthScale(World.H * 0.62);
    P.px = lerp(big, normal, e);
    const headCY = (GEO.hipY + GEO.neckBase - GEO.neckLen - r.def.head.h / 2) * P.px;
    P.x = W / 2; P.y = lerp(H * 0.45 - headCY, lerp(World.floorTop, World.floorBottom, 0.62), e);
    P.screen = LOGO.complete && LOGO.naturalWidth ? LOGO : null;
    P.screenK = this.started ? clamp(1 - (t - 2.0) / 0.5, 0, 1) * clamp(t / 0.35, 0, 1) : 0;
    P.alpha = this.started ? clamp(t / 0.25, 0, 1) : 0.0;
    P.shadow = reveal > 0.5;
    if (this.started) drawRobot(ctx, r.def, P);
    // captions
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (!this.started) {
      const k = 0.6 + Math.sin(performance.now() / 400) * 0.4;
      ctx.fillStyle = `rgba(120,240,230,${0.25 + k * 0.25})`;
      ctx.beginPath(); ell(ctx, W / 2, H * 0.45, 70, 16); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.font = '900 26px Nunito, system-ui, sans-serif';
      ctx.fillText('Кто-то живёт', W / 2, H * 0.3); ctx.fillText('в твоём телефоне…', W / 2, H * 0.3 + 34);
      ctx.globalAlpha = 0.65 + k * 0.35; ctx.font = '800 18px Nunito, system-ui, sans-serif';
      ctx.fillText('Коснись экрана, чтобы разбудить', W / 2, H * 0.62);
      ctx.globalAlpha = 1;
    } else if (t > 0.4 && t < 3.3) {
      const a = clamp((t - 0.4) / 0.4, 0, 1) * clamp((3.3 - t) / 0.4, 0, 1);
      ctx.globalAlpha = a; ctx.fillStyle = '#FFFFFF'; ctx.font = '900 22px Nunito, system-ui, sans-serif';
      ctx.fillText('Toysberry Game Studio', W / 2, H * 0.13);
      ctx.font = '700 15px Nunito, system-ui, sans-serif'; ctx.fillStyle = '#BFAEF5';
      ctx.fillText('представляет', W / 2, H * 0.13 + 26);
      ctx.globalAlpha = 1;
    }
    if (reveal > 0.6) {
      ctx.globalAlpha = clamp((reveal - 0.6) / 0.4, 0, 1);
      drawTitle(ctx, W / 2, World.topUI * 0.9);
      ctx.globalAlpha = 1;
    }
  },
};
function drawTitle(ctx, x, y) {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 40px Nunito, system-ui, sans-serif';
  ctx.lineWidth = 8; ctx.strokeStyle = '#3B2A80'; ctx.strokeText('Робогочи', x, y);
  const g = ctx.createLinearGradient(0, y - 20, 0, y + 20); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#BDF7EF');
  ctx.fillStyle = g; ctx.fillText('Робогочи', x, y);
  ctx.restore();
}

// ---------------- choose your baby robot ----------------
const Choose = {
  name: 'choose', bots: [], sel: -1, phase: 'pick', t: 0,
  enter() {
    this.t = 0; this.sel = -1; this.phase = 'pick';
    const y = lerp(World.floorTop, World.floorBottom, 0.55);
    this.bots = ['pik', 'plusha', 'shursh'].map((id, i) => {
      const r = new Robot(ROBOT_BY_ID[id], World, World.W * (0.2 + i * 0.3), y + (i === 1 ? 20 : 0));
      r.scaleMul = 0.62; r.idleT = rand(0.5, 2);
      return r;
    });
    UI.choose(null);
  },
  down(x, y) {
    if (this.phase !== 'pick') return;
    const i = this.bots.findIndex((r) => r.hitTest(x, y));
    if (i < 0) return;
    this.select(i);
  },
  select(i) {
    this.sel = i;
    const r = this.bots[i];
    r.stop(); r.play(B.hello(r), 2);
    this.bots.forEach((b, j) => { b.lookAt(r.x, r.y - 60, 1.5); if (j !== i && !b.busy) b.face('look', 1); });
    UI.choose(r.def);
  },
  confirm() {
    const r = this.bots[this.sel];
    Game.s.robot = r.def.id; Game.s.name = r.def.name;
    this.phase = 'name';
    this.bots.forEach((b, j) => {
      if (j === this.sel) return;
      b.stop(); b.play((function* () { b.face('happy', 2); b.say('hello'); b.flap = 1; yield* wait(0.5); b.flap = 0; yield* walk(b, World.W * 0.52, World.floorTop + 18, 1.2, 5); b.gone = true; })(), 3);
    });
    r.stop(); r.play((function* () { yield* walk(r, World.cx, lerp(World.floorTop, World.floorBottom, 0.62), 1, 4); yield* B.happyHop(r, 1); })(), 3);
    UI.nameStep();
  },
  finish(name) {
    Game.s.name = (name || '').trim().slice(0, 12) || Game.def.name;
    Game.s.started = true; Game.s.unlocked[Game.s.robot] = true;
    Game.save();
    const r = this.bots[this.sel];
    Room.setRobot(Game.def);
    Game.setScene(Room);
    Room.robot.x = r.x; Room.robot.y = r.y;
    Room.robot.play(B.happyHop(Room.robot, 2), 2);
    setTimeout(() => Game.hint(), 1500);
  },
  move() {}, up() {},
  update(dt) {
    this.t += dt;
    for (const r of this.bots) {
      if (r.gone) continue;
      r.update(dt);
      if (this.phase === 'pick' && !r.busy) { r.idleT -= dt; if (r.idleT <= 0) { r.idleT = rand(2, 4); r.play(pick([B.question(r), B[TRAITS[r.def.trait]](r), B.happyHop(r, 1)]), 0); } }
      if (r.gone === undefined && this.phase === 'name' && r !== this.bots[this.sel] && r.y < World.floorTop + 30) r.gone = true;
    }
  },
  draw(ctx) {
    if (World.bgDirty || !World.bg) { World.bg = renderRoomBg(Game.s.owned); World.bgDirty = false; }
    ctx.drawImage(World.bg, 0, 0, World.W, World.H);
    drawDockBack(ctx, false); drawDockFront(ctx, false);
    const list = this.bots.filter((r) => !r.gone).sort((a, b) => a.y - b.y);
    for (const r of list) {
      if (this.phase === 'pick' && this.bots[this.sel] === r) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ell(ctx, r.x, r.y, r.px * 0.5, r.px * 0.12); ctx.fill();
      }
      r.draw(ctx);
    }
    FX.draw(ctx, 0);
    drawTitle(ctx, World.W / 2, World.topUI * 0.55);
  },
};

// ---------------- input ----------------
const Input = { id: null };
function localXY(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', (e) => {
  Snd.init();
  const p = localXY(e);
  Input.id = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (Game.scene && Game.scene.down) Game.scene.down(p.x, p.y, e.pointerId);
  e.preventDefault();
});
window.addEventListener('pointermove', (e) => {
  const p = localXY(e);
  if (Room.dragFood) { Room.moveFood(p.x, p.y); return; }
  if (Input.id === e.pointerId && Game.scene && Game.scene.move) Game.scene.move(p.x, p.y);
});
const endPointer = (e) => {
  const p = localXY(e);
  if (Room.dragFood) { Room.dropFood(); return; }
  if (Input.id === e.pointerId) { Input.id = null; if (Game.scene && Game.scene.up) Game.scene.up(p.x, p.y); }
};
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.s) Game.save(); });

// ---------------- resize & loop ----------------
function resize() {
  const wrap = stage.parentElement;
  const vw = wrap.clientWidth || window.innerWidth, vh = wrap.clientHeight || window.innerHeight;
  let w = vw, h = vh;
  if (w / h > 0.62) w = Math.round(h * 0.5625);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const top = UI.topHeight(), bot = UI.bottomHeight();
  World.layout(w, h, top, bot);
  if (Room.robot) { const p = World.clampFloor(Room.robot.x, Room.robot.y); Room.robot.x = p.x; Room.robot.y = p.y; }
}
window.addEventListener('resize', resize);

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  Game.t += dt;
  const sc = Game.scene;
  if (sc && sc.update) sc.update(dt);
  Game.update(dt);
  FX.update(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (World.shakeAmt > 0.2) { ctx.translate(rand(-1, 1) * World.shakeAmt, rand(-1, 1) * World.shakeAmt); World.shakeAmt *= 0.86; } else World.shakeAmt = 0;
  if (sc && sc.draw) sc.draw(ctx);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FX.draw(ctx, 1);
  drawGlass(ctx);
  requestAnimationFrame(frame);
}
// glass of the phone: soft reflection and rounded inner frame
function drawGlass(ctx) {
  const W = World.W, H = World.H;
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, 'rgba(255,255,255,0.07)'); g.addColorStop(0.35, 'rgba(255,255,255,0)'); g.addColorStop(0.36, 'rgba(255,255,255,0.05)'); g.addColorStop(0.42, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(20,12,40,0.35)';
  ctx.beginPath(); rrect(ctx, -2, -2, W + 4, H + 4, 34); ctx.stroke();
  ctx.restore();
}

function boot() {
  Game.load();
  UI.init();
  resize();
  Room.setRobot(Game.def);
  Room.ensureToys();
  const q = new URLSearchParams(location.search);
  if (q.get('skip') && Game.s.started) Game.setScene(Room);
  else if (q.get('skip')) { Game.setScene(Choose); }
  else Game.setScene(Boot);
  window.__rg = { Game, Room, World, B, Boot, Choose, Games: window.Games };
  // Android shell hooks: Back closes a sheet / leaves a mini-game first; leaving the app saves and mutes
  window.__rgBack = () => {
    if (!UI.$('sheet').hidden) { UI.closeSheet(); return 'stay'; }
    if (!UI.$('tray').hidden) { UI.$('tray').hidden = true; return 'stay'; }
    if (Game.scene && (Game.scene.name === 'catch' || Game.scene.name === 'simon')) { Games.exit(); return 'stay'; }
    Game.save(); return 'exit';
  };
  window.__rgAppPause = () => { Game.save(); Snd.Music.stop(); };
  window.__rgAppResume = () => { Snd.init(); };
  requestAnimationFrame(frame);
}

boot();
</script>
