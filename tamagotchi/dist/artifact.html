/* Robogochie · one-look game UI: dark see-through plates sized to their content, big kid-size buttons */
:root {
  --ink: #FFFFFF;
  --ink-soft: #D9CEFF;
  --plate: rgba(30, 18, 66, 0.46);
  --plate-strong: rgba(30, 18, 66, 0.78);
  --edge: rgba(255, 255, 255, 0.24);
  --night: #0D0A1E;
  --mint: #62F4E6;
  --gold: #FFD34D;
  --pink: #FF5C8A;
  --ok: #6BFF8E;
  --warn: #FFD54A;
  --low: #FF5D5D;
  --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); font-family: var(--font); overflow: hidden; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #2A1F55, #0D0A1E 70%); }
#stage { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--night); }
#cv { position: absolute; inset: 0; display: block; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
button { font-family: var(--font); color: var(--ink); border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
[hidden] { display: none !important; }

.plate { background: var(--plate); border: 1.5px solid var(--edge); border-radius: 999px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-shadow: 0 1px 3px rgba(0,0,0,0.45); }

/* top HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0; display: flex; align-items: center; gap: 8px; pointer-events: none; }
#hud > * { pointer-events: auto; }
.name-plate { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; font-weight: 900; font-size: 18px; }
.lvl { position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
.lvl svg { position: absolute; inset: 0; }
.lvl b { position: relative; font-size: 13px; color: #fff; }
.spacer { flex: 1; }
.bolts { display: flex; align-items: center; gap: 6px; padding: 4px 14px 4px 6px; font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
.bolts svg { width: 30px; height: 30px; }
.bolts.bump { animation: bump 0.25s; }
@keyframes bump { 50% { transform: scale(1.15); } }
.gear { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
.gear svg { width: 22px; height: 22px; }

#needs { position: absolute; top: calc(58px + env(safe-area-inset-top, 0px)); left: 12px; display: flex; gap: 6px; pointer-events: none; }
.need { position: relative; width: 44px; height: 44px; border-radius: 50%; background: var(--plate); border: 1.5px solid var(--edge); display: grid; place-items: center; pointer-events: auto; }
.need svg.ring { position: absolute; inset: -1.5px; width: 44px; height: 44px; transform: rotate(-90deg); }
.need .ic { width: 24px; height: 24px; }
.need.low { animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }

/* bottom action bar */
#bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 8px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.act { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 58px; font-weight: 800; font-size: 11.5px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.act .btn { position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(255,255,255,0.55); box-shadow: 0 4px 0 rgba(0,0,0,0.25), inset 0 3px 0 rgba(255,255,255,0.35); transition: transform 0.08s; }
.act:active .btn { transform: translateY(2px) scale(0.95); }
.act .btn svg { width: 32px; height: 32px; }
.act .dot { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--pink); border: 2px solid #fff; }
.act.on .btn { box-shadow: 0 0 0 4px rgba(98,244,230,0.6), 0 4px 0 rgba(0,0,0,0.25); }

/* food tray */
#tray { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 8px 12px; border-radius: 26px; align-items: center; }
#tray .food { width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,0.12); border: 1.5px solid var(--edge); display: grid; place-items: center; touch-action: none; }
#tray .food canvas { width: 50px; height: 50px; pointer-events: none; }
#tray .tip { font-size: 13px; font-weight: 800; max-width: 84px; line-height: 1.15; color: var(--ink-soft); }

/* compact hint with a finger */
#hint { position: absolute; left: 50%; transform: translateX(-50%); padding: 8px 16px 8px 10px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; white-space: nowrap; }
#hint .finger { font-size: 22px; animation: tapf 1.1s infinite; display: inline-block; }
@keyframes tapf { 50% { transform: translateY(4px) scale(0.92); } }

#toast { position: absolute; left: 50%; top: calc(112px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
#toast .plate { padding: 8px 16px; font-weight: 800; font-size: 15px; white-space: nowrap; animation: toastIn 0.3s ease-out; display: flex; align-items: center; gap: 8px; }
#toast .plate svg { width: 22px; height: 22px; }
@keyframes toastIn { from { transform: translateY(-10px) scale(0.9); opacity: 0; } }

/* bottom sheet: translucent, sized to its content */
#sheet { position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-height: 74%; display: flex; flex-direction: column; background: var(--plate-strong); border: 1.5px solid var(--edge); border-radius: 26px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: sheetIn 0.22s ease-out; }
@keyframes sheetIn { from { transform: translateY(30px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px 18px; }
.sheet-head b { flex: 1; font-size: 20px; font-weight: 900; }
.x { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.14); font-size: 20px; font-weight: 900; }
.tabs { display: flex; gap: 6px; padding: 0 14px 8px; }
.tab { padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.1); font-weight: 800; font-size: 14px; }
.tab.on { background: #fff; color: #2A1A5C; }
#sheetBody { overflow-y: auto; padding: 4px 12px 14px; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.card { position: relative; border-radius: 18px; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.14); padding: 6px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; }
.card.cur { border-color: var(--mint); background: rgba(98,244,230,0.14); }
.card canvas { width: 84px; height: 92px; }
.card .nm { font-weight: 900; font-size: 15px; }
.card .rar { font-size: 11px; font-weight: 800; letter-spacing: 0.02em; }
.card .cond { font-size: 11px; line-height: 1.2; color: var(--ink-soft); min-height: 26px; }
.card .pack { font-size: 11px; font-weight: 800; color: var(--gold); }
.card .price { display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 15px; }
.card .price svg { width: 20px; height: 20px; }
.pill { padding: 5px 12px; border-radius: 999px; font-weight: 900; font-size: 13px; background: #fff; color: #2A1A5C; }
.pill.ghost { background: rgba(255,255,255,0.14); color: #fff; }
.pill.dis { opacity: 0.45; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.game { border-radius: 20px; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; border: 1.5px solid rgba(255,255,255,0.25); min-width: 0; }
.game svg { width: 44px; height: 44px; }
.game b { font-size: 16px; font-weight: 900; }
.game span { font-size: 12px; font-weight: 700; line-height: 1.25; color: rgba(255,255,255,0.85); }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 800; }
.row span { flex: 1; min-width: 0; }
.note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.35; padding: 8px 6px; }

/* choose & name plates */

/* A pocket voice recorder fitted to the existing game sheet. */
#sheet.speech-open {
  color: #302d3c; background: #fff9e8; border: 3px solid #373047;
  box-shadow: 0 5px 0 #252536, 0 12px 30px #190e3145;
  max-height: 88%; border-radius: 24px;
}
#sheet.speech-open .sheet-head {padding: 11px 13px 6px 16px; color:#302d3c;}
#sheet.speech-open .sheet-head b {font-size:20px; letter-spacing:-.035em;}
#sheet.speech-open .sheet-head button {color:#393149;background:#eee7de;width:40px;height:40px;}
#sheet.speech-open #sheetBody {padding:4px 10px 10px; overscroll-behavior:contain; touch-action:pan-y;}
.sp-panel {--sp-ink:#303244; font:800 15px/1.25 var(--font,system-ui,sans-serif); color:var(--sp-ink);}
.sp-panel * {box-sizing:border-box;}
.sp-panel button {font:inherit; color:inherit; touch-action:manipulation;}
.sp-panel button:focus-visible {outline:3px solid #985236;outline-offset:1px;position:relative;z-index:1;}
.sp-panel button:active:not(:disabled) {transform:translateY(2px);}
.sp-radio {border:2px solid #344449;border-radius:17px;min-height:80px;display:flex;align-items:center;gap:8px;padding:3px 12px 3px 4px;
  color:#123f3b;background-color:#9de8cf;background-image:radial-gradient(#4ea98473 1px,transparent 1.4px);background-size:7px 7px;box-shadow:inset 0 -5px #70c5a6;}
.sp-radio canvas {width:63px;height:65px;flex:none;filter:drop-shadow(0 2px 0 #33745940);}
.sp-radio small,.sp-flash small,.sp-count small {display:block;font-size:11px;line-height:1.1;font-weight:900;}
.sp-radio h3,.sp-library h3 {margin:2px 0;font-weight:900;letter-spacing:-.025em;line-height:1.1;font-size:clamp(16px,4.8vw,22px);}
.sp-spectrum {height:14px;display:flex;gap:2px;align-items:center;margin-top:3px;}
.sp-spectrum i {width:4px;border-radius:3px;background:#2e7366;height:4px;}
.sp-spectrum i:nth-child(3n+1) {height:9px;}.sp-spectrum i:nth-child(3n+2) {height:12px;}
.sp-signal .sp-spectrum i {animation:sp-wave .52s ease-in-out infinite alternate;}
.sp-signal .sp-spectrum i:nth-child(2n) {animation-delay:-.36s;}
@keyframes sp-wave { to {transform:scaleY(.42);} }
.sp-count {margin-left:auto;flex:none;width:45px;height:46px;display:grid;align-content:center;text-align:center;color:#efffde;background:#275650;border:2px solid #1d463e;border-radius:11px;}
.sp-count b {font-size:20px;line-height:1.05;}.sp-count small {font-size:10px;}
.sp-tabs {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:11px 0 4px;padding:3px;background:#e9e0cd;border-radius:14px;gap:2px;}
.sp-tabs button {padding:5px 2px;min-height:39px;font-size:14px;border-radius:11px;}
.sp-tabs button[aria-pressed=true] {background:white;box-shadow:0 2px 0 #c1b59e;}
.sp-tabs button:disabled {color:#6f6b64;cursor:default;}
.sp-library {padding:6px 2px 1px;}
.sp-library p {margin:3px 0;font-size:13px;line-height:1.25;}
.sp-grid,.sp-choices {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
.sp-grid {margin-top:8px;}
.sp-panel .sp-card,.sp-panel .sp-flash {--sp-paper:#ffe28b;--sp-edge:#cda755;background:var(--sp-paper);border:2px solid var(--sp-ink);box-shadow:inset 0 -4px var(--sp-edge),0 2px 0 var(--sp-ink);border-radius:13px;}
.sp-panel .sp-g1 {--sp-paper:#ffd2c4;--sp-edge:#e2a99e;}
.sp-panel .sp-g2 {--sp-paper:#d8eaf8;--sp-edge:#abbfd7;}
.sp-card {position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;padding:7px 2px 8px;overflow-wrap:anywhere;}
.sp-card strong {font-size:clamp(22px,6vw,30px);font-weight:900;line-height:1;}
.sp-card.sp-g2 strong {font-size:clamp(13px,3.6vw,18px);}
.sp-picture {display:block;width:26px;height:26px;}.sp-picture svg {width:100%;height:100%;}
.sp-lamps {display:inline-flex;gap:4px;align-items:center;}
.sp-lamps i {width:8px;height:8px;border:1.5px solid #54565d;border-radius:50%;background:#fff2;}
.sp-lamps i.lit {background:#2f896d;border-color:#215e4c;}
.sp-library p.sp-note,.sp-feedback {color:#655f6b;font-size:12px;line-height:1.25;margin:10px 0 0;}
.sp-exercise {text-align:center;padding:4px 2px 1px;}
.sp-ex-top {display:flex;align-items:center;justify-content:space-between;}
.sp-back {text-align:left;min-height:41px;color:#526068!important;padding:0 7px!important;font-size:13px!important;}
.sp-flash {max-width:190px;min-height:72px;margin:0 auto 7px;display:grid;align-content:center;justify-content:center;gap:4px;transform:rotate(-2deg);}
.sp-flash strong {font-size:clamp(28px,7.4vw,40px);line-height:1.05;}
.sp-task {font-size:15px;margin:11px 0 8px;line-height:1.3;}
.sp-choices button,.sp-main,.sp-listen {display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;}
.sp-choices button {font-size:clamp(14px,4vw,20px);min-height:44px;background:#fff;border:2px solid #494354;box-shadow:0 2px 0 #494354;padding:3px;}
.sp-choices button:disabled {opacity:.45;box-shadow:none;}
.sp-main {min-height:46px;min-width:68%;padding:6px 14px!important;background:#b3ebcc!important;border:2px solid #30463b!important;box-shadow:0 2px 0 #30463b;}
.sp-listen {min-height:41px;font-size:13px!important;color:#416958!important;margin:5px auto 0!important;}
.sp-panel button svg {width:18px;height:18px;}.sp-panel .sp-picture svg {width:26px;height:26px;}
.sp-feedback:empty {display:none;}
@media (max-height:620px) {
  #sheet.speech-open {max-height:94%;}
  .sp-radio {min-height:60px;}.sp-radio canvas {width:48px;height:50px;}.sp-card {min-height:56px;}
}
@media (prefers-reduced-motion:reduce) {.sp-signal .sp-spectrum i {animation:none;}}

.sp-panel .sp-tabs .sp-lock {width:12px;height:12px;vertical-align:-1px;}
.sp-associate {margin:12px 0 0;padding:9px 6px 2px;border-top:1px dashed #bdad92;}
.sp-associate h4 {font-size:14px;margin:0 0 7px;}
.sp-associate > div {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;}
.sp-associate button {min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 0;border:1.5px solid #c6beaa;border-radius:11px;background:#fffdf3;font-size:clamp(10px,2.8vw,12px);line-height:1.1;}
.sp-associate button[aria-pressed=true] {background:#b8edd1;border-color:#376454;}
.sp-associate button span {display:grid;place-items:center;border-radius:7px;background:#6e6482;width:26px;height:24px;}
.sp-associate button span svg {width:21px;height:21px;}

.ws-game {
  --paper: #fff5da;
  --night: #293d40;
  --edge: #bb794b;
  --accent: #f6c458;
  --accent-ink: #352c28;
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: clamp(8px, 2.4vh, 23px);
  padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  overflow: auto;
  overscroll-behavior: contain;
  color: var(--night);
  background:
    radial-gradient(ellipse at 12% 18%, #fff9de 0%, transparent 43%),
    repeating-linear-gradient(0deg, #ebd39a30 0px 2px, transparent 2px 5px),
    #f2e5bf;
  font: 800 15px/1.25 var(--font);
  text-shadow: none;
}
.ws-game.ws-bloom {
  --night: #fff3ca;
  --paper: #23374a;
  --edge: #4a6680;
  --accent: #a4efd8;
  --accent-ink: #17364a;
  background:
    radial-gradient(ellipse at 15% 35%, #344269 0%, transparent 56%),
    linear-gradient(160deg, #1d2240, #172c3b 85%);
}
.ws-game .ws-top, .ws-game .ws-bottom, .ws-game .ws-heading {
  width: min(100%, 430px);
}
.ws-game .ws-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ws-game .ws-back, .ws-game .ws-hint, .ws-game .ws-home {
  color: inherit;
  min-height: 44px;
  padding: 8px 14px;
  border: 1.5px solid var(--edge);
  border-radius: 14px;
  font: inherit;
  background: var(--paper);
}
.ws-game .ws-back { font-size: 19px; min-width: 44px; padding: 7px 10px; }
.ws-game .ws-count { display: flex; align-items: center; gap: 5px; padding: 6px 2px; }
.ws-game .ws-token { display: block; width: 22px; height: 14px; border: 2px solid var(--edge); border-radius: 4px; }
.ws-game .ws-token.is-now { background: var(--accent); }
.ws-game .ws-token.is-done { background: #69b59a; border-color: #417c69; }
.ws-bloom .ws-token { border-radius: 65% 35% 65% 35%; width: 16px; height: 16px; }
.ws-game .ws-heading { text-align: center; }
.ws-game h2 { margin: 0; color: inherit; font: 900 clamp(23px, 6.5vw, 34px)/1.08 var(--font); letter-spacing: -.035em; }
.ws-game .ws-progress { margin: 5px 0 0; font-size: 14px; opacity: .82; }
.ws-game .ws-playfield {
  position: relative;
  width: min(100%, 54vh, 420px);
  aspect-ratio: 1;
  flex: none;
  overflow: hidden;
  border-radius: 26px;
  border: 2px solid var(--edge);
  box-shadow: 0 5px 0 var(--edge), 0 10px 20px #27363819;
}
.ws-game .ws-art { display: block; width: 100%; height: 100%; }
.ws-game .ws-tile {
  position: absolute;
  border: 0;
  background: transparent;
  border-radius: 12%;
}
.ws-game .ws-tile:focus-visible { outline: 4px solid #164a81; outline-offset: -5px; }
.ws-game .ws-bottom { display: grid; justify-items: center; gap: 9px; text-align: center; }
.ws-game .ws-say { margin: 0; min-height: 2.5em; max-width: 29ch; font: 850 clamp(15px, 4vw, 19px)/1.25 var(--font); }
.ws-game .ws-keys { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }
.ws-game .ws-big { color: var(--accent-ink); min-height: 48px; padding: 12px 22px; border-radius: 16px; background: var(--accent); box-shadow: 0 4px 0 #333e4a; font: 900 17px var(--font); }
.ws-game button:active { transform: translateY(1px); }
.ws-game .ws-big:disabled { opacity: .65; }
@media (max-height: 580px) {
  .ws-game { gap: 5px; padding: 5px 8px; }
  .ws-game .ws-playfield { width: min(100%, 51vh); }
  .ws-game .ws-top { position: absolute; left: 8px; right: 8px; top: 6px; width: auto; }
  .ws-game .ws-back { min-height: 35px; min-width: 35px; }
  .ws-game .ws-progress { font-size: 12px; }
  .ws-game .ws-tile { min-height: 0; }
  .ws-game h2 { font-size: 20px; }
  .ws-game .ws-bottom { gap: 3px; }
}

.ws-game .ws-heading { display: flex; align-items: center; justify-content: center; gap: 10px; text-align: left; }
.ws-game .ws-mate { display: block; flex: none; height: 64px; width: 61px; border-radius: 45% 45% 38% 38%; background: #fff5cd; border: 1px solid #b5885e80; }
.ws-bloom .ws-mate { background: #3d576a; border-color: #6f8c9e; }
@media (max-width: 345px), (max-height: 580px) {
  .ws-game .ws-mate { width: 42px; height: 44px; }
  .ws-game .ws-heading { gap: 6px; }
}

'use strict';
// ---------- math & helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (v - a) / (b - a);
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const sign = (v) => (v < 0 ? -1 : 1);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOutBack = (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const approach = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
const damp = (v, t, rate, dt) => lerp(v, t, 1 - Math.exp(-rate * dt));

// critically/under-damped spring stored as {x, v}
const S2 = (x = 0) => ({ x, v: 0 });
function spring(s, target, k, d, dt) {
  const a = (target - s.x) * k - s.v * d;
  s.v += a * dt;
  s.x += s.v * dt;
  return s.x;
}

// coroutine helpers: inside generators `t -= yield` receives dt
function* wait(t) { while (t > 0) t -= yield; }
function* waitUntil(fn, max = 30) { while (!fn() && max > 0) max -= yield; }

// ---------- colour ----------
const _rgbCache = {};
function hexRgb(h) {
  if (_rgbCache[h]) return _rgbCache[h];
  let s = h.replace('#', '');
  if (s.length === 3) s = s.split('').map((c) => c + c).join('');
  const n = parseInt(s, 16);

  return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}

}
const lighten = (c, t) => mix(c, '#ffffff', t);
const darken = (c, t) => mix(c, '#1a1030', t);
function rgba(c, a) { const [r, g, b] = hexRgb(c); return `rgba(${r},${g},${b},${a})`; }

// ---------- canvas path helpers ----------
function rrect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function ell(ctx, x, y, rx, ry, rot = 0) { ctx.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot)); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); }
function circ(ctx, x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, Math.abs(r), 0, TAU); }
function starPath(ctx, x, y, r1, r2, n = 5, rot = -Math.PI / 2) {
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = rot + (i * Math.PI) / n;
    i ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function heartPath(ctx, x, y, s) {
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.3, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.3, x, y + s * 0.35);
  ctx.closePath();
}
function hexPath(ctx, x, y, r, rot = 0) {
  for (let i = 0; i < 6; i++) {
    const a = rot + (i * Math.PI) / 3;
    i ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
// fill a path with an outer outline: stroke twice as thick first, then fill over the inner half
function fillOutlined(ctx, fill, outline, lw) {
  ctx.lineJoin = 'round';
  ctx.lineWidth = lw * 2;
  ctx.strokeStyle = outline;
  ctx.stroke();
  ctx.fillStyle = fill;
  ctx.fill();
}

'use strict';
// All sounds are synthesized (no files): squeaky robot voices + toy SFX.
const Snd = (() => {
  let ac = null, out = null, noiseBuf = null, enabled = true;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.15;
    out = ac.createGain(); out.gain.value = 0.8;
    out.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ok = () => ac && enabled && ac.state === 'running';
  function osc(o) {
    if (!ok()) return;
    const { type = 'sine', f0 = 440, f1 = f0, dur = 0.1, vol = 0.2, at = 0, a = 0.006, vib = 0, vibF = 22, glide = 'exp', pan = 0 } = o;
    const t = ac.currentTime + at;
    const os = ac.createOscillator(); os.type = type;
    os.frequency.setValueAtTime(Math.max(20, f0), t);
    if (f1 !== f0) {
      if (glide === 'exp') os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      else os.frequency.linearRampToValueAtTime(Math.max(20, f1), t + dur);
    }
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.setValueAtTime(vol, t + Math.max(a, dur * 0.6));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (vib) {
      const l = ac.createOscillator(); l.frequency.value = vibF;
      const lg = ac.createGain(); lg.gain.value = vib * f0;
      l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + dur + 0.05);
    }
    let node = g;
    if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
    os.connect(g); node.connect(out);
    os.start(t); os.stop(t + dur + 0.05);
  }
  function noise(o) {
    if (!ok()) return;
    const { dur = 0.1, vol = 0.2, at = 0, f = 1500, f1 = f, q = 1, type = 'bandpass', a = 0.004 } = o;
    const t = ac.currentTime + at;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, t);
    if (f1 !== f) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(out);

  // ---- robot voice: contour = list of [startMul, endMul, dur, gap] ----
  const V = {
    hello: [[1.0, 1.28, 0.07, 0.04], [1.5, 1.95, 0.12, 0]],
    happy: [[1.2, 1.5, 0.06, 0.02], [1.35, 1.7, 0.06, 0.02], [1.7, 2.25, 0.11, 0]],
    giggle: [[1.9, 1.6, 0.05, 0.025], [2.1, 1.7, 0.05, 0.025], [1.9, 1.6, 0.05, 0.025], [2.2, 1.8, 0.05, 0.025], [2.0, 1.6, 0.07, 0]],
    question: [[1.0, 1.0, 0.06, 0.03], [1.05, 1.9, 0.17, 0]],
    surprise: [[0.9, 2.6, 0.1, 0]],
    sad: [[1.3, 0.75, 0.38, 0]],
    love: [[1.2, 1.38, 0.16, 0.05], [1.0, 1.18, 0.24, 0]],
    ouch: [[2.3, 1.0, 0.12, 0.04], [1.2, 0.8, 0.1, 0]],
    grumpy: [[0.7, 0.55, 0.12, 0.03], [0.62, 0.45, 0.16, 0]],
    yummy: [[1.0, 1.3, 0.06, 0.02], [1.3, 1.0, 0.06, 0.02], [1.05, 1.7, 0.12, 0]],
    wow: [[1.0, 1.2, 0.06, 0.01], [1.25, 1.5, 0.06, 0.01], [1.5, 1.9, 0.06, 0.01], [2.0, 2.5, 0.14, 0]],
    yes: [[1.3, 1.6, 0.07, 0.03], [1.6, 1.6, 0.07, 0]],

    yawn: [[0.85, 1.3, 0.3, 0], [1.3, 0.6, 0.5, 0]],

  };
  // returns mouth-flap schedule [{t, d}] so the bill moves in sync
  function voice(vc, kind, opts = {}) {
    const contour = kind === 'babble' ? babble(opts.n || 4) : V[kind] || V.beep;
    const base = vc.base * (opts.pitch || 1), sp = 1 / (vc.speed || 1);
    const sched = [];
    let at = opts.at || 0;
    const wave = vc.wave === 'sawtooth' ? 'sawtooth' : vc.wave;
    const vol = (vc.wave === 'square' || vc.wave === 'sawtooth' ? 0.07 : 0.17) * (opts.vol || 1);
    for (const [m0, m1, d, gap] of contour) {
      const j = rand(0.96, 1.04), dd = d * sp;
      osc({ type: wave, f0: base * m0 * j, f1: base * m1 * j, dur: dd, vol, at, vib: kind === 'sad' || kind === 'love' ? 0.03 : 0.012, vibF: kind === 'sad' ? 7 : 24 });

      sched.push({ t: at, d: dd });

  }
  function babble(n) {

  function purr(vc, dur = 1.2) {

    const t = ac.currentTime;
    const os = ac.createOscillator(); os.type = 'triangle'; os.frequency.value = 70 + vc.base * 0.03;
    const am = ac.createOscillator(); am.frequency.value = 22;
    const amg = ac.createGain(); amg.gain.value = 0.5;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }

    step(v = 1) { noise({ dur: 0.04, vol: 0.05 * v, f: 2500, q: 2 }); osc({ f0: 190, f1: 120, dur: 0.05, vol: 0.06 * v }); },
    servo() { osc({ type: 'sawtooth', f0: 260, f1: 380, dur: 0.14, vol: 0.018 }); },

    plop() { osc({ f0: 300, f1: 90, dur: 0.16, vol: 0.2 }); },
    pop(p = 1) { osc({ f0: 900 * p, f1: 1800 * p, dur: 0.06, vol: 0.09 }); },
    bubble() { osc({ f0: rand(500, 900), f1: rand(1200, 2000), dur: 0.07, vol: 0.06 }); },
    coin(p = 1) { osc({ type: 'square', f0: 988 * p, dur: 0.07, vol: 0.05 }); osc({ type: 'square', f0: 1319 * p, dur: 0.16, vol: 0.05, at: 0.07 }); },
    sparkle() { [1568, 2093, 2637, 3136].forEach((f, i) => osc({ type: 'triangle', f0: f, dur: 0.14, vol: 0.05, at: i * 0.05 })); },

// ---- draw_robot.js ----
'use strict';
// Procedural 2D rig of a baby robot. Local units: 1 = robot "size" S (head is ~1 wide).
// Origin = ground point between the feet, y grows downward (canvas).

let DPR = 1;

const HEAD_SHAPES = {
  dome: {
    // Microduck-style cap: big rounded top, flat bottom with soft corners
    path(ctx, w, h) {
      const r = h * 0.2, top = -h / 2, bot = h / 2;
      ctx.moveTo(-w / 2, bot - r);
      ctx.lineTo(-w / 2, top + h * 0.52);
      ctx.bezierCurveTo(-w / 2, top + h * 0.02, -w * 0.3, top, 0, top);
      ctx.bezierCurveTo(w * 0.3, top, w / 2, top + h * 0.02, w / 2, top + h * 0.52);
      ctx.lineTo(w / 2, bot - r);
      ctx.quadraticCurveTo(w / 2, bot, w / 2 - r, bot);
      ctx.lineTo(-w / 2 + r, bot);
      ctx.quadraticCurveTo(-w / 2, bot, -w / 2, bot - r);
      ctx.closePath();
    },
    visor: [0, 0.1, 0.72, 0.5], top: -0.5,
  },
  round: { path(ctx, w, h) { ell(ctx, 0, 0, w / 2, h / 2); }, visor: [0, 0.05, 0.7, 0.52], top: -0.5 },
  box: { path(ctx, w, h) { rrect(ctx, -w / 2, -h / 2, w, h, Math.min(w, h) * 0.32); }, visor: [0, 0.03, 0.76, 0.58], top: -0.5 },
  drop: {
    path(ctx, w, h) {
      const tip = -h / 2 - h * 0.16;
      ctx.moveTo(0, tip);
      ctx.bezierCurveTo(w * 0.14, -h * 0.4, w / 2, -h * 0.12, w / 2, h * 0.12);
      ctx.bezierCurveTo(w / 2, h * 0.42, w * 0.27, h / 2, 0, h / 2);
      ctx.bezierCurveTo(-w * 0.27, h / 2, -w / 2, h * 0.42, -w / 2, h * 0.12);
      ctx.bezierCurveTo(-w / 2, -h * 0.12, -w * 0.14, -h * 0.4, 0, tip);
      ctx.closePath();
    },
    visor: [0, 0.16, 0.66, 0.44], top: -0.66,
  },
  gem: {
    path(ctx, w, h) {
      const p = [[-0.3, -0.5], [0.3, -0.5], [0.5, -0.1], [0.42, 0.36], [0.2, 0.5], [-0.2, 0.5], [-0.42, 0.36], [-0.5, -0.1]];
      p.forEach(([x, y], i) => (i ? ctx.lineTo(x * w, y * h) : ctx.moveTo(x * w, y * h)));
      ctx.closePath();
    },
    visor: [0, 0.06, 0.66, 0.46], top: -0.5,
  },
  pot: {
    path(ctx, w, h) {
      rrect(ctx, -w / 2, -h / 2, w, h * 0.28, h * 0.1);
      const t = -h / 2 + h * 0.2, b = h / 2, r = h * 0.16;
      ctx.moveTo(-w * 0.45, t);
      ctx.lineTo(w * 0.45, t);
      ctx.lineTo(w * 0.38, b - r);
      ctx.quadraticCurveTo(w * 0.37, b, w * 0.38 - r, b);
      ctx.lineTo(-w * 0.38 + r, b);
      ctx.quadraticCurveTo(-w * 0.37, b, -w * 0.38, b - r);
      ctx.closePath();
    },
    visor: [0, 0.16, 0.6, 0.44], top: -0.5,
  },
  cloud: {
    path(ctx, w, h) {
      rrect(ctx, -w / 2, -h * 0.12, w, h * 0.62, h * 0.3);
      circ(ctx, -w * 0.27, -h * 0.08, h * 0.3);
      circ(ctx, w * 0.02, -h * 0.2, h * 0.36);
      circ(ctx, w * 0.29, -h * 0.05, h * 0.27);
    },
    visor: [0, 0.16, 0.7, 0.42], top: -0.5,
  },
};

const GEO = {
  footW: 0.23, footH: 0.1, spread: 0.13, hipX: 0.085, hipY: -0.31, l1: 0.145, l2: 0.145,
  bodyRX: 0.205, bodyRY: 0.172, bodyCY: -0.11, neckBase: -0.24, neckLen: 0.1,
};

function defaultPose() {
  return {
    x: 0, y: 0, px: 140, z: 0, alpha: 1, t: 0,
    roll: 0, pivotX: 0, pivotY: 0, spin: 1,
    tilt: 0, crouch: 0, sit: 0, sqx: 1, sqy: 1, breath: 0,
    headX: 0, headY: 0, headRot: 0, turn: 0, neck: 0,
    lookX: 0, lookY: 0, expr: 'normal', blink: 0, bill: 0, blush: 0,
    wing: 0, ant: 0, prop: 0, beat: 0,
    feet: [{ x: -GEO.spread, y: 0, lift: 0, rot: 0 }, { x: GEO.spread, y: 0, lift: 0, rot: 0 }],
    battery: 0.8, dirt: 0, foam: null, hat: null, shadow: true, glow: 0, zap: 0,
  };
}

function legIK(hx, hy, ax, ay, l1, l2, outward) {
  let dx = ax - hx, dy = ay - hy;
  let d = Math.hypot(dx, dy) || 1e-4;
  const maxd = (l1 + l2) * 0.995;
  if (d > maxd) { ax = hx + (dx / d) * maxd; ay = hy + (dy / d) * maxd; dx = ax - hx; dy = ay - hy; d = maxd; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = hx + (dx / d) * a, my = hy + (dy / d) * a;
  let px = -dy / d, py = dx / d;
  if (px * outward < 0) { px = -px; py = -py; }
  return { kx: mx + px * h, ky: my + py * h, ax, ay };
}

function shadeFill(ctx, col, y0, y1, amt = 1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, lighten(col, 0.28 * amt));
  g.addColorStop(0.45, col);
  g.addColorStop(1, darken(col, 0.22 * amt));
  return g;
}

// ===================== main entry =====================
function drawRobot(ctx, def, P) {
  const c = def.col;
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.scale(P.px, P.px);
  ctx.globalAlpha = P.alpha;
  const lw = 0.016;

  // ground shadow (not lifted)
  if (P.shadow) {
    const zf = clamp(1 - P.z * 0.9, 0.35, 1);
    ctx.fillStyle = 'rgba(40,20,60,0.22)';
    ctx.beginPath();
    ell(ctx, P.roll * 0.35, 0.01, 0.34 * zf * (1 + Math.abs(P.roll) * 0.6), 0.07 * zf);
    ctx.fill();
  }

  ctx.translate(0, -P.z);
  // whole-body roll (falls, dangling) around a pivot
  if (P.roll) {
    ctx.translate(P.pivotX, P.pivotY);
    ctx.rotate(P.roll);
    ctx.translate(-P.pivotX, -P.pivotY);
  }
  if (P.spin !== 1) ctx.scale(P.spin, 1);

  const hipY = GEO.hipY + P.crouch * 0.1 + P.sit * 0.17;
  const ct = Math.cos(P.tilt), st = Math.sin(P.tilt);
  const toLocal = (bx, by) => [bx * ct - by * st, hipY + bx * st + by * ct]; // body frame -> local

  // ---------- wings (behind body) ----------
  const bodyFrame = () => { ctx.translate(0, hipY); ctx.rotate(P.tilt); ctx.scale(P.sqx, P.sqy); };
  ctx.save();
  bodyFrame();
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * 0.165, GEO.bodyCY - 0.03);
    ctx.rotate(s * (0.35 + P.wing));
    ctx.beginPath();
    ell(ctx, s * 0.05, 0.03, 0.06, 0.095);
    fillOutlined(ctx, shadeFill(ctx, c.shell2, -0.06, 0.12), darken(c.shell2, 0.5), lw);
    ctx.restore();
  }
  ctx.restore();

  // ---------- legs & feet ----------
  for (let i = 0; i < 2; i++) {
    const s = i ? 1 : -1;
    const f = P.feet[i];
    const [hx, hy] = toLocal(s * GEO.hipX * P.sqx, 0);
    const ax = f.x, ay = f.y - f.lift - 0.06;
    const k = legIK(hx, hy, ax, ay, GEO.l1, GEO.l2, s);
    ctx.lineCap = 'round';
    ctx.strokeStyle = darken(c.limb, 0.5);
    ctx.lineWidth = 0.075 + lw * 2;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(k.kx, k.ky); ctx.lineTo(k.ax, k.ay); ctx.stroke();
    ctx.strokeStyle = c.limb;
    ctx.lineWidth = 0.075;
    ctx.stroke();
    ctx.strokeStyle = rgba('#ffffff', 0.18);
    ctx.lineWidth = 0.02;
    ctx.beginPath(); ctx.moveTo(hx - s * 0.012, hy); ctx.lineTo(k.kx - s * 0.015, k.ky); ctx.lineTo(k.ax - s * 0.012, k.ay); ctx.stroke();
    // knee
    ctx.beginPath(); circ(ctx, k.kx, k.ky, 0.042);
    fillOutlined(ctx, lighten(c.limb, 0.25), darken(c.limb, 0.5), lw);
    // foot (soft shoe, toes slightly out like a duckling)
    ctx.save();
    ctx.translate(k.ax, k.ay + 0.06 - 0.05);
    ctx.rotate(s * 0.1 + f.rot);
    const fw = GEO.footW, fh = GEO.footH;
    ctx.beginPath(); rrect(ctx, -fw / 2, -fh / 2, fw, fh, fh * 0.48);
    fillOutlined(ctx, shadeFill(ctx, c.foot, -fh / 2, fh / 2), darken(c.foot, 0.5), lw);
    ctx.save(); ctx.clip();
    ctx.fillStyle = darken(c.foot, 0.3);
    ctx.fillRect(-fw / 2, fh * 0.2, fw, fh);
    ctx.fillStyle = rgba('#ffffff', 0.35);
    ctx.beginPath(); ell(ctx, -fw * 0.12, -fh * 0.22, fw * 0.24, fh * 0.14); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // ---------- body ----------
  ctx.save();
  bodyFrame();
  const br = GEO.bodyRX, bry = GEO.bodyRY * (1 + P.breath * 0.03), bcy = GEO.bodyCY;
  ctx.beginPath();
  // egg: a bit wider at the bottom
  ctx.moveTo(0, bcy - bry);
  ctx.bezierCurveTo(br * 0.75, bcy - bry, br, bcy - bry * 0.2, br, bcy + bry * 0.25);
  ctx.bezierCurveTo(br, bcy + bry * 0.85, br * 0.5, bcy + bry, 0, bcy + bry);
  ctx.bezierCurveTo(-br * 0.5, bcy + bry, -br, bcy + bry * 0.85, -br, bcy + bry * 0.25);
  ctx.bezierCurveTo(-br, bcy - bry * 0.2, -br * 0.75, bcy - bry, 0, bcy - bry);
  ctx.closePath();
  const bodyCol = def.deco === 'chrome' ? c.body : c.body;
  fillOutlined(ctx, shadeFill(ctx, bodyCol, bcy - bry, bcy + bry), darken(bodyCol, 0.5), lw);
  ctx.save();
  ctx.clip();
  if (def.deco === 'hazard') {
    ctx.fillStyle = c.shell2;
    for (let i = -6; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 0.07, bcy + 0.06); ctx.lineTo(i * 0.07 + 0.035, bcy + 0.06);
      ctx.lineTo(i * 0.07 + 0.085, bcy + 0.2); ctx.lineTo(i * 0.07 + 0.05, bcy + 0.2); ctx.closePath(); ctx.fill();
    }
  }
  if (def.deco === 'bee') {
    ctx.fillStyle = c.shell2;
    ctx.fillRect(-0.3, bcy + 0.02, 0.6, 0.045);
    ctx.fillRect(-0.3, bcy + 0.1, 0.6, 0.045);
  }
  ctx.fillStyle = rgba('#ffffff', 0.35);
  ctx.beginPath(); ell(ctx, -br * 0.42, bcy - bry * 0.45, br * 0.3, bry * 0.22, -0.4); ctx.fill();
  ctx.restore();
  // belly panel with battery bars (diegetic energy meter)
  const tx = P.turn * 0.035;
  ctx.beginPath(); rrect(ctx, tx - 0.085, bcy - 0.035, 0.17, 0.1, 0.035);
  ctx.fillStyle = rgba(darken(c.visor, 0.1), 0.92); ctx.fill();
  ctx.lineWidth = lw * 0.8; ctx.strokeStyle = rgba('#ffffff', 0.25); ctx.stroke();
  const bars = Math.max(0, Math.ceil(P.battery * 3 - 0.001));
  const bcol = P.battery > 0.5 ? '#6BFF8E' : P.battery > 0.22 ? '#FFD54A' : '#FF5D5D';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); rrect(ctx, tx - 0.06 + i * 0.043, bcy - 0.012, 0.032, 0.054, 0.01);
    if (i < bars) { ctx.shadowColor = bcol; ctx.shadowBlur = 0.04 * P.px * DPR; ctx.fillStyle = bcol; }
    else { ctx.shadowBlur = 0; ctx.fillStyle = rgba('#ffffff', 0.08); }
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // ---------- neck ----------
  const neckTop = GEO.neckBase - GEO.neckLen - P.neck * 0.07;
  const hcx = P.headX + P.turn * 0.01, hBottom = neckTop + P.headY;
  ctx.lineCap = 'round';
  ctx.strokeStyle = darken(c.limb, 0.5); ctx.lineWidth = 0.07 + lw * 2;
  ctx.beginPath(); ctx.moveTo(0, GEO.neckBase + 0.02); ctx.lineTo(hcx, hBottom + 0.02); ctx.stroke();
  ctx.strokeStyle = c.limb; ctx.lineWidth = 0.07; ctx.stroke();
  for (const f of [0.35, 0.7]) {
    ctx.beginPath(); ell(ctx, lerp(0, hcx, f), lerp(GEO.neckBase, hBottom, f), 0.048, 0.018);
    fillOutlined(ctx, lighten(c.limb, 0.3), darken(c.limb, 0.5), lw * 0.7);
  }

  // ---------- head ----------
  const hw = def.head.w, hh = def.head.h;
  ctx.translate(hcx, hBottom - hh / 2);
  ctx.rotate(P.headRot);
  drawHead(ctx, def, P, hw, hh, lw);
  ctx.restore();
  ctx.restore();
}

// ===================== head =====================
function drawHead(ctx, def, P, w, h, lw) {
  const c = def.col, sh = HEAD_SHAPES[def.head.shape], t = P.t;
  const turn = P.turn;
  const topY = sh.top * h;
  const ax = turn * 0.04;

  // --- back layer ---
  if (def.deco === 'saturn') drawRing(ctx, def, w, h, lw, true);
  if (def.topper === 'bunny') {
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * w * 0.2 + ax, topY + h * 0.12);
      ctx.rotate(s * 0.28 + P.ant * 1.3 + s * Math.sin(t * 2.1) * 0.03);
      ctx.beginPath(); ell(ctx, 0, -0.13, 0.075, 0.17);
      fillOutlined(ctx, shadeFill(ctx, c.shell2, -0.3, 0.02), darken(c.shell2, 0.5), lw);
      ctx.beginPath(); ell(ctx, 0, -0.12, 0.038, 0.12); ctx.fillStyle = lighten(c.cheek, 0.25); ctx.fill();
      ctx.restore();
    }
  }
  if (def.topper === 'flame') drawFlame(ctx, ax - w * 0.08, topY + 0.04, t, P);
  if (def.deco === 'bee') {
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * w * 0.3, topY + h * 0.18);
      ctx.rotate(s * (0.5 + Math.sin(t * 40) * 0.25));
      ctx.beginPath(); ell(ctx, s * 0.1, -0.08, 0.13, 0.08, s * 0.3);
      ctx.fillStyle = 'rgba(230,248,255,0.55)'; ctx.fill();
      ctx.lineWidth = lw * 0.8; ctx.strokeStyle = 'rgba(80,110,140,0.6)'; ctx.stroke();
      ctx.restore();
    }
  }

  // --- shell ---
  ctx.beginPath(); sh.path(ctx, w, h);
  const glass = def.deco === 'glass';
  let fill;
  if (def.deco === 'chrome') {
    fill = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
    fill.addColorStop(0, '#FFFFFF'); fill.addColorStop(0.3, '#B9C6D8'); fill.addColorStop(0.48, '#F4F8FF');
    fill.addColorStop(0.62, '#8E9CB3'); fill.addColorStop(1, '#E6EEF8');
  } else if (def.deco === 'facets') {
    fill = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
    fill.addColorStop(0, '#FFE3F6'); fill.addColorStop(0.35, '#D6CCFF'); fill.addColorStop(0.65, '#C8F0FF'); fill.addColorStop(1, '#FFF4C9');
  } else fill = shadeFill(ctx, c.shell, -h / 2, h / 2);
  if (glass) {
    ctx.save(); ctx.globalAlpha *= 0.62;
    fillOutlined(ctx, fill, darken(c.shell, 0.45), lw);
    ctx.restore();
  } else fillOutlined(ctx, fill, darken(def.deco === 'chrome' ? '#8E9CB3' : c.shell, 0.5), lw);

  // --- surface deco & shading inside the head ---
  ctx.save();
  ctx.beginPath(); sh.path(ctx, w, h); ctx.clip();
  drawHeadDeco(ctx, def, P, w, h, lw);
  // soft top-left light & bottom occlusion
  ctx.fillStyle = rgba('#ffffff', glass ? 0.45 : 0.3);
  ctx.beginPath(); ell(ctx, -w * 0.2, -h * 0.3, w * 0.24, h * 0.12, -0.25); ctx.fill();
  ctx.fillStyle = rgba('#ffffff', 0.75);
  ctx.beginPath(); ell(ctx, -w * 0.28, -h * 0.33, w * 0.06, h * 0.035, -0.4); ctx.fill();

  // --- visor screen ---
  const [vcx, vcy, vwf, vhf] = sh.visor;
  const vw = w * vwf * (1 - Math.abs(turn) * 0.08), vh = h * vhf;
  const vx = vcx * w + turn * w * 0.13, vy = vcy * h;
  const lit = def.deco === 'lantern';
  ctx.beginPath(); rrect(ctx, vx - vw / 2, vy - vh / 2, vw, vh, vh * 0.42);
  let vg = ctx.createLinearGradient(0, vy - vh / 2, 0, vy + vh / 2);
  if (lit) {
    const k = 0.75 + P.glow * 0.25 + Math.sin(t * 3) * 0.04;
    vg.addColorStop(0, mix('#FFF0B8', '#FFFFFF', 0.1 * k)); vg.addColorStop(1, mix('#FFB347', '#FF8A2B', 0.3));
  } else { vg.addColorStop(0, lighten(c.visor, 0.12)); vg.addColorStop(1, darken(c.visor, 0.25)); }
  ctx.fillStyle = vg; ctx.fill();
  ctx.lineWidth = lw * 1.2; ctx.strokeStyle = lit ? darken(c.shell, 0.4) : rgba('#000000', 0.35); ctx.stroke();
  ctx.save();
  ctx.clip();
  const sk = P.screenK || 0;
  if (sk > 0 && P.screen) {
    ctx.save(); ctx.globalAlpha *= sk;
    const ih = vh * 0.92, iw = (ih * P.screen.width) / P.screen.height;
    ctx.drawImage(P.screen, vx - iw / 2, vy - ih / 2, iw, ih);
    ctx.restore();
  }
  if (sk < 1) { ctx.save(); ctx.globalAlpha *= 1 - sk; drawFace(ctx, def, P, vx, vy, vw, vh, lit); ctx.restore(); }
  // glass reflection on the screen
  ctx.fillStyle = rgba('#ffffff', 0.09);
  ctx.beginPath();
  ctx.moveTo(vx - vw * 0.5, vy - vh * 0.5); ctx.lineTo(vx - vw * 0.12, vy - vh * 0.5);
  ctx.lineTo(vx - vw * 0.42, vy + vh * 0.5); ctx.lineTo(vx - vw * 0.62, vy + vh * 0.5); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();

  // --- bill (duck beak, Microduck DNA) ---
  if (def.bill) drawBill(ctx, def, P, w, h, lw);

  // --- front layer: toppers, ring, glass domes, hats, dirt ---
  if (def.deco === 'saturn') drawRing(ctx, def, w, h, lw, false);
  if (def.deco === 'fishbowl' || def.deco === 'helmet') drawGlassDome(ctx, def, w, h, lw);
  drawTopper(ctx, def, P, w, h, lw, ax, topY);
  if (P.hat) drawHat(ctx, P.hat, P, w, h, lw, ax, topY);
  if (P.dirt > 0.02) drawDirt(ctx, def, P, w, h);
  if (P.foam) for (const b of P.foam) {
    ctx.beginPath(); circ(ctx, b.x * w, b.y * h, b.r);
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
    ctx.lineWidth = 0.006; ctx.strokeStyle = 'rgba(150,190,230,0.8)'; ctx.stroke();
    ctx.fillStyle = 'rgba(190,225,255,0.7)';
    ctx.beginPath(); circ(ctx, b.x * w + b.r * 0.3, b.y * h + b.r * 0.3, b.r * 0.35); ctx.fill();
  }
  if (P.zap > 0) {
    ctx.strokeStyle = rgba('#FFF27A', P.zap); ctx.lineWidth = 0.02; ctx.shadowColor = '#FFE14A'; ctx.shadowBlur = 0.1 * P.px * DPR;
    for (let i = 0; i < 4; i++) {
      const a = rand(TAU), r0 = w * 0.55;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0 * 0.7);
      ctx.lineTo(Math.cos(a) * (r0 + 0.08) + rand(-0.04, 0.04), Math.sin(a) * (r0 + 0.08) * 0.7);
      ctx.lineTo(Math.cos(a) * (r0 + 0.16), Math.sin(a) * (r0 + 0.16) * 0.7); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
}

function drawHeadDeco(ctx, def, P, w, h, lw) {
  const c = def.col, t = P.t;
  switch (def.deco) {
    case 'rivets': {
      ctx.fillStyle = darken(c.shell, 0.25);
      const pts = def.head.shape === 'box'
        ? [[-0.42, -0.36], [0.42, -0.36], [-0.42, 0.36], [0.42, 0.36]]
        : [[-0.44, 0.0], [0.44, 0.0], [-0.3, -0.36], [0.3, -0.36], [0, -0.45]];
      for (const [x, y] of pts) {
        ctx.beginPath(); circ(ctx, x * w, y * h, 0.022); ctx.fill();
        ctx.fillStyle = rgba('#ffffff', 0.55); ctx.beginPath(); circ(ctx, x * w - 0.006, y * h - 0.007, 0.008); ctx.fill();
        ctx.fillStyle = darken(c.shell, 0.25);
      }
      break;
    }
    case 'glass': {
      // bubbles inside the drop
      for (let i = 0; i < 7; i++) {
        const ph = (t * 0.25 + i * 0.37) % 1;
        const x = Math.sin(i * 12.9 + t * 1.3) * w * 0.3, y = h * 0.4 - ph * h * 1.0;
        ctx.beginPath(); circ(ctx, x, y, 0.012 + (i % 3) * 0.008);
        ctx.strokeStyle = rgba('#ffffff', 0.8 * (1 - ph)); ctx.lineWidth = 0.006; ctx.stroke();
      }
      break;
    }
    case 'band': {
      ctx.fillStyle = c.shell2;
      ctx.fillRect(-w, -h * 0.34, w * 2, h * 0.11);
      ctx.fillStyle = rgba('#ffffff', 0.45);
      for (let i = -5; i <= 5; i++) { ctx.beginPath(); circ(ctx, i * 0.09 + ((t * 0.2) % 0.09), -h * 0.285, 0.014); ctx.fill(); }
      break;
    }
    case 'lantern': {
      ctx.fillStyle = darken(c.shell, 0.25);
      ctx.fillRect(-w, -h * 0.5, w * 2, h * 0.12);
      ctx.fillRect(-w, h * 0.38, w * 2, h * 0.12);
      break;
    }
    case 'tape': {
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); rrect(ctx, -w * 0.3 + i * w * 0.155, -h * 0.5 + 0.005, w * 0.12, h * 0.1, 0.02);
        ctx.fillStyle = i === 1 ? '#FF5E7E' : c.shell2; ctx.fill();
      }
      break;
    }
    case 'stars': {
      for (let i = 0; i < 9; i++) {
        const x = Math.sin(i * 7.7) * w * 0.42, y = -h * 0.42 + Math.abs(Math.cos(i * 3.1)) * h * 0.35;
        const tw = 0.6 + 0.4 * Math.sin(t * 3 + i * 2);
        ctx.fillStyle = rgba('#FFE7A0', tw);
        ctx.beginPath(); starPath(ctx, x, y, 0.022 * tw + 0.008, 0.009, 4); ctx.fill();
      }
      break;
    }
    case 'disco': {
      const n = 9, sz = w / n;
      for (let ix = -n; ix <= n; ix++) for (let iy = -n; iy <= n; iy++) {
        const x = ix * sz, y = iy * sz * 0.9;
        const k = (Math.sin(ix * 12.3 + iy * 7.1) + 1) / 2;
        const tw = Math.max(0, Math.sin(t * 4 + ix * 1.7 + iy * 2.3));
        ctx.fillStyle = mix(mix('#9AA6C8', '#FFFFFF', k), '#FF9AD5', tw * tw * 0.6);
        ctx.fillRect(x - sz / 2 + 0.004, y - sz * 0.45 + 0.004, sz - 0.008, sz * 0.9 - 0.008);
      }
      break;
    }
    case 'facets': {
      ctx.strokeStyle = rgba('#ffffff', 0.7); ctx.lineWidth = 0.008;
      ctx.beginPath();
      ctx.moveTo(-0.3 * w, -0.5 * h); ctx.lineTo(-0.15 * w, -0.25 * h); ctx.lineTo(0.15 * w, -0.25 * h); ctx.lineTo(0.3 * w, -0.5 * h);
      ctx.moveTo(-0.15 * w, -0.25 * h); ctx.lineTo(-0.5 * w, -0.1 * h);
      ctx.moveTo(0.15 * w, -0.25 * h); ctx.lineTo(0.5 * w, -0.1 * h);
      ctx.stroke();
      const sx = ((t * 0.3) % 2) - 0.5;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.moveTo(sx * w, -h); ctx.lineTo(sx * w + 0.06, -h); ctx.lineTo(sx * w - 0.2, h); ctx.lineTo(sx * w - 0.26, h); ctx.fill();
      break;
    }
    case 'bee': {
      ctx.strokeStyle = c.shell2; ctx.lineWidth = h * 0.1;
      for (const k of [0.62, 0.92]) { ctx.beginPath(); ctx.ellipse(0, h * 0.35, w * 0.6 * k + 0.1, h * 0.95 * k, 0, Math.PI, TAU); ctx.stroke(); }
      break;
    }
    case 'chrome': {
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.moveTo(w * 0.1, -h); ctx.lineTo(w * 0.2, -h); ctx.lineTo(w * 0.05, h); ctx.lineTo(-w * 0.05, h); ctx.fill();
      break;
    }
    case 'helmet': {
      ctx.fillStyle = c.shell2;
      ctx.fillRect(-w, h * 0.36, w * 2, h * 0.2);
      break;
    }
    case 'fishbowl': {
      ctx.fillStyle = c.shell2;
      ctx.fillRect(-w, h * 0.38, w * 2, h * 0.16);
      break;
    }
  }
  if (def.head.shape === 'pot') {
    ctx.fillStyle = '#6B4A35';
    ctx.beginPath(); ell(ctx, 0, -h * 0.44, w * 0.42, h * 0.06); ctx.fill();
  }
  if (def.head.shape === 'gem') {
    ctx.strokeStyle = rgba('#ffffff', 0.5); ctx.lineWidth = 0.006;
  }
}

function drawFace(ctx, def, P, vx, vy, vw, vh, lit) {
  const c = def.col;
  const eyeCol = lit ? '#5A3410' : c.eye;
  const glow = lit ? 0 : 0.06 * P.px * DPR;
  const lx = P.lookX * vw * 0.11, ly = P.lookY * vh * 0.13;
  const expr = P.expr;
  ctx.fillStyle = eyeCol; ctx.strokeStyle = eyeCol;
  ctx.shadowColor = eyeCol; ctx.shadowBlur = glow;
  if (def.eyes === 'mono') {
    drawEye(ctx, expr, vx + lx * 0.8, vy - vh * 0.02 + ly, vw * 0.2, vh * 0.66, 1, P, eyeCol, true);
  } else {
    const ex = vw * 0.22, ew = vw * 0.135, eh = vh * 0.48;
    drawEye(ctx, expr, vx - ex + lx, vy - vh * 0.04 + ly, ew, eh, -1, P, eyeCol, false);
    drawEye(ctx, expr, vx + ex + lx, vy - vh * 0.04 + ly, ew, eh, 1, P, eyeCol, false);
  }
  // screen mouth for robots without a bill
  if (!def.bill) {
    const mx = vx + lx * 0.5, my = vy + vh * 0.3 + ly * 0.3;
    ctx.lineCap = 'round'; ctx.lineWidth = vh * 0.07;
    ctx.beginPath();
    if (P.bill > 0.12 || expr === 'surprised') {
      const o = Math.max(P.bill, expr === 'surprised' ? 0.35 : 0);
      ell(ctx, mx, my, vw * (0.04 + o * 0.03), vh * (0.03 + o * 0.11)); ctx.fill();
    } else if (expr === 'sad' || expr === 'grumpy') {
      ctx.arc(mx, my + vh * 0.1, vw * 0.07, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();
    } else if (expr === 'happy' || expr === 'love' || expr === 'star') {
      ctx.moveTo(mx - vw * 0.08, my - vh * 0.02); ctx.quadraticCurveTo(mx, my + vh * 0.16, mx + vw * 0.08, my - vh * 0.02); ctx.closePath(); ctx.fill();
    } else if (expr === 'closed' || expr === 'sleepy') {
      ctx.moveTo(mx - vw * 0.025, my); ctx.lineTo(mx + vw * 0.025, my); ctx.stroke();
    } else {
      ctx.arc(mx, my - vh * 0.05, vw * 0.06, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
  // blush
  if (P.blush > 0.02) {
    ctx.fillStyle = rgba(c.cheek, 0.55 * P.blush);
    for (const s of [-1, 1]) { ctx.beginPath(); ell(ctx, vx + s * vw * 0.36 + lx * 0.6, vy + vh * 0.22, vw * 0.075, vh * 0.08); ctx.fill(); }
  }
}

function drawEye(ctx, expr, cx, cy, ew, eh, side, P, col, mono) {
  const t = P.t;
  ctx.lineCap = 'round';
  const thick = Math.min(ew, eh) * (mono ? 0.32 : 0.55);
  switch (expr) {
    case 'happy': case 'giggle':
      ctx.lineWidth = thick; ctx.beginPath();
      ctx.arc(cx, cy + eh * 0.18, ew * 0.62, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke(); return;
    case 'closed':
      ctx.lineWidth = thick * 0.8; ctx.beginPath();
      ctx.arc(cx, cy - eh * 0.08, ew * 0.6, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); return;
    case 'squint':
      ctx.lineWidth = thick * 0.8; ctx.beginPath();
      ctx.moveTo(cx + side * ew * 0.55, cy - eh * 0.25); ctx.lineTo(cx - side * ew * 0.45, cy); ctx.lineTo(cx + side * ew * 0.55, cy + eh * 0.25); ctx.stroke(); return;
    case 'love': {
      const s = ew * 1.05 * (1 + Math.sin(t * 8) * 0.08);
      ctx.beginPath(); heartPath(ctx, cx, cy + s * 0.15, s); ctx.fill(); return;
    }
    case 'star': {
      ctx.beginPath(); starPath(ctx, cx, cy, ew * 1.05, ew * 0.45, 5, -Math.PI / 2 + Math.sin(t * 5) * 0.2); ctx.fill(); return;
    }
    case 'dizzy': {
      ctx.lineWidth = thick * 0.45; ctx.beginPath();
      for (let i = 0; i <= 28; i++) {
        const a = i * 0.45 + t * 9 * side, r = (i / 28) * ew * 0.9;
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke(); return;
    }
    case 'surprised': {
      ctx.beginPath(); circ(ctx, cx, cy, ew * 0.82); ctx.fill();
      ctx.save(); ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(10,14,30,0.85)'; ctx.beginPath(); circ(ctx, cx + side * ew * 0.08, cy + ew * 0.05, ew * 0.38); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); circ(ctx, cx - ew * 0.2, cy - ew * 0.25, ew * 0.16); ctx.fill();
      ctx.restore(); return;
    }
  }
  // lidded oval (normal / sleepy / sad / grumpy / blink)
  let i0 = -0.62, o0 = -0.62; // lid heights at inner/outer corner (fraction of eh from centre)
  if (expr === 'sleepy') { i0 = o0 = -0.05; }
  else if (expr === 'sad') { i0 = -0.62; o0 = -0.1; }
  else if (expr === 'grumpy') { i0 = -0.05; o0 = -0.58; }
  else if (expr === 'look') { i0 = o0 = -0.3; }
  const b = P.blink;
  i0 = lerp(i0, 0.5, b); o0 = lerp(o0, 0.5, b);
  if (b > 0.9 && expr !== 'sleepy') {
    ctx.beginPath(); rrect(ctx, cx - ew * 0.5, cy + eh * 0.28, ew, eh * 0.09, eh * 0.04); ctx.fill(); return;
  }
  const inner = cx - side * ew * 1.3, outer = cx + side * ew * 1.3;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(inner, cy + i0 * eh); ctx.lineTo(outer, cy + o0 * eh);
  ctx.lineTo(outer, cy + eh); ctx.lineTo(inner, cy + eh); ctx.closePath();
  ctx.clip();
  ctx.beginPath(); ell(ctx, cx, cy, ew / 2 * (mono ? 1.5 : 1), eh / 2); ctx.fill();
  if (mono) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(10,12,24,0.75)'; ctx.beginPath(); circ(ctx, cx, cy, ew * 0.38); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); circ(ctx, cx, cy, ew * 0.2); ctx.fill();
  }
  // sparkle highlight
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); circ(ctx, cx - ew * 0.16, cy - eh * 0.2, Math.min(ew, eh) * 0.16); ctx.fill();
  ctx.restore();
  ctx.fillStyle = col;
}

function drawBill(ctx, def, P, w, h, lw) {
  const c = def.col;
  const shift = P.turn * w * 0.11;
  const bw = w * 0.84 * (1 - Math.abs(P.turn) * 0.06), bh = h * 0.17;
  const by = h * 0.5 - bh * 0.5;
  const open = P.bill;
  // lower jaw drops down; dark mouth with a pink tongue shows in the gap
  const jawH = bh * 0.7, jawY = by + bh * 0.42 + open * h * 0.3;
  if (open > 0.03) {
    ctx.beginPath(); rrect(ctx, shift - bw * 0.33, by + bh * 0.5, bw * 0.66, jawY - by - bh * 0.5 + jawH * 0.6, bh * 0.5);
    ctx.fillStyle = '#2A1020'; ctx.fill();
    ctx.fillStyle = '#FF7FA0';
    ctx.beginPath(); ell(ctx, shift, jawY + jawH * 0.05, bw * 0.16, Math.min(bh * 0.3, open * h * 0.12 + 0.01)); ctx.fill();
  }
  ctx.beginPath(); rrect(ctx, shift - bw * 0.34, jawY, bw * 0.68, jawH, jawH * 0.5);
  fillOutlined(ctx, shadeFill(ctx, darken(c.shell2, 0.08), jawY, jawY + jawH), darken(c.shell2, 0.5), lw);
  // upper bill
  ctx.beginPath(); rrect(ctx, shift - bw / 2, by, bw, bh, bh * 0.46);
  fillOutlined(ctx, shadeFill(ctx, c.shell2, by, by + bh), darken(c.shell2, 0.5), lw);
  ctx.fillStyle = rgba('#ffffff', 0.4);
  ctx.beginPath(); rrect(ctx, shift - bw * 0.38, by + bh * 0.14, bw * 0.5, bh * 0.2, bh * 0.1); ctx.fill();
  ctx.fillStyle = darken(c.shell2, 0.45);
  for (const s of [-1, 1]) { ctx.beginPath(); ell(ctx, shift + s * bw * 0.1, by + bh * 0.52, bw * 0.022, bh * 0.1); ctx.fill(); }
}

function drawRing(ctx, def, w, h, lw, back) {
  ctx.save();
  ctx.rotate(-0.2);
  ctx.beginPath();
  ctx.ellipse(0, h * 0.06, w * 0.78, h * 0.17, 0, back ? Math.PI : 0, back ? TAU : Math.PI);
  ctx.lineCap = 'round';
  ctx.lineWidth = 0.07 + lw * 2; ctx.strokeStyle = darken(def.col.shell2, 0.5); ctx.stroke();
  ctx.lineWidth = 0.07; ctx.strokeStyle = def.col.shell2; ctx.stroke();
  ctx.lineWidth = 0.018; ctx.strokeStyle = rgba('#ffffff', 0.5); ctx.stroke();
  ctx.restore();
}

function drawGlassDome(ctx, def, w, h, lw) {
  ctx.beginPath();
  if (def.deco === 'fishbowl') ell(ctx, 0, -h * 0.02, w * 0.56, h * 0.56);
  else ell(ctx, 0, -h * 0.02, w * 0.54, h * 0.55);
  ctx.fillStyle = 'rgba(220,240,255,0.14)'; ctx.fill();
  ctx.lineWidth = 0.014; ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.stroke();
  ctx.lineWidth = 0.03; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, -h * 0.02, w * 0.46, h * 0.46, 0, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
}

function drawFlame(ctx, x, y, t, P) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.5 + P.ant * 0.6);
  const f = 1 + Math.sin(t * 17) * 0.08 + Math.sin(t * 29) * 0.05;
  const g = ctx.createLinearGradient(0, 0, 0, -0.32 * f);
  g.addColorStop(0, '#FF6A2B'); g.addColorStop(0.6, '#FFB938'); g.addColorStop(1, '#FFF3A0');
  ctx.shadowColor = '#FF9A2B'; ctx.shadowBlur = 0.12 * P.px * DPR;
  ctx.beginPath();
  ctx.moveTo(-0.09, 0);
  ctx.bezierCurveTo(-0.12, -0.12 * f, -0.02, -0.18 * f, 0.02 * Math.sin(t * 11), -0.34 * f);
  ctx.bezierCurveTo(0.05, -0.2 * f, 0.13, -0.12 * f, 0.09, 0);
  ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.restore();
}

function drawTopper(ctx, def, P, w, h, lw, ax, topY) {
  const c = def.col, t = P.t;
  const tp = def.topper;
  ctx.save();
  ctx.translate(ax, topY);
  const stem = (len, tipFn) => {
    const a = P.ant;
    const tx = Math.sin(a) * len, ty = -Math.cos(a) * len;
    ctx.lineCap = 'round';
    ctx.strokeStyle = darken(c.limb, 0.5); ctx.lineWidth = 0.03 + lw * 2;
    ctx.beginPath(); ctx.moveTo(0, 0.02); ctx.quadraticCurveTo(0, -len * 0.5, tx, ty); ctx.stroke();
    ctx.strokeStyle = c.limb; ctx.lineWidth = 0.03; ctx.stroke();
    ctx.beginPath(); rrect(ctx, -0.045, -0.02, 0.09, 0.04, 0.015); fillOutlined(ctx, c.limb, darken(c.limb, 0.5), lw * 0.7);
    tipFn(tx, ty);
  };
  switch (tp) {
    case 'chimney': {
      ctx.translate(-0.12 * w, 0.015);
      ctx.rotate(P.ant * 0.32);
      ctx.beginPath(); rrect(ctx, -0.065, -0.17, 0.13, 0.19, 0.035);
      fillOutlined(ctx, shadeFill(ctx, c.limb, -0.17, 0), darken(c.limb, 0.5), lw);
      ctx.beginPath(); rrect(ctx, -0.095, -0.21, 0.19, 0.067, 0.025);
      fillOutlined(ctx, shadeFill(ctx, c.shell2, -0.21, -0.14), darken(c.shell2, 0.55), lw);
      for (let i = 0; i < 2; i++) {
        const phase = (t * 0.54 + i / 2) % 1;
        ctx.fillStyle = rgba('#B8EDFC', 0.85 * (1 - phase));
        ctx.beginPath(); circ(ctx, Math.sin(phase * 5) * 0.045, -0.23 - phase * 0.17, 0.026 + phase * 0.033); ctx.fill();
      }
      break;
    }
    case 'petals': {
      ctx.translate(0, h * 0.04);
      ctx.rotate(P.ant * 0.4 + Math.sin(t * 2) * 0.045);
      for (let i = -2; i <= 2; i++) {
        ctx.save(); ctx.rotate(i * 0.47);
        ctx.beginPath(); ell(ctx, 0, -0.12, 0.078, 0.135);
        fillOutlined(ctx, shadeFill(ctx, i % 2 ? '#FFABAD' : c.shell2, -0.23, 0.015), '#B95F78', lw * 0.75);
        ctx.beginPath(); ell(ctx, -0.018, -0.16, 0.016, 0.044, 0.1); ctx.fillStyle = '#FFD7C5'; ctx.fill();
        ctx.restore();
      }
      ctx.beginPath(); ell(ctx, 0, -0.012, 0.097, 0.057);
      fillOutlined(ctx, '#FFE079', '#AD7535', lw * 0.75);
      break;
    }
    case 'antenna':
      stem(0.2, (x, y) => {
        ctx.beginPath(); circ(ctx, x, y, 0.052);
        fillOutlined(ctx, shadeFill(ctx, c.shell2, y - 0.05, y + 0.05), darken(c.shell2, 0.5), lw);
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); circ(ctx, x - 0.016, y - 0.016, 0.015); ctx.fill();
      });
      break;
    case 'star':
      stem(0.2, (x, y) => {
        ctx.shadowColor = '#FFE36B'; ctx.shadowBlur = 0.08 * P.px * DPR;
        ctx.beginPath(); starPath(ctx, x, y, 0.07, 0.032, 5, -Math.PI / 2 + P.ant);
        ctx.fillStyle = '#FFE36B'; ctx.fill(); ctx.shadowBlur = 0;
      });
      break;
    case 'springs':
      for (const s of [-1, 1]) {
        ctx.save();
        ctx.translate(s * w * 0.2, h * 0.05);
        const a = P.ant * (1 + s * 0.3) + Math.sin(t * 3 + s) * 0.05;
        ctx.rotate(a + s * 0.15);
        ctx.strokeStyle = '#B97A3C'; ctx.lineWidth = 0.014;
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const yy = -i * 0.0055, xx = Math.sin(i * 0.9) * 0.028;
          i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
        }
        ctx.stroke();
        ctx.beginPath(); circ(ctx, 0, -0.24, 0.045);
        fillOutlined(ctx, shadeFill(ctx, c.shell2, -0.29, -0.2), darken(c.shell2, 0.6), lw);
        ctx.restore();
      }
      break;
    case 'beacon': {
      ctx.beginPath(); rrect(ctx, -0.075, -0.03, 0.15, 0.05, 0.02);
      fillOutlined(ctx, c.shell2, darken(c.shell2, 0.5), lw);
      const on = (Math.sin(t * 5) + 1) / 2;
      ctx.shadowColor = '#FF8A2B'; ctx.shadowBlur = 0.1 * on * P.px * DPR;
      ctx.beginPath(); ctx.arc(0, -0.03, 0.055, Math.PI, 0); ctx.closePath();
      ctx.fillStyle = mix('#FF7A2B', '#FFE08A', on * 0.6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); circ(ctx, -0.018, -0.055, 0.012); ctx.fill();
      break;
    }
    case 'bolt': {
      ctx.fillStyle = '#9AA4B5';
      ctx.fillRect(-0.022, -0.06, 0.044, 0.08);
      ctx.beginPath(); hexPath(ctx, 0, -0.08, 0.065, 0);
      fillOutlined(ctx, shadeFill(ctx, '#C9D1DE', -0.14, -0.02), '#4E566C', lw);
      ctx.strokeStyle = '#5E6880'; ctx.lineWidth = 0.014;
      ctx.beginPath(); ctx.moveTo(-0.035, -0.08); ctx.lineTo(0.035, -0.08); ctx.stroke();
      break;
    }
    case 'nut': {
      ctx.save(); ctx.translate(0, -0.05); ctx.rotate(P.ant * 2 + (P.spin !== 1 ? t * 4 : 0));
      ctx.beginPath(); hexPath(ctx, 0, 0, 0.075, 0);
      fillOutlined(ctx, shadeFill(ctx, c.shell2, -0.07, 0.07), darken(c.shell2, 0.5), lw);
      ctx.beginPath(); circ(ctx, 0, 0, 0.03); ctx.fillStyle = darken(c.shell2, 0.4); ctx.fill();
      ctx.restore();
      break;
    }
    case 'knob':
      stem(0.1, (x, y) => {
        ctx.beginPath(); circ(ctx, x, y, 0.05);
        fillOutlined(ctx, shadeFill(ctx, c.shell2, y - 0.05, y + 0.05), darken(c.shell2, 0.5), lw);
      });
      break;
    case 'handle': {
      ctx.save(); ctx.rotate(P.ant * 0.8);
      ctx.lineCap = 'round';
      ctx.strokeStyle = darken(c.shell, 0.45); ctx.lineWidth = 0.05;
      ctx.beginPath(); ctx.arc(0, 0.02, w * 0.24, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.strokeStyle = lighten(c.shell, 0.15); ctx.lineWidth = 0.025; ctx.stroke();
      ctx.restore();
      break;
    }
    case 'bubbles': {
      ctx.save(); ctx.translate(w * 0.36, h * 0.12);
      ctx.rotate(0.2 + P.ant * 0.4);
      ctx.lineCap = 'round';
      ctx.strokeStyle = darken(c.shell2, 0.5); ctx.lineWidth = 0.055;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -0.2); ctx.quadraticCurveTo(0, -0.26, -0.05, -0.26); ctx.stroke();
      ctx.strokeStyle = c.shell2; ctx.lineWidth = 0.035; ctx.stroke();
      ctx.restore();
      break;
    }
    case 'speakers': {
      for (const s of [-1, 1]) {
        const r = 0.12 * (1 + P.beat * 0.12);
        ctx.save(); ctx.translate(s * (w * 0.5 + 0.02), -topY + 0.0);
        ctx.beginPath(); circ(ctx, 0, 0, r);
        fillOutlined(ctx, shadeFill(ctx, c.shell2, -r, r), darken(c.shell2, 0.5), lw);
        ctx.beginPath(); circ(ctx, 0, 0, r * 0.7); ctx.fillStyle = darken(c.limb, 0.2); ctx.fill();
        ctx.strokeStyle = rgba('#ffffff', 0.25); ctx.lineWidth = 0.008;
        for (const k of [0.25, 0.45]) { ctx.beginPath(); circ(ctx, 0, 0, r * k); ctx.stroke(); }
        ctx.restore();
      }
      break;
    }
    case 'sprout': {
      ctx.save(); ctx.translate(0, h * 0.05); ctx.rotate(P.ant * 0.9);
      ctx.strokeStyle = '#3F7A2A'; ctx.lineWidth = 0.022; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(0.02, -0.1, 0, -0.2); ctx.stroke();
      for (const s of [-1, 1]) {
        ctx.save(); ctx.translate(0, -0.18); ctx.rotate(s * (0.7 + Math.sin(t * 2 + s) * 0.08));
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(s * 0.04, -0.08, s * 0.16, -0.08, s * 0.17, 0); ctx.bezierCurveTo(s * 0.12, 0.04, s * 0.04, 0.03, 0, 0);
        fillOutlined(ctx, shadeFill(ctx, c.shell2, -0.08, 0.03), '#2F5E1E', lw * 0.8);
        ctx.restore();
      }
      ctx.restore();
      break;
    }
    case 'lightning': {
      ctx.save(); ctx.translate(w * 0.12, -0.02); ctx.rotate(0.25 + P.ant * 0.5);
      ctx.shadowColor = '#FFE14A'; ctx.shadowBlur = (0.04 + P.zap * 0.1) * P.px * DPR;
      ctx.beginPath();
      ctx.moveTo(0.02, -0.26); ctx.lineTo(-0.08, -0.08); ctx.lineTo(-0.01, -0.08); ctx.lineTo(-0.05, 0.04); ctx.lineTo(0.08, -0.13); ctx.lineTo(0.01, -0.13); ctx.lineTo(0.06, -0.26); ctx.closePath();
      fillOutlined(ctx, '#FFD84A', '#B07A10', lw);
      ctx.restore();
      break;
    }
  }
  ctx.restore();
}

function drawHat(ctx, hat, P, w, h, lw, ax, topY) {
  ctx.save();
  ctx.translate(ax, topY + 0.03);
  ctx.rotate(P.ant * 0.25);
  switch (hat) {
    case 'bow': {
      ctx.translate(w * 0.24, 0.02); ctx.rotate(0.3);
      ctx.beginPath(); ell(ctx, -0.07, 0, 0.075, 0.05, -0.3); ell(ctx, 0.07, 0, 0.075, 0.05, 0.3);
      fillOutlined(ctx, '#FF5C9A', '#A02358', lw);
      ctx.beginPath(); circ(ctx, 0, 0, 0.032); fillOutlined(ctx, '#FF8DBA', '#A02358', lw);
      break;
    }
    case 'cap': {
      ctx.beginPath(); ctx.ellipse(0, 0.02, w * 0.32, 0.13, 0, Math.PI, TAU); ctx.closePath();
      fillOutlined(ctx, shadeFill(ctx, '#3F8CFF', -0.12, 0.02), '#1B3C7A', lw);
      ctx.beginPath(); ell(ctx, w * 0.06 + P.turn * 0.08, 0.035, w * 0.3, 0.035);
      fillOutlined(ctx, '#2C6FD8', '#1B3C7A', lw);
      ctx.beginPath(); circ(ctx, 0, -0.11, 0.02); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      break;
    }
    case 'party': {
      ctx.rotate(0.15);
      ctx.beginPath(); ctx.moveTo(-0.11, 0.03); ctx.lineTo(0, -0.3); ctx.lineTo(0.11, 0.03); ctx.closePath();
      fillOutlined(ctx, '#7B61FF', '#3A2A8C', lw);
      ctx.save(); ctx.clip(); ctx.strokeStyle = '#FFD84A'; ctx.lineWidth = 0.03;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-0.2, -0.04 - i * 0.08); ctx.lineTo(0.2, 0.02 - i * 0.08); ctx.stroke(); }
      ctx.restore();
      ctx.beginPath(); circ(ctx, 0, -0.31, 0.04); fillOutlined(ctx, '#FF5C9A', '#A02358', lw);
      break;
    }
    case 'phones': {
      ctx.lineCap = 'round'; ctx.strokeStyle = '#2E2E44'; ctx.lineWidth = 0.04;
      ctx.beginPath(); ctx.ellipse(0, -topY - h * 0.05, w * 0.52, h * 0.62, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      for (const s of [-1, 1]) {
        ctx.beginPath(); rrect(ctx, s * w * 0.5 - 0.06, -topY - h * 0.15, 0.12, 0.2, 0.05);
        fillOutlined(ctx, '#FF5C7A', '#7A1E33', lw);
      }
      break;
    }
    case 'propeller': {
      ctx.beginPath(); ctx.ellipse(0, 0.02, w * 0.22, 0.1, 0, Math.PI, TAU); ctx.closePath();
      ctx.save(); ctx.clip();
      const cols = ['#FF5C5C', '#FFD84A', '#4FC3FF', '#6BE07A'];
      for (let i = 0; i < 4; i++) { ctx.fillStyle = cols[i]; ctx.fillRect(-w * 0.22 + i * w * 0.11, -0.1, w * 0.11, 0.14); }
      ctx.restore();
      ctx.lineWidth = lw; ctx.strokeStyle = '#3A2A50'; ctx.beginPath(); ctx.ellipse(0, 0.02, w * 0.22, 0.1, 0, Math.PI, TAU); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#3A2A50'; ctx.fillRect(-0.01, -0.13, 0.02, 0.05);
      const k = Math.cos(P.prop);
      ctx.beginPath(); ell(ctx, 0, -0.135, Math.max(0.01, Math.abs(k) * 0.2), 0.025);
      ctx.fillStyle = '#FF5C5C'; ctx.fill();
      ctx.beginPath(); circ(ctx, 0, -0.135, 0.02); ctx.fillStyle = '#FFD84A'; ctx.fill();
      break;
    }
    case 'crown': {
      ctx.beginPath();
      ctx.moveTo(-0.13, 0.03); ctx.lineTo(-0.15, -0.1); ctx.lineTo(-0.07, -0.04); ctx.lineTo(0, -0.14);
      ctx.lineTo(0.07, -0.04); ctx.lineTo(0.15, -0.1); ctx.lineTo(0.13, 0.03); ctx.closePath();
      fillOutlined(ctx, shadeFill(ctx, '#FFC93C', -0.14, 0.03), '#9A6A00', lw);
      for (const [x, y, cc] of [[0, -0.02, '#FF4F8B'], [-0.08, 0, '#4FC3FF'], [0.08, 0, '#6BE07A']]) {
        ctx.beginPath(); circ(ctx, x, y, 0.018); ctx.fillStyle = cc; ctx.fill();
      }
      break;
    }
  }
  ctx.restore();
}

function drawDirt(ctx, def, P, w, h) {
  const a = P.dirt;
  const spots = [[-0.28, -0.22, 0.07], [0.22, -0.3, 0.05], [0.33, 0.05, 0.06], [-0.36, 0.12, 0.045], [0.05, -0.38, 0.04]];
  for (const [x, y, r] of spots) {
    ctx.fillStyle = `rgba(110,80,50,${0.45 * a})`;
    ctx.beginPath(); ell(ctx, x * w, y * h, r * 1.3, r); ctx.fill();
    ctx.fillStyle = `rgba(90,60,40,${0.35 * a})`;
    ctx.beginPath(); circ(ctx, x * w + r * 0.6, y * h + r * 0.5, r * 0.35); ctx.fill();
  }
}

// ---- fx.js ----
'use strict';
// Particles & little pictograms
const FX = {
  list: [],
  add(p) {
    const o = Object.assign({ t: 0, life: 1, vx: 0, vy: 0, g: 0, rot: 0, vr: 0, s: 1, a: 1, drag: 0 }, p);
    this.list.push(o);
    return o;
  },
  burst(kind, x, y, n = 6, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.dir !== undefined ? o.dir + rand(-o.spread || -0.6, o.spread || 0.6) : rand(TAU);
      const sp = rand(o.min || 60, o.max || 180);
      this.add(Object.assign({ kind, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.6, 1.1), rot: rand(TAU), vr: rand(-6, 6), s: rand(0.7, 1.2) }, o.p || {}));
    }
  },
  text(x, y, str, col = '#FFFFFF', size = 22) { this.add({ kind: 'text', x, y, vy: -60, life: 1.1, str, col, size, drag: 1.5 }); },
  update(dt) {
    for (const p of this.list) {
      p.t += dt;
      p.vy += p.g * dt;
      if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.floor !== undefined && p.y > p.floor) { p.y = p.floor; p.vy *= -0.35; p.vx *= 0.6; p.vr *= 0.5; }
      if (p.kind === 'fly' && p.t >= p.life && p.done) { p.done(); p.done = null; }
    }
    this.list = this.list.filter((p) => p.t < p.life);
  },
  draw(ctx, layer = 0) {
    for (const p of this.list) {
      if ((p.layer || 0) !== layer) continue;
      const k = p.t / p.life, fade = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      ctx.save();
      ctx.globalAlpha = p.a * fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const s = p.s * (p.grow ? 1 + k * p.grow : 1) * (p.pop ? Math.min(1, p.t * 8) : 1);
      ctx.scale(s, s);
      FX.icon(ctx, p.kind, p, k);
      ctx.restore();
    }
  },
  icon(ctx, kind, p = {}, k = 0) {
    switch (kind) {
      case 'heart':
        ctx.fillStyle = p.col || '#FF5C8A'; ctx.beginPath(); heartPath(ctx, 0, 0, 11); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); circ(ctx, -4, -4, 2.5); ctx.fill(); break;
      case 'star':
        ctx.fillStyle = p.col || '#FFD84A'; ctx.beginPath(); starPath(ctx, 0, 0, 10, 4.5); ctx.fill(); break;
      case 'spark':
        ctx.fillStyle = p.col || '#FFFFFF'; ctx.beginPath(); starPath(ctx, 0, 0, 8, 2, 4); ctx.fill(); break;
      case 'z':
        ctx.fillStyle = p.col || '#CFE6FF'; ctx.font = '900 20px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('z', 0, 0); break;
      case 'note':
        ctx.fillStyle = p.col || '#FFE36B';
        ctx.beginPath(); ell(ctx, -3, 6, 6, 4.5, -0.4); ctx.fill(); ctx.fillRect(1.5, -12, 3, 18);
        ctx.beginPath(); ctx.moveTo(4.5, -12); ctx.quadraticCurveTo(13, -9, 10, -1); ctx.lineWidth = 3; ctx.strokeStyle = ctx.fillStyle; ctx.stroke(); break;
      case 'bubble':
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.6; ctx.fillStyle = 'rgba(200,235,255,0.25)';
        ctx.beginPath(); circ(ctx, 0, 0, p.r || 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); circ(ctx, -(p.r || 8) * 0.35, -(p.r || 8) * 0.35, (p.r || 8) * 0.22); ctx.fill(); break;
      case 'crumb':
        ctx.fillStyle = p.col || '#C98A4B'; ctx.fillRect(-3, -3, 6, 6); break;
      case 'dust':
        ctx.fillStyle = p.col || 'rgba(170,150,190,0.55)'; ctx.beginPath(); circ(ctx, 0, 0, 7 + k * 10); ctx.fill(); break;

      case 'confetti':
        ctx.fillStyle = p.col || '#FF5C8A'; ctx.fillRect(-4, -2.5, 8, 5); break;
      case 'text':
        ctx.font = `900 ${p.size || 22}px Nunito, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(40,20,70,0.55)'; ctx.strokeText(p.str, 0, 0);
        ctx.fillStyle = p.col || '#fff'; ctx.fillText(p.str, 0, 0); break;

      case 'ring':

  // currency: a little screw ("винтик")
  boltIcon(ctx, x, y, s, gold = false) {
