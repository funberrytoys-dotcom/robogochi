// ---- robot.js ----
'use strict';
// Robot "brain": procedural walk with planted feet, springs for every joint, scripted reactions as coroutines.

class Robot {
  constructor(def, world, x, y) {
    this.def = def; this.world = world;
    this.x = x; this.y = y; this.z = 0; this.vz = 0;
    this.vx = 0; this.vy = 0; this.target = null; this.speedMul = 1;
    this.scaleMul = 1;
    this.turn = S2(0); this.tilt = S2(0); this.crouch = S2(0); this.sit = S2(0);
    this.roll = S2(0); this.pivot = [0, 0]; this.sq = S2(0); this.spinA = 0;
    this.hx = S2(0); this.hy = S2(0); this.hrot = S2(0); this.neck = S2(0);
    this.ant = S2(0); this.wing = S2(0); this.bill = S2(0); this.blush = S2(0);
    this.poseW = S2(0); this.poseFeet = null;
    this.look = { x: 0, y: 0, tx: 0, ty: 0, at: null, until: 0, sacc: 0 };
    this.expr = null; this.exprUntil = 0; this.baseExpr = 'normal';
    this.blinkT = rand(1, 3); this.blinkK = 0;
    this.feet = [-1, 1].map((s) => ({ s, x: x + s * GEO.spread * this.px, y, lift: 0, swing: false, t: 0, dur: 0.18, sx: 0, sy: 0, tx: 0, ty: 0, rot: 0 }));
    this.co = null; this.coPri = 0; this.coName = '';
    this.held = false; this.hold = null;
    this.talk = []; this.billHold = 0;
    this.t = rand(10); this.idleT = 1.5;
    this.mode = 'stand'; // stand | sit | down | sleep
    this.dirt = 0; this.foam = []; this.hat = null; this.prop = 0; this.flying = 0;
    this.think = null; this.thinkUntil = 0;
    this.headTarget = { rot: 0, x: 0, y: 0 };
    this.wingTarget = 0; this.flap = 0; this.zap = 0; this.glow = 0; this.beat = 0;
    this.lastHead = null; this.tapTimes = [];
    this.battery = 0.8;
    this.P = defaultPose();
  }
  get px() { return this.world.S * this.world.depthScale(this.y) * this.scaleMul; }
  get grounded() { return this.z <= 0.01 && this.vz === 0 && !this.held; }
  get busy() { return !!this.co; }

  // ---------- control ----------
  play(gen, pri = 1, name = '') {
    if (this.co && pri < this.coPri) return false;
    this.co = gen; this.coPri = pri; this.coName = name;
    this.co.next();
    return true;
  }
  stop() { this.co = null; this.coPri = 0; this.coName = ''; this.target = null; this.billHold = 0; this.headTarget = { rot: 0, x: 0, y: 0 }; this.wingTarget = 0; this.flap = 0; }
  say(kind, o) {
    const sched = Snd.voice(this.def.voice, kind, o);
    for (const n of sched) this.talk.push({ t0: this.t + n.t, t1: this.t + n.t + n.d });
    return sched.length ? sched[sched.length - 1].t + sched[sched.length - 1].d : 0;
  }
  face(e, dur = 1.2) { this.expr = e; this.exprUntil = this.t + dur; }
  lookAt(x, y, dur = 1.5) { this.look.at = { x, y }; this.look.until = this.t + dur; }
  walkTo(x, y, speed = 1) { const p = this.world.clampFloor(x, y); this.target = { x: p.x, y: p.y }; this.speedMul = speed; }
  thinkOf(icon, dur = 3) { this.think = icon; this.thinkUntil = this.t + dur; }
  hop(power = 1) { if (this.z <= 0.01 && !this.held) { this.vz = power * this.world.S * 3.2; this.sq.v -= 3; Snd.sfx.hop(); } }
  headWorld() {
    const px = this.px, hh = this.def.head.h;
    const hipY = GEO.hipY + this.crouch.x * 0.1 + this.sit.x * 0.17;
    const ly = hipY + GEO.neckBase - GEO.neckLen - this.neck.x * 0.07 + this.hy.x - hh / 2;
    return { x: this.x + this.hx.x * px, y: this.y - this.z + ly * px, r: this.def.head.w * 0.5 * px };
  }
  hitTest(x, y) {
    const h = this.headWorld(), px = this.px;
    if (Math.abs(this.roll.x) > 0.6) { // lying: one generous circle
      return dist(x, y, this.x + Math.sin(this.roll.x) * 0.6 * px, this.y - 0.3 * px) < 0.75 * px ? 'body' : null;
    }
    const dx = (x - h.x) / (this.def.head.w * 0.56 * px), dy = (y - h.y) / (this.def.head.h * 0.62 * px);
    if (dx * dx + dy * dy < 1) return 'head';
    if (Math.abs(x - this.x) < 0.3 * px && y < this.y - this.z + 0.06 * px && y > h.y) return 'body';
    return null;
  }

  // ---------- per-frame ----------
  update(dt) {
    this.t += dt;
    const S = this.world.S, px = this.px;
    if (this.co) {
      const r = this.co.next(dt);
      if (r.done) { this.co = null; this.coPri = 0; this.coName = ''; }
    }

    // --- locomotion ---
    let moving = false;
    if (this.held) {
      const h = this.hold;
      const prevX = this.x;
      // the finger holds the head; the body hangs below it
      const hangY = h.y + (0.95 + this.def.head.h * 0.5) * px * 0.9;
      this.x = damp(this.x, h.x, 22, dt);
      const fl = this.world.clampFloor(this.x, Math.max(hangY, this.world.floorTop + 5));
      this.y = fl.y;
      this.z = Math.max(0, this.y - hangY);
      this.vz = 0;
      const vx = (this.x - prevX) / Math.max(dt, 1e-3);
      this.pivot = [0, -1.0];
      spring(this.roll, clamp(-vx * 0.0016, -0.7, 0.7), 60, 6, dt);
      this.vx = vx; this.vy = 0;
    } else if (this.z > 0 || this.vz > 0) {
      this.vz -= S * 14 * dt * (this.flying > 0 ? 0.08 : 1) * (this.def.trait === 'float' && this.lowGrav ? 0.35 : 1);
      this.z += this.vz * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      const fl = this.world.clampFloor(this.x, this.y); this.x = fl.x; this.y = fl.y;
      if (this.z <= 0) this.land(-this.vz);
    } else if (this.target) {
      const dx = this.target.x - this.x, dy = this.target.y - this.y, d = Math.hypot(dx, dy);
      const maxV = 1.25 * S * this.world.depthScale(this.y) * this.speedMul * (this.mode === 'sleep' ? 0.6 : 1);
      if (d < 4) { this.target = null; this.vx = damp(this.vx, 0, 12, dt); this.vy = damp(this.vy, 0, 12, dt); }
      else {
        const sp = Math.min(maxV, d * 3.2);
        this.vx = damp(this.vx, (dx / d) * sp, 7, dt);
        this.vy = damp(this.vy, (dy / d) * sp * 0.8, 7, dt);
        moving = true;
      }
      this.x += this.vx * dt; this.y += this.vy * dt;
      const fl = this.world.clampFloor(this.x, this.y); this.x = fl.x; this.y = fl.y;
    } else {
      this.vx = damp(this.vx, 0, 10, dt); this.vy = damp(this.vy, 0, 10, dt);
      this.x += this.vx * dt; this.y += this.vy * dt;
      if (Math.abs(this.vx) + Math.abs(this.vy) > 5) moving = true;
    }
    if (!this.held && this.mode !== 'down') spring(this.roll, 0, 90, 9, dt);

    // --- feet ---
    const planted = !this.held && this.z <= 0.01 && this.mode === 'stand' && Math.abs(this.roll.x) < 0.35 && !this.poseFeet;
    spring(this.poseW, planted ? 0 : 1, 140, 18, dt);
    this.poseW.x = clamp(this.poseW.x, 0, 1);
    let swingSide = 0;
    if (planted) {
      const speed = Math.hypot(this.vx, this.vy), sp01 = clamp(speed / (1.25 * S), 0, 1);
      for (const f of this.feet) {
        if (f.swing) {
          f.t += dt / f.dur;
          const k = Math.min(1, f.t);
          f.x = lerp(f.sx, f.tx, easeInOut(k)); f.y = lerp(f.sy, f.ty, easeInOut(k));
          f.lift = Math.sin(Math.PI * k) * (moving ? 0.075 : 0.045) * px;
          f.rot = Math.sin(Math.PI * k) * -0.25 * f.s;
          swingSide = f.s;
          if (k >= 1) { f.swing = false; f.lift = 0; f.rot = 0; this.crouch.v += moving ? 0.7 : 0.4; Snd.sfx.step(moving ? 0.7 : 0.4); }
        }
      }
      if (!this.feet[0].swing && !this.feet[1].swing) {
        let best = null, bd = 0;
        for (const f of this.feet) {
          const hx = this.x + f.s * GEO.spread * px, hy = this.y;
          const d = Math.hypot(f.x - hx, (f.y - hy) * 1.4);
          if (d > bd) { bd = d; best = f; }
        }
        if (best && bd > (moving ? 0.03 : 0.035) * px) {
          const f = best;
          f.swing = true; f.t = 0; f.dur = moving ? lerp(0.2, 0.14, sp01) : 0.17;
          f.sx = f.x; f.sy = f.y;
          f.tx = this.x + f.s * GEO.spread * px + this.vx * f.dur * 1.1;
          f.ty = this.y + this.vy * f.dur * 1.1;
        }
      }
    } else {
      for (const f of this.feet) { f.swing = false; f.lift = 0; f.x = this.x + f.s * GEO.spread * px; f.y = this.y; }
    }

    // --- body springs ---
    const sitT = this.mode === 'sit' || this.mode === 'sleep' ? 1 : 0;
    spring(this.sit, sitT, 70, 11, dt);
    const tiltT = (swingSide ? -swingSide * 0.08 * (moving ? 1 : 0.6) : 0) + Math.sin(this.t * 1.4) * 0.012 + (this.tiltBias || 0);
    spring(this.tilt, tiltT, 120, 12, dt);
    spring(this.crouch, this.crouchT || 0, 160, 11, dt);
    spring(this.sq, 0, 220, 14, dt);
    const turnT = moving && Math.abs(this.vx) > 8 ? clamp(this.vx / (0.9 * S), -1, 1) : clamp(this.look.x * 0.55, -0.6, 0.6);
    spring(this.turn, this.turnOverride !== undefined ? this.turnOverride : turnT, 60, 11, dt);

    // head follows with lag
    const hw = this.headWorld();
    if (this.lastHead) {
      const dvx = (hw.x - this.lastHead.x) / px, dvy = (hw.y - this.lastHead.y) / px;
      this.hx.v -= dvx * 18; this.hy.v -= dvy * 14;
      this.ant.v -= dvx * 70 + this.hrot.v * dt * 30;
    }
    this.lastHead = hw;
    const ht = this.headTarget;
    spring(this.hx, ht.x, 170, 10, dt);
    spring(this.hy, ht.y + Math.sin(this.t * 2.2 - 0.6) * 0.006, 170, 10, dt);
    spring(this.hrot, ht.rot + this.turn.x * 0.04, 120, 10, dt);
    spring(this.neck, this.neckT || 0, 90, 12, dt);
    spring(this.ant, -(this.tilt.x + this.hrot.x) * 0.8, 110, 4.5, dt);
    this.ant.x = clamp(this.ant.x, -1, 1);
    const flapT = this.flap ? Math.sin(this.t * 26) * 0.55 * this.flap + 0.3 * this.flap : this.wingTarget;
    spring(this.wing, flapT, 300, 14, dt);

    // --- face ---
    this.updateFace(dt);

    // talk -> bill
    let talking = false;
    this.talk = this.talk.filter((n) => n.t1 > this.t);
    for (const n of this.talk) if (this.t >= n.t0 && this.t < n.t1) talking = true;
    spring(this.bill, Math.max(talking ? 0.55 : 0, this.billHold), 520, 26, dt);
    this.bill.x = clamp(this.bill.x, 0, 1.1);

    // propeller / flying
    if (this.hat === 'propeller') this.prop += dt * (this.flying > 0 ? 40 : 3);
    if (this.flying > 0) this.flying -= dt;
    this.zap = Math.max(0, this.zap - dt * 2);
    if (this.think && this.t > this.thinkUntil) this.think = null;
    if (this.foam.length && !this.world.washing) {
      for (const b of this.foam) b.life -= dt;
      this.foam = this.foam.filter((b) => b.life > 0);
    }
  }

  updateFace(dt) {
    const L = this.look;
    if (L.at && this.t < L.until) {
      const h = this.headWorld(), px = this.px;
      L.tx = clamp((L.at.x - h.x) / (px * 1.6), -1, 1);
      L.ty = clamp((L.at.y - h.y) / (px * 1.6), -1, 1);
    } else {
      L.at = null;
      L.sacc -= dt;
      if (L.sacc <= 0) {
        L.sacc = rand(0.8, 2.6);
        if (chance(0.45)) { L.tx = rand(-0.15, 0.15); L.ty = rand(-0.05, 0.2); } // look at the player
        else { L.tx = rand(-0.9, 0.9); L.ty = rand(-0.6, 0.5); }
      }
    }
    L.x = damp(L.x, L.tx, 16, dt); L.y = damp(L.y, L.ty, 16, dt);
    // blink
    this.blinkT -= dt;
    if (this.blinkT <= 0) { this.blinkK = 0.001; this.blinkT = chance(0.2) ? 0.25 : rand(2, 5); }
    if (this.blinkK > 0) { this.blinkK += dt / 0.14; if (this.blinkK >= 1) this.blinkK = 0; }
    if (this.expr && this.t > this.exprUntil) this.expr = null;
    const e = this.expr || this.baseExpr;
    spring(this.blush, e === 'happy' || e === 'love' || e === 'giggle' || e === 'squint' ? 1 : 0, 40, 10, dt);
  }

  land(speed) {
    const S = this.world.S;
    this.z = 0; this.vz = 0;
    this.vx *= 0.3; this.vy *= 0.3;
    const k = clamp(speed / (S * 3.2), 0, 3);
    this.sq.v += 2.5 * k; this.crouch.v += 2.2 * k;
    for (const f of this.feet) { f.x = this.x + f.s * GEO.spread * this.px + rand(-6, 6); f.y = this.y + rand(-3, 3); }
    if (k > 0.3) { Snd.sfx.step(1); FX.burst('dust', this.x, this.y, 4, { min: 30, max: 70, p: { life: 0.5, a: 0.6 } }); }
    if (k > 1.6) Snd.sfx.thud();

  }

  pose() {
    const P = this.P, px = this.px;
    P.x = this.x; P.y = this.y; P.px = px; P.z = this.z / px; P.t = this.t;
    P.roll = this.roll.x; P.pivotX = this.pivot[0]; P.pivotY = this.pivot[1];
    P.spin = this.spinA ? Math.cos(this.spinA) : 1;
    if (Math.abs(P.spin) < 0.08) P.spin = 0.08 * sign(P.spin);
    P.tilt = this.tilt.x; P.crouch = clamp(this.crouch.x, -0.4, 1.3); P.sit = clamp(this.sit.x, 0, 1.1);
    const q = clamp(this.sq.x, -0.4, 0.5);
    P.sqx = 1 + q * 0.5; P.sqy = 1 - q * 0.6;
    P.breath = Math.sin(this.t * 2.2);
    P.headX = this.hx.x; P.headY = this.hy.x; P.headRot = this.hrot.x; P.turn = clamp(this.turn.x, -1, 1); P.neck = this.neck.x;
    P.lookX = this.look.x; P.lookY = this.look.y;
    P.expr = this.expr || this.baseExpr;
    P.blink = this.blinkK > 0 ? Math.sin(Math.PI * this.blinkK) : 0;
    if (P.expr === 'closed' || P.expr === 'happy') P.blink = 0;
    P.bill = this.bill.x; P.blush = clamp(this.blush.x, 0, 1);
    P.wing = this.wing.x; P.ant = this.ant.x; P.prop = this.prop; P.beat = this.beat; P.zap = this.zap; P.glow = this.glow;
    P.battery = this.battery; P.dirt = this.dirt; P.foam = this.foam.length ? this.foam : null; P.hat = this.hat;
    // feet: blend planted world positions with posed ones (sit / held / lying)
    const w = clamp(this.poseW.x, 0, 1);
    const pf = this.poseFeet || this.defaultPoseFeet();
    for (let i = 0; i < 2; i++) {
      const f = this.feet[i], o = P.feet[i], p = pf[i];
      const lx = (f.x - this.x) / px, ly = (f.y - this.y) / px, ll = f.lift / px;
      o.x = lerp(lx, p.x, w); o.y = lerp(ly, p.y, w); o.lift = lerp(ll, p.lift || 0, w); o.rot = lerp(f.rot, p.rot || 0, w);
    }
    return P;
  }
  defaultPoseFeet() {
    const t = this.t;
    if (this.held) {
      const k = Math.sin(t * 13) * 0.035;
      return [{ x: -0.1, y: 0.07 + k, rot: 0.2 }, { x: 0.1, y: 0.07 - k, rot: -0.2 }];
    }
    if (this.mode === 'down') {
      const k = this.kick ? Math.sin(t * 16) * 0.05 : 0;
      return [{ x: -0.14, y: -0.02 + k, rot: 0.3 }, { x: 0.14, y: -0.02 - k, rot: -0.3 }];
    }
    if (this.mode === 'sit' || this.mode === 'sleep') {
      const k = this.kick ? Math.sin(t * 9) * 0.03 : 0;
      return [{ x: -0.2, y: 0.05, lift: Math.max(0, k), rot: -0.35 }, { x: 0.2, y: 0.05, lift: Math.max(0, -k), rot: 0.35 }];
    }
    if (this.z > 0) {
      return [{ x: -0.11, y: 0.03, rot: 0.15 }, { x: 0.11, y: 0.03, rot: -0.15 }];
    }
    return [{ x: -GEO.spread, y: 0 }, { x: GEO.spread, y: 0 }];
  }

  draw(ctx) {
    drawRobot(ctx, this.def, this.pose());
    if (this.think) this.drawThought(ctx);
  }
  drawThought(ctx) {
    const h = this.headWorld(), px = this.px;
    const k = clamp((this.thinkUntil - this.t) * 3, 0, 1) * clamp((this.t - (this.thinkUntil - 3)) * 5, 0, 1);
    const bx = h.x + 0.55 * px, by = h.y - 0.62 * px + Math.sin(this.t * 3) * 3;
    ctx.save();
    ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.strokeStyle = 'rgba(80,60,120,0.35)'; ctx.lineWidth = 2;
    for (const [x, y, r] of [[h.x + 0.3 * px, h.y - 0.36 * px, 4], [h.x + 0.4 * px, h.y - 0.46 * px, 7]]) { ctx.beginPath(); circ(ctx, x, y, r); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); circ(ctx, bx, by, 0.26 * px); ctx.fill(); ctx.stroke();
    ctx.translate(bx, by); ctx.scale(px / 140, px / 140);
    drawNeedIcon(ctx, this.think, 1.5);
    ctx.restore();
  }
}

// pictograms used in thought bubbles and UI-in-canvas
function drawNeedIcon(ctx, icon, s = 1) {
  ctx.save(); ctx.scale(s, s);
  switch (icon) {
    case 'food': drawCookie(ctx, 0, 0, 1); break;
    case 'energy':
      ctx.beginPath(); rrect(ctx, -10, -16, 20, 30, 5); ctx.fillStyle = '#5B6B8A'; ctx.fill();
      ctx.fillRect(-5, -20, 10, 5);
      ctx.beginPath(); rrect(ctx, -6, 4, 12, 7, 2); ctx.fillStyle = '#FF5D5D'; ctx.fill(); break;
    case 'clean': for (const [x, y, r] of [[-7, 4, 8], [6, -2, 10], [2, 10, 6]]) { ctx.save(); ctx.translate(x, y); FX.icon(ctx, 'bubble', { r }, 0); ctx.restore(); } break;
    case 'fun': drawBall(ctx, 0, 0, 13, 0); break;
    case 'love': FX.icon(ctx, 'heart'); break;
    case 'music': FX.icon(ctx, 'note'); break;
    case 'z': FX.icon(ctx, 'z'); break;
    case '?': ctx.fillStyle = '#7B61FF'; ctx.font = '900 30px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, 2); break;
  }
  ctx.restore();
}
function drawCookie(ctx, x, y, s) {
  // a bolt-shaped cookie: hex nut biscuit with sprinkles
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); hexPath(ctx, 0, 0, 15, Math.PI / 6);
  ctx.fillStyle = '#E8A05A'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#A0602A'; ctx.stroke();
  ctx.beginPath(); circ(ctx, 0, 0, 5.5); ctx.fillStyle = '#FFE6C2'; ctx.fill();
  ctx.fillStyle = '#FF6B9A'; ctx.fillRect(-9, -7, 3, 3); ctx.fillStyle = '#5FD3FF'; ctx.fillRect(6, -6, 3, 3); ctx.fillStyle = '#7BE07A'; ctx.fillRect(4, 7, 3, 3);
  ctx.restore();
}
function drawBall(ctx, x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); circ(ctx, 0, 0, r); ctx.fillStyle = '#FF6B6B'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#FFD84A'; ctx.fillRect(-r, -r * 0.25, r * 2, r * 0.5);
  ctx.fillStyle = '#4FC3FF'; ctx.beginPath(); circ(ctx, 0, 0, r * 0.28); ctx.fill();
  ctx.restore();
  ctx.lineWidth = Math.max(1.5, r * 0.1); ctx.strokeStyle = '#B83A4A'; ctx.beginPath(); circ(ctx, 0, 0, r); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); circ(ctx, -r * 0.35, -r * 0.4, r * 0.2); ctx.fill();
  ctx.restore();
}

'use strict';
// Scripted reactions. Each is a generator: `yield` returns dt.
function* walk(r, x, y, speed = 1, max = 8) { r.walkTo(x, y, speed); yield* waitUntil(() => !r.target, max); }
function resetHead(r) { r.headTarget = { rot: 0, x: 0, y: 0 }; r.neckT = 0; r.crouchT = 0; r.tiltBias = 0; r.billHold = 0; r.flap = 0; r.turnOverride = undefined; }

const B = {
  *hello(r) {
    r.face('happy', 1.4); r.flap = 1; r.say('hello');
    r.crouchT = 0.6; yield* wait(0.1); r.crouchT = 0; r.hop(0.7);
    yield* waitUntil(() => r.grounded, 2); r.flap = 0;
    yield* wait(0.3);
  },
  *happyHop(r, n = 2) {
    r.face('happy', n * 0.5 + 0.6); r.say('happy');
    for (let i = 0; i < n; i++) {
      r.crouchT = 0.7; yield* wait(0.08); r.crouchT = 0; r.hop(0.75); r.flap = 1;
      yield* waitUntil(() => r.grounded, 2); r.flap = 0; yield* wait(0.04);
    }
  },
  *spin(r) {
    r.face('happy', 1.2); Snd.sfx.servo(); r.say('wow');
    r.crouchT = 0.5; yield* wait(0.1); r.crouchT = 0; r.hop(0.7);
    let a = 0;
    while (a < TAU) { a += (yield) * 15; r.spinA = Math.min(a, TAU); }
    r.spinA = 0;
    yield* waitUntil(() => r.grounded, 2);
    r.tiltBias = 0.15; yield* wait(0.12); r.tiltBias = -0.1; yield* wait(0.12); r.tiltBias = 0;
  },
  *question(r) {
    r.face('look', 1); r.headTarget.rot = pick([-0.28, 0.28]); r.say('question');
    yield* wait(0.9); resetHead(r);
  },
  *giggle(r, t = 1.1) {
    r.face('giggle', t + 0.3); r.say('giggle'); r.flap = 0.6;
    let k = 0;
    while (k < t) { const dt = yield; k += dt; r.tiltBias = Math.sin(k * 30) * 0.08; r.headTarget.x = Math.sin(k * 30 + 1) * 0.03; }
    resetHead(r);
  },
  *surprised(r) {
    r.face('surprised', 0.8); r.say('surprise'); r.sq.v -= 3; r.neckT = 1;
    yield* wait(0.5); r.neckT = 0; r.face('happy', 0.8); r.say('hum'); yield* wait(0.5);
  },
  *stumble(r) {
    const dir = pick([-1, 1]);
    r.face('surprised', 1.1); r.say('surprise'); r.flap = 1;
    r.tiltBias = dir * 0.35; r.vx = dir * r.world.S * 1.3;
    yield* wait(0.25);
    r.tiltBias = -dir * 0.18; r.vx = -dir * r.world.S * 0.35;
    yield* wait(0.22);
    resetHead(r); r.face('happy', 0.9); r.say('hum'); yield* wait(0.7);
  },
  *fall(r, dir) {
    dir = dir || (r.x < r.world.cx ? 1 : -1);
    r.target = null; r.face('surprised', 2); r.say('ouch'); r.flap = 1;
    for (let i = 0; i < 2; i++) { r.tiltBias = dir * 0.28; yield* wait(0.11); r.tiltBias = -dir * 0.14; yield* wait(0.09); }
    r.tiltBias = 0; r.mode = 'down'; r.pivot = [dir * GEO.spread, 0];
    const rest = dir * 1.1;
    let a = r.roll.x, v = 0;
    while (Math.abs(a) < Math.abs(rest)) { const dt = yield; v += dir * 20 * dt; a += v * dt; r.roll.x = a; r.roll.v = 0; }
    r.roll.x = rest; r.roll.v = -dir * 3;
    Snd.sfx.thud(); World.shake(6);
    const h = r.headWorld();
    FX.burst('dust', r.x + dir * r.px * 0.9, r.y - 4, 7, { min: 40, max: 110, p: { life: 0.7 } });
    r.flap = 0; r.kick = 1; r.face('dizzy', 1.7);
    for (let i = 0; i < 3; i++) FX.add({ kind: 'star', x: r.x + dir * r.px * 0.85 + rand(-20, 20), y: r.y - r.px * 0.35, vy: -50, vx: rand(-40, 40), life: 1.2, s: 0.8, vr: 4 });
    let t = 1.5;
    while (t > 0) { const dt = yield; t -= dt; spring(r.roll, rest, 120, 8, dt); }
    r.kick = 0; r.say('grumpy'); r.face('look', 0.8);
    t = 0;
    while (r.mode === 'down' && t < 2) { const dt = yield; t += dt; spring(r.roll, 0, 30, 4, dt); if (Math.abs(r.roll.x) < 0.3) r.mode = 'stand'; }
    r.mode = 'stand';
    for (const f of r.feet) { f.x = r.x + f.s * GEO.spread * r.px; f.y = r.y; }
    yield* wait(0.35);
    for (let i = 0; i < 4; i++) { r.headTarget.x = (i % 2 ? 1 : -1) * 0.05; yield* wait(0.07); }
    resetHead(r); r.pivot = [0, 0];
    r.face('happy', 1.2); r.say('happy');
    yield* wait(0.6);
  },
  *plop(r) {
    r.face('surprised', 0.5); r.say('ouch'); r.mode = 'sit';
    yield* wait(0.22); Snd.sfx.plop(); r.sq.v += 3; r.face('dizzy', 1); r.kick = 1;
    yield* wait(1.1); r.kick = 0; r.face('giggle', 1); r.say('giggle');
    yield* wait(0.7); r.mode = 'stand'; r.hop(0.4); yield* waitUntil(() => r.grounded, 2);
  },
  *sitIdle(r) {

  *dig(r) {

      yield* wait(0.13); r.billHold = 0; r.headTarget.y = 0.08; yield* wait(0.11);

  *nod(r) {
    r.face('look', 1.2);
    for (let i = 0; i < 2; i++) { r.headTarget.y = 0.07; r.headTarget.rot = 0.06; Snd.sfx.servo(); yield* wait(0.12); r.headTarget.y = -0.02; r.headTarget.rot = 0; yield* wait(0.14); }
    r.say('question'); r.headTarget.rot = 0.25; yield* wait(0.8); resetHead(r);
  },
  *wobble(r) {
    r.face('happy', 1.5); Snd.sfx.bubble();
    for (let i = 0; i < 6; i++) { r.sq.v += (i % 2 ? -1 : 1) * 4; r.tiltBias = (i % 2 ? -1 : 1) * 0.05; yield* wait(0.12); }
    r.tiltBias = 0; r.say('hum'); yield* wait(0.5);
  },
  *glow(r) {
    r.face('happy', 2.2); r.say('hum');
    let t = 0;
    while (t < 2) { const dt = yield; t += dt; r.glow = Math.sin(Math.min(1, t / 2) * Math.PI); if (chance(dt * 6)) FX.add({ kind: 'spark', x: r.x + rand(-40, 40), y: r.headWorld().y + rand(-30, 30), vy: -30, life: 0.8, col: '#FFE9A8', s: 0.6 }); }
    r.glow = 0;
  },
  *bubbles(r) {
    r.face('look', 2.5);
    const h = r.headWorld();
    for (let i = 0; i < 5; i++) {
      const b = FX.add({ kind: 'bubble', x: h.x + r.px * 0.42, y: h.y - r.px * 0.3, vy: -rand(40, 70), vx: rand(-15, 15), life: 2.2, r: rand(5, 11) });
      Snd.sfx.bubble(); r.lookAt(b.x, b.y - 80, 1.5);
      yield* wait(0.3);
    }
    yield* wait(0.8); r.face('happy', 1); r.say('hum'); yield* wait(0.5);
  },
  *dance(r, beats = 8) {
    r.face('happy', beats * 0.5); r.say('hum');
    for (let i = 0; i < beats; i++) {
      const s = i % 2 ? 1 : -1;
      r.tiltBias = s * 0.12; r.headTarget.rot = s * 0.18; r.flap = 0.7; r.crouchT = 0.5; r.beat = 1;

  *pose(r) {
    r.face('star', 1.8); r.say('wow');
    r.poseFeet = [{ x: -0.1, y: 0 }, { x: 0.17, y: -0.02, lift: 0.13, rot: -0.6 }]; r.tiltBias = -0.12; r.flap = 0.4;
    const h = r.headWorld();
    for (let i = 0; i < 4; i++) { FX.add({ kind: 'spark', x: h.x + rand(-40, 40), y: h.y + rand(-30, 10), life: 0.6, s: 1.2, vr: 3 }); Snd.sfx.sparkle(); yield* wait(0.3); }
    r.poseFeet = null; resetHead(r); yield* wait(0.3);
  },
  *grow(r) {
    r.face('closed', 1.2); r.say('hum'); r.crouchT = 0.6;
    yield* wait(0.5); r.crouchT = -0.2; r.ant.v += 8; r.neckT = 1;
    for (let i = 0; i < 6; i++) FX.add({ kind: 'spark', x: r.headWorld().x + rand(-30, 30), y: r.headWorld().y - r.px * 0.45, vy: -40, life: 1, col: '#C9FF9E' });

  *float(r) {
    r.face('happy', 2); r.say('wow'); r.lowGrav = true; r.flap = 1;
    r.crouchT = 0.6; yield* wait(0.12); r.crouchT = 0; r.hop(1.1);
    yield* waitUntil(() => r.grounded, 4); r.lowGrav = false; r.flap = 0;
  },
  *dash(r) {
    const tx = r.x < r.world.cx ? r.world.W * 0.8 : r.world.W * 0.2;
    r.face('grumpy', 0.4); r.crouchT = 0.6; yield* wait(0.3); r.crouchT = 0; r.say('wow');
    r.walkTo(tx, r.y, 2.6);
    while (r.target) { yield; if (chance(0.5)) FX.add({ kind: 'spark', x: r.x - sign(r.vx) * 20, y: r.y - r.px * 0.3, vx: -r.vx * 0.2, life: 0.4, col: '#FFC145', s: 0.6 }); }
    r.tiltBias = -sign(r.vx || 1) * 0.2; FX.burst('dust', r.x, r.y, 6, { min: 30, max: 90 }); Snd.sfx.whoosh();

  },
  *orbit(r) {
    r.face('look', 2.6);
    const h = r.headWorld();
    let a = 0;
    while (a < TAU * 1.5) {
      const dt = yield; a += dt * 4;
      const x = h.x + Math.cos(a) * r.px * 0.9, y = h.y - r.px * 0.2 + Math.sin(a) * r.px * 0.35;

  },
  *zapIt(r) {
    r.zap = 1; Snd.sfx.zap(); r.face('surprised', 0.8); r.hop(0.6);

    r.face('sad', 1.2); r.say('no'); yield* wait(1.2);
  },
  *buzz(r) {
    r.face('happy', 1.6); r.say('giggle');
    for (let i = 0; i < 3; i++) { r.hop(0.45); Snd.sfx.boing(); r.ant.v += 10; yield* waitUntil(() => r.grounded, 2); yield* wait(0.05); }
  },
  *greet(r) {
    const w = r.world;
    r.face('happy', 3); r.say('hello');
    yield* walk(r, clamp(r.x, w.W * 0.3, w.W * 0.7), w.floorBottom - 12, 1.3, 4);
    r.flap = 1; r.say('happy'); r.hop(0.6);
    yield* waitUntil(() => r.grounded, 2); r.flap = 0;
  },
  *yawn(r) {
    r.face('sleepy', 2); r.billHold = 1; r.neckT = 0.8; r.say('yawn');

  },
  *eat(r, kind) {

  *shakeOff(r) {

  *knockReply(r, intervals, pt) {

    while (t < 3) {
      const dt = yield; t += dt;
      r.vz = damp(r.vz, (r.z < r.world.S * 0.9 ? 1 : -0.2) * r.world.S * 0.8, 3, dt);
      r.vx = Math.sin(t * 1.7) * r.world.S * 0.9;
      r.flap = 1;
      if (chance(dt * 8)) FX.add({ kind: 'spark', x: r.x + rand(-20, 20), y: r.y - r.z - r.px * 1.4, life: 0.5, s: 0.5 });
    }
    r.flap = 0; r.flying = 0;
    yield* waitUntil(() => r.grounded, 4);
    r.face('happy', 1); r.say('happy');
  },
  *think(r, icon) {
    r.thinkOf(icon, 3); r.face(icon === 'energy' ? 'sleepy' : 'sad', 1.5); r.say(icon === 'energy' ? 'yawn' : 'sad');
    r.headTarget.rot = 0.18; yield* wait(1.4); resetHead(r); yield* wait(0.6);
  },
};

const TRAITS = { hop: 'happyHop', sit: 'sitIdle', dig: 'dig', nod: 'nod', spin: 'spin', wobble: 'wobble', glow: 'glow', bubbles: 'bubbles', dance: 'dance', pose: 'pose', grow: 'grow', float: 'float', dash: 'dash', orbit: 'orbit', zap: 'zapIt', buzz: 'buzz' };

// ---- room.js ----
'use strict';
// The hideout inside the phone: layout, background, dock, toys, furniture and finger gestures.

const World = {
  W: 390, H: 844, S: 140, cx: 195, floorTop: 400, floorBottom: 720, topUI: 104,
  dock: { x: 80, y: 470 }, shakeAmt: 0, washing: false, night: 0, nightT: 0,
  bg: null, bgDirty: true,
  layout(W, H, topUI = 104, botUI = 112) {
    this.W = W; this.H = H; this.cx = W / 2; this.topUI = topUI;
    this.floorBottom = H - botUI - 6;
    this.floorTop = Math.min(H * 0.48, this.floorBottom - H * 0.25);
    this.S = clamp(Math.min(W * 0.37, (this.floorBottom - topUI) * 0.36), 80, 230);
    this.dock = { x: W * 0.22, y: lerp(this.floorTop, this.floorBottom, 0.2) };
    this.spots = {
      lamp: { x: W * 0.86, y: lerp(this.floorTop, this.floorBottom, 0.12) },
      plant: { x: W * 0.09, y: lerp(this.floorTop, this.floorBottom, 0.82) },
      rug: { x: W * 0.52, y: lerp(this.floorTop, this.floorBottom, 0.6) },
    };
    this.bgDirty = true;
  },
  depthScale(y) { return lerp(0.8, 1.05, clamp(invLerp(this.floorTop, this.floorBottom, y), 0, 1)); },
  clampFloor(x, y) {
    y = clamp(y, this.floorTop + this.H * 0.025, this.floorBottom);
    const t = invLerp(this.floorTop, this.floorBottom, y);
    const m = lerp(this.W * 0.15, this.W * 0.13, t);
    return { x: clamp(x, m, this.W - m), y };
  },
  shake(a) { this.shakeAmt = Math.max(this.shakeAmt, a); },
};

// ---------------- toys ----------------
class Ball {
  constructor(x, y) { this.x = x; this.y = y; this.z = 0; this.vx = 0; this.vy = 0; this.vz = 0; this.rot = 0; this.spin = 0; this.alive = true; this.grab = null; }
  get r() { return 0.13 * World.S * World.depthScale(this.y); }
  update(dt) {
    if (this.grab) return;
    const S = World.S;
    this.vz -= S * 12 * dt; this.z += this.vz * dt;
    if (this.z < 0) { this.z = 0; if (this.vz < -S * 0.8) { this.vz = -this.vz * 0.55; Snd.sfx.pop(0.6); } else this.vz = 0; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    const f = this.z > 0 ? 0.3 : 1.6;
    this.vx *= 1 - f * dt; this.vy *= 1 - f * dt * 1.4;
    const p = World.clampFloor(this.x, this.y);
    if (p.x !== this.x) { this.vx = -this.vx * 0.7; Snd.sfx.pop(0.5); }
    if (p.y !== this.y) this.vy = -this.vy * 0.6;
    this.x = p.x; this.y = p.y;
    this.rot += (this.vx / Math.max(8, this.r)) * dt;
  }
  get moving() { return Math.abs(this.vx) + Math.abs(this.vy) + Math.abs(this.vz) > 25; }
  draw(ctx) {
    const r = this.r;
    ctx.fillStyle = 'rgba(60,30,80,0.2)';
    ctx.beginPath(); ell(ctx, this.x, this.y, r * clamp(1 - this.z / 300, 0.4, 1), r * 0.3); ctx.fill();
    drawBall(ctx, this.x, this.y - r - this.z, r, this.rot);
  }
  hit(x, y) { return dist(x, y, this.x, this.y - this.r - this.z) < this.r * 1.7; }
}

class Food {
  constructor(kind, x, y) { this.kind = kind; this.x = x; this.y = y; this.z = 0; this.vz = 0; this.held = true; this.floorY = y; this.alive = true; this.t = 0; }
  update(dt) {
    this.t += dt;
    if (!this.held && this.z > 0) { this.vz -= World.S * 12 * dt; this.z += this.vz * dt; if (this.z <= 0) { this.z = 0; this.vz = 0; Snd.sfx.plop(); } }
  }

    // night
    if (World.night > 0.01) {
      ctx.fillStyle = `rgba(16,12,48,${0.55 * World.night})`; ctx.fillRect(0, 0, W, H);
      if (own.stars) drawStars(ctx, World.night);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const glow = (x, y, rad, col, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2); };
      glow(World.dock.x, World.dock.y - World.S * 0.5, World.S * 1.2, '#6BFF8E', 0.18 * World.night);
      if (own.lamp) glow(World.spots.lamp.x, World.spots.lamp.y - World.S * 0.6, World.S * 1.6, '#FFB347', 0.32 * World.night);
      ctx.restore();
    }
    for (const f of this.foods) if (f.held) f.draw(ctx);
    if (this.sponge) drawSponge(ctx, this.sponge.x, this.sponge.y);
  },
};

function drawSponge(ctx, x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.25 + Math.sin(performance.now() / 80) * 0.08);
  ctx.beginPath(); rrect(ctx, -26, -18, 52, 36, 10); fillOutlined(ctx, '#FFE066', '#B8941E', 2.5);
  ctx.beginPath(); rrect(ctx, -26, 6, 52, 12, 6); ctx.fillStyle = '#5FD38A'; ctx.fill();
  ctx.fillStyle = 'rgba(184,148,30,0.5)';
  for (const [a, b] of [[-12, -8], [4, -10], [14, -2], [-4, 0]]) { ctx.beginPath(); circ(ctx, a, b, 2.5); ctx.fill(); }
  ctx.restore();
}

function drawFurniturePreview(g, id, w, h) {

'use strict';
// Mini-games: «Лови винтики» (catch) and «Пи-пи-повтори» (Simon), plus a dance party in the room.

function miniWorld(top, bottom, S) {
  return {
    W: World.W, H: World.H, cx: World.W / 2, S, floorTop: top, floorBottom: bottom, washing: false,
    depthScale() { return 1; },
    clampFloor(x, y) { return { x: clamp(x, this.W * 0.12, this.W * 0.88), y: clamp(y, this.floorTop, this.floorBottom) }; },
    shake(a) { World.shake(a); },
  };
}

const Catch = {
  name: 'catch', dur: 40,
  enter() {
    this.t = 0; this.score = 0; this.items = []; this.spawnT = 0.6; this.combo = 0; this.done = false; this.boost = 0;
    this.w = miniWorld(World.H - 150, World.H - 130, World.S * 0.85);
    this.robot = new Robot(Game.def, this.w, World.cx, World.H - 140);
    this.robot.hat = Game.s.hat; this.robot.battery = Game.s.needs.energy / 100;
    this.robot.play(B.hello(this.robot), 2);
    Snd.Music.start(120);
    this.setScore();
  },
  leave() { Snd.Music.stop(); },
  setScore() { UI.$('gScore').querySelector('b').textContent = this.score; },
  down(x) { if (!this.done) this.robot.walkTo(x, this.w.floorBottom - 10, this.boost > 0 ? 3.4 : 2.6); },
  move(x) { this.down(x); },
  up() {},
  spawn() {
    const r = Math.random();
    const kind = r < 0.7 ? 'bolt' : r < 0.8 ? 'gold' : r < 0.88 ? 'battery' : r < 0.95 ? 'heart' : 'oil';
    const k = this.t / this.dur;
    this.items.push({ kind, x: rand(World.W * 0.12, World.W * 0.88), y: 90, vy: this.w.S * lerp(1.4, 2.3, k) * rand(0.9, 1.1), rot: rand(TAU), vr: rand(-3, 3), sway: rand(TAU), alive: true });
  },
  update(dt) {
    const r = this.robot;
    if (!this.done) {
      this.t += dt;
      this.spawnT -= dt;
      if (this.spawnT <= 0) { this.spawn(); this.spawnT = lerp(0.62, 0.36, this.t / this.dur) * rand(0.8, 1.2); }
      UI.$('gTime').style.width = Math.max(0, (1 - this.t / this.dur) * 100) + '%';
      if (this.t >= this.dur) this.finish();
    }
    this.boost = Math.max(0, this.boost - dt);
    r.update(dt);
    const h = r.headWorld(), hr = r.def.head.w * 0.55 * r.px;
    for (const it of this.items) {
      it.y += it.vy * dt; it.x += Math.sin(this.t * 3 + it.sway) * 20 * dt; it.rot += it.vr * dt;
      if (!this.done && dist(it.x, it.y, h.x, h.y - r.px * 0.1) < hr + 14) { it.alive = false; this.caught(it, h); }
      if (it.y > this.w.floorBottom + 10) { it.alive = false; this.combo = 0; FX.burst('dust', it.x, this.w.floorBottom + 5, 3, { min: 20, max: 60, p: { life: 0.4 } }); }
    }
    this.items = this.items.filter((i) => i.alive);
  },
  caught(it, h) {
    const r = this.robot;
    this.combo++;
    r.billHold = 0.7; setTimeout(() => (r.billHold = 0), 120);
    r.sq.v += 2;
    let add = 1;
    if (it.kind === 'gold') { add = 5; r.face('star', 0.8); r.say('wow'); Snd.sfx.sparkle(); }
    else if (it.kind === 'battery') { add = 0; Game.need('energy', 6); r.face('happy', 0.6); FX.text(it.x, it.y - 20, '+энергия', '#6BFF8E', 16); Snd.sfx.ding(); }
    else if (it.kind === 'heart') { add = 0; Game.friend(1); r.face('love', 0.8); r.say('love'); FX.add({ kind: 'heart', x: it.x, y: it.y, vy: -80, life: 1 }); }
    else if (it.kind === 'oil') { add = 0; this.boost = 4; r.face('star', 1); r.say('wow'); FX.text(it.x, it.y - 20, 'Скорость!', '#7FD3FF', 18); Snd.sfx.whoosh(); }
    else { r.face('happy', 0.4); if (this.combo % 5 === 0) r.say('happy'); }
    if (add) {
      this.score += add; this.setScore();
      Snd.sfx.coin(1 + Math.min(this.combo, 10) * 0.04);
      FX.text(it.x, it.y - 20, '+' + add, it.kind === 'gold' ? '#FFD34D' : '#FFFFFF', it.kind === 'gold' ? 26 : 20);
    }
    FX.burst('spark', it.x, it.y, 5, { min: 60, max: 160, p: { life: 0.5, col: it.kind === 'gold' ? '#FFD34D' : '#FFFFFF' } });
  },
  finish() {
    this.done = true; this.items.forEach((i) => (i.vy *= 0.5));
    const r = this.robot, s = Game.s, n = this.score;
    Snd.Music.stop();
    s.bolts += n; s.stats.boltsTotal += n;
    Game.stat('catchGames'); Game.need('fun', 25); Game.friend(3); Game.save();
    r.stop(); r.target = null; r.play(B.celebrate(r), 3);
    const stars = n >= 40 ? 3 : n >= 22 ? 2 : 1;
    Games.result(`Поймано: ${n}`, stars, `+${n} винтиков в копилку`, () => Games.start('catch'));
  },
  draw(ctx) {
    const W = World.W, H = World.H;
    if (World.bgDirty || !World.bg) { World.bg = renderRoomBg(Game.s.owned); World.bgDirty = false; }
    ctx.drawImage(World.bg, 0, 0, W, H);
    ctx.fillStyle = 'rgba(24,12,60,0.45)'; ctx.fillRect(0, 0, W, H);
    // a glowing "conveyor" the robot runs on
    const fy = this.w.floorBottom + 4;
    const g = ctx.createLinearGradient(0, fy - 30, 0, H); g.addColorStop(0, 'rgba(255,190,140,0)'); g.addColorStop(0.3, '#F2C4A6'); g.addColorStop(1, '#E2A07E');
    ctx.fillStyle = g; ctx.fillRect(0, fy - 30, W, H - fy + 30);
    ctx.strokeStyle = 'rgba(255,240,226,0.7)'; ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) { const x = ((i * 50 - this.t * 60) % (W + 50) + W + 50) % (W + 50) - 25; ctx.beginPath(); ctx.moveTo(x, fy + 10); ctx.lineTo(x + 20, H); ctx.stroke(); }
    for (const it of this.items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      ctx.shadowColor = it.kind === 'gold' ? '#FFD34D' : 'rgba(255,255,255,0.7)'; ctx.shadowBlur = 12 * DPR;
      if (it.kind === 'bolt') FX.boltIcon(ctx, 0, 0, 1.5);
      else if (it.kind === 'gold') FX.boltIcon(ctx, 0, 0, 1.8, true);
      else if (it.kind === 'battery') { ctx.rotate(-it.rot); drawNeedIcon(ctx, 'energy', 1.1); }
      else if (it.kind === 'heart') { ctx.rotate(-it.rot); FX.icon(ctx, 'heart'); }
      else { ctx.rotate(-it.rot); drawFood(ctx, 'oil'); }
      ctx.restore();
    }
    if (this.boost > 0) { ctx.fillStyle = `rgba(127,211,255,${0.25 * Math.min(1, this.boost)})`; ctx.beginPath(); ell(ctx, this.robot.x, this.robot.y, 60, 14); ctx.fill(); }
    this.robot.draw(ctx);
    FX.draw(ctx, 0);
    if (this.t < 2.2 && !this.done) caption(ctx, 'Води пальцем и лови винтики!', H * 0.3, clamp((2.2 - this.t) * 2, 0, 1));
  },

const PADS = [
  { col: '#FF5C5C', shape: 'circle', f: 523.25 },
  { col: '#FFD84A', shape: 'star', f: 659.25 },
  { col: '#6BE07A', shape: 'tri', f: 783.99 },
  { col: '#4FC3FF', shape: 'square', f: 1046.5 },

const Simon = {
  name: 'simon',
  enter() {
    this.round = 0; this.won = 0; this.miss = 0; this.seq = []; this.inp = 0; this.state = 'intro'; this.stT = 1.2; this.lit = -1; this.litT = 0; this.done = false; this.t = 0;

    this.robot = new Robot(Game.def, this.w, World.cx, top);
    this.robot.hat = Game.s.hat; this.robot.battery = Game.s.needs.energy / 100;
    this.robot.play(B.hello(this.robot), 2);
    const W = World.W, H = World.H, gap = 12, pw = Math.min((W - 48 - gap) / 2, (H * 0.4 - gap) / 2), x0 = W / 2 - pw - gap / 2, y0 = top + 30;
    this.rects = PADS.map((p, i) => ({ x: x0 + (i % 2) * (pw + gap), y: y0 + Math.floor(i / 2) * (pw * 0.78 + gap), w: pw, h: pw * 0.78 }));

    UI.$('gTime').style.width = '0%';
  },
  leave() {},
  nextRound() {
    this.round++;
    if (this.seq.length === 0) this.seq = [randi(0, 3), randi(0, 3)];
    else this.seq.push(randi(0, 3));
    this.state = 'show'; this.showI = 0; this.stT = 0.7; this.inp = 0;
    UI.$('gTime').style.width = Math.min(100, ((this.round - 1) / 5) * 100) + '%';
  },
  light(i, who) {
    this.lit = i; this.litT = 0.32;
    Snd.sfx.tap(PADS[i].f);
    const r = this.robot, R = this.rects[i];
    r.lookAt(R.x + R.w / 2, R.y + R.h / 2, 0.6);
    if (who === 'robot') { r.billHold = 0.7; setTimeout(() => (r.billHold = 0), 160); r.headTarget.y = 0.05; setTimeout(() => (r.headTarget.y = 0), 160); }
    else { r.headTarget.rot = (i % 2 ? 1 : -1) * 0.15; setTimeout(() => (r.headTarget.rot = 0), 200); }
  },
  down(x, y) {
    if (this.state !== 'input' || this.done) return;
    const i = this.rects.findIndex((R) => x > R.x && x < R.x + R.w && y > R.y && y < R.y + R.h);
    if (i < 0) return;
    this.light(i, 'kid');
    const r = this.robot;
    if (i === this.seq[this.inp]) {
      this.inp++;
      if (this.inp >= this.seq.length) {
        this.won++; this.score += 4; UI.$('gScore').querySelector('b').textContent = this.score;
        Game.stat('melodies');
        this.state = 'good'; this.stT = 1.4;
        r.stop(); r.play(B.happyHop(r, 2), 2);
        FX.burst('star', World.cx, World.H * 0.3, 8, { min: 80, max: 200, p: { life: 0.9 } });
      }

      this.state = 'oops'; this.stT = 1.5;
      Snd.sfx.error(); r.stop(); r.play(B.question(r), 2);

  move() {}, up() {},
  update(dt) {
    this.t += dt;

    if (this.litT > 0) { this.litT -= dt; if (this.litT <= 0) this.lit = -1; }
    if (this.done) return;
    this.stT -= dt;
    if (this.state === 'intro' && this.stT <= 0) this.nextRound();
    else if (this.state === 'show' && this.stT <= 0) {
      if (this.showI < this.seq.length) { this.light(this.seq[this.showI++], 'robot'); this.stT = Math.max(0.42, 0.62 - this.round * 0.03); }
      else { this.state = 'input'; this.inp = 0; this.robot.face('happy', 1); this.robot.say('question'); }
    } else if (this.state === 'good' && this.stT <= 0) {
      if (this.won >= 5) this.finish(); else this.nextRound();
    } else if (this.state === 'oops' && this.stT <= 0) {
      if (this.miss >= 3) this.finish(); else { this.state = 'show'; this.showI = 0; this.stT = 0.5; }
    }
  },
  finish() {

    const r = this.robot; r.stop(); r.play(B.celebrate(r), 3);
    const stars = this.won >= 5 ? 3 : this.won >= 3 ? 2 : 1;
    Games.result(this.won >= 5 ? 'Все мелодии!' : `Мелодий: ${this.won}`, stars, `+${n} винтиков в копилку`, () => Games.start('simon'));
  },
  draw(ctx) {
    const W = World.W, H = World.H;
    if (World.bgDirty || !World.bg) { World.bg = renderRoomBg(Game.s.owned); World.bgDirty = false; }
    ctx.drawImage(World.bg, 0, 0, W, H);
    ctx.fillStyle = 'rgba(24,12,60,0.5)'; ctx.fillRect(0, 0, W, H);
    // little stage
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ell(ctx, World.cx, this.w.floorTop + 2, World.S * 0.7, World.S * 0.12); ctx.fill();
    this.robot.draw(ctx);
    this.rects.forEach((R, i) => {
      const p = PADS[i], on = this.lit === i;
      ctx.save();
      if (on) { ctx.shadowColor = p.col; ctx.shadowBlur = 30 * DPR; }
      ctx.beginPath(); rrect(ctx, R.x, R.y, R.w, R.h, 24);
      ctx.fillStyle = on ? lighten(p.col, 0.35) : rgba(p.col, 0.55); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = on ? '#FFFFFF' : rgba('#FFFFFF', 0.4); ctx.stroke();
      ctx.restore();
      const cx = R.x + R.w / 2, cy = R.y + R.h / 2, s = Math.min(R.w, R.h) * (on ? 0.3 : 0.26);
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath();
      if (p.shape === 'circle') circ(ctx, cx, cy, s);
      else if (p.shape === 'star') starPath(ctx, cx, cy, s * 1.2, s * 0.5);
      else if (p.shape === 'tri') { ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 1.1, cy + s * 0.8); ctx.lineTo(cx - s * 1.1, cy + s * 0.8); ctx.closePath(); }
      else rrect(ctx, cx - s * 0.9, cy - s * 0.9, s * 1.8, s * 1.8, 6);
      ctx.fill();
    });
    FX.draw(ctx, 0);
    const msg = this.state === 'show' || this.state === 'intro' ? 'Слушай…' : this.state === 'input' ? 'Твоя очередь!' : this.state === 'good' ? 'Ура!' : 'Ой! Ещё раз…';
    if (!this.done) caption(ctx, msg, World.topUI * 0.78, 1);
  },
};

function caption(ctx, text, y, a) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = '900 20px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + 32;
  ctx.fillStyle = 'rgba(30,18,66,0.55)'; ctx.beginPath(); rrect(ctx, World.W / 2 - w / 2, y - 19, w, 38, 19); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.fillText(text, World.W / 2, y + 1);
  ctx.restore();
}

const Games = {
  start(kind) {
    UI.$('result').hidden = true;
    if (Room.robot.mode === 'sleep') { Room.robot.sleeping = false; Room.robot.stop(); Room.robot.mode = 'stand'; }
    Game.setScene(kind === 'catch' ? Catch : Simon);
  },
  exit() { Snd.Music.stop(); UI.$('result').hidden = true; Game.setScene(Room); Room.robot.play(B.hello(Room.robot), 2); },
  result(title, stars, sub, again) {
    const p = UI.$('result');
    p.hidden = false;
    p.innerHTML = `<h2>${title}</h2><div class="stars">${[0, 1, 2].map((i) => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div><p>${sub}</p><div style="display:flex;gap:10px"><button class="big-btn" id="rAgain">Ещё раз</button><button class="pill ghost" id="rHome" style="padding:12px 18px;font-size:16px">Домой</button></div>`;
    UI.$('rAgain').onclick = () => { Snd.sfx.click(); again(); };
    UI.$('rHome').onclick = () => { Snd.sfx.click(); Games.exit(); };
    Snd.sfx.fanfare();
  },
  danceParty() {
    const r = Room.robot;
    if (r.mode === 'sleep') Room.wake(true);
    r.stop(); r.mode = 'stand';
    Room.party = 1;
    let beats = 0;
    const moves = [
      () => { r.tiltBias = 0.14; r.headTarget.rot = 0.2; r.crouchT = 0.5; },
      () => { r.tiltBias = -0.14; r.headTarget.rot = -0.2; r.crouchT = 0.5; },
      () => { r.hop(0.5); r.flap = 1; },
      () => { r.crouchT = 0.8; r.neckT = 1; r.billHold = 0.6; },
    ];
    Snd.Music.start(116, () => {
      if (Game.scene !== Room) { Snd.Music.stop(); Room.party = 0; return; }
      beats++;
      r.beat = 1; setTimeout(() => { r.beat = 0; r.crouchT = 0; r.billHold = 0; r.flap = 0; r.neckT = 0; }, 160);
      (beats % 8 === 0 ? () => r.play(B.spin(r), 1, 'spin') : moves[beats % 4])();
      r.face(beats % 6 < 3 ? 'happy' : 'star', 0.6);
      const h = r.headWorld();
      FX.add({ kind: 'note', x: h.x + rand(-60, 60), y: h.y - 40, vy: -60, vx: rand(-20, 20), life: 1.2, col: pick(['#FFE36B', '#FF8AD8', '#7FD3FF', '#7BE07A']) });
      if (beats >= 40) {
        Snd.Music.stop(); Room.party = 0; r.tiltBias = 0; r.headTarget.rot = 0;
        Game.stat('dances'); SpeechLab.react('play'); Game.need('fun', 25); Game.friend(3);
        r.play(B.celebrate(r), 3);
      }
    });
    UI.toast('Танцуем! Тыкай в робота в такт', 'dance');
  },
};
window.Games = Games;

// ---- speech.js ----
'use strict';

// On-device vocabulary. Each robot remembers two successful echoes per card.
// A future local model can choose a reply from the currently learned candidates.
const SpeechLab = (() => {
  const groups = ['Буквы', 'Слоги', 'Слова'];
  const cards = [
    { id: 'a', label: 'А', group: 0 }, { id: 'o', label: 'О', group: 0 }, { id: 'u', label: 'У', group: 0 },
    { id: 'ma', label: 'Ма', group: 1 }, { id: 'mu', label: 'Му', group: 1 }, { id: 'pa', label: 'Па', group: 1 },
    { id: 'nyam', label: 'Ням', group: 2, contexts: ['feed'], picture: 'food' },
    { id: 'privet', label: 'Привет', group: 2, contexts: ['hello', 'wake'], picture: 'robots' },
    { id: 'mama', label: 'Мама', group: 2, contexts: ['pet'], picture: 'heart' },
    { id: 'myach', label: 'Мяч', group: 2, contexts: ['ball', 'play'], picture: 'fun' },
    { id: 'bayu', label: 'Баю-бай', group: 2, contexts: ['sleep'], picture: 'sleep' },
    { id: 'chisto', label: 'Чисто', group: 2, contexts: ['wash'], picture: 'clean' },
    { id: 'ura', label: 'Ура', group: 2, contexts: ['play', 'wake'], picture: 'dance' },
    { id: 'poka', label: 'Пока', group: 2, contexts: ['sleep'], picture: 'sleep' },
  ];
  const situations = [
    { id: 'meal', name: 'За едой', icon: 'food', contexts: ['feed'] },
    { id: 'game', name: 'В игре', icon: 'fun', contexts: ['play', 'ball'] },
    { id: 'greeting', name: 'При встрече', icon: 'robots', contexts: ['hello', 'wake'] },
    { id: 'care', name: 'При заботе', icon: 'heart', contexts: ['pet', 'wash', 'sleep'] },
  ];
  const lock = '<svg class="sp-lock" viewBox="0 0 18 18" aria-hidden="true"><path d="M5.5 8V5.8a3.5 3.5 0 0 1 7 0V8" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3.5" y="7" width="11" height="8.5" rx="2.5" fill="currentColor"/></svg>';
  const ears = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15 8q5 4 0 8m3-11q8 7 0 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const groupHint = ['Начни с гласных.', 'Сложи звуки вместе.', 'Подари другу слово.'];
  const stages = ['Пищит', 'Поёт гласные', 'Болтает слогами', 'Говорит слова'];
  const byId = new Map(cards.map(card => [card.id, card]));
  let group = 0, current = null, phase = 'library', answerOptions = [];
  let previousOrder = '', currentAudio = null, previousFocus = null;
  let cancelSelection = null;
  let selector = null, lastReply = null, robotId = null, rendered = false;
  const replyTimes = new Map();

  function memory() {
    const s = Game.s;
    if (!s.speechBook || typeof s.speechBook !== 'object') s.speechBook = {};
    const id = Game.def.id;
    if (!s.speechBook[id] || typeof s.speechBook[id] !== 'object') s.speechBook[id] = {};
    return s.speechBook[id];
  }

  function score(card) {
    const value = memory()[card.id];
    return value === 1 || value === 2 ? value : 0;
  }

  function level() {
    const mastered = cards.filter(card => score(card) === 2);
    return mastered.reduce((highest, card) => Math.max(highest, card.group + 1), 0);
  }
  function available(g) { return g === 0 || cards.some(card => card.group === g - 1 && score(card) === 2); }
  function stop() {
    if (cancelSelection) cancelSelection();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  }
  function play(card, asRobot) {
    stop();
    if (!Game.s.sound || document.hidden) return;
    Snd.init();
    const clip = window.ROBO_VOICE && window.ROBO_VOICE[card.id];
    if (!clip) return;
    const audio = new Audio(clip);
    currentAudio = audio;
    // The post-processed sample already has its own toy timbre. Slight speed
    // variations retain intelligibility and make the robots sound different.
    if (asRobot) audio.playbackRate = Math.max(0.91, Math.min(1.16, (Game.def.voice.speed || 1)));
    audio.volume = 0.87;
    audio.onended = () => { if (currentAudio === audio) currentAudio = null; };
    audio.play().catch(() => { if (currentAudio === audio) currentAudio = null; });
    if (asRobot && Room.robot) {
      const r = Room.robot;
      r.face('happy', 0.9);
      const duration = card.group === 2 ? 0.55 : 0.33;
      for (let t = 0; t < duration; t += 0.16) r.talk.push({ t0: r.t + t, t1: r.t + t + 0.10 });
    }
  }

  function shuffledChoices(card) {
    const others = cards.filter(other => other.group === card.group && other !== card);
    function shuffle(items) {
      for (let index = items.length - 1; index > 0; index--) {
        const pick = Math.floor(Math.random() * (index + 1));
        [items[index], items[pick]] = [items[pick], items[index]];
      }
      return items;
    }
    const options = shuffle([card, ...shuffle(others).slice(0, 2)]);
    if (options.map(item => item.id).join(',') === previousOrder) options.push(options.shift());
    previousOrder = options.map(item => item.id).join(',');
    return options;
  }

  function lamp(count) {
    return '<span class="sp-lamps" aria-label="Повторений ' + count + ' из 2"><i class="' + (count > 0 ? 'lit' : '') + '"></i><i class="' + (count > 1 ? 'lit' : '') + '"></i></span>';
  }

  function linkedSituation(card) {
    const links = memory().links;
    return links && situations.find(situation => situation.id === links[card.id]);
  }
  function linkControls(card) {
    const linked = linkedSituation(card);
    const buttons = situations.map(situation => {
      const chosen = linked === situation;
      return '<button data-link="' + situation.id + '" aria-pressed="' + chosen + '">' +
        '<span>' + ICON[situation.icon] + '</span>' + situation.name + (chosen ? ' ✓' : '') + '</button>';
    }).join('');
    return '<div class="sp-associate"><h4>Когда мне так говорить?</h4><div>' + buttons + '</div></div>';
  }

  function focusIn(selector) {
    const target = UI.$('sheetBody').querySelector(selector);
    if (target) target.focus({ preventScroll: true });
  }

  function render(focusSelector) {
    const body = UI.$('sheetBody');
    const sheet = UI.$('sheet');
    sheet.classList.add('speech-open');
    const st = level();
    const learned = cards.filter(card => score(card) === 2).length;
    const active = current && phase !== 'library';
    const signal = active && (phase === 'echo' || phase === 'done');
    let activity;
    if (!active) {
      const tabs = groups.map((name, g) => '<button data-group="' + g + '" aria-pressed="' + (g === group) + '"' + (available(g) ? '' : ' disabled') + '>' + name + (available(g) ? '' : ' ' + lock) + '</button>').join('');
      const choices = cards.filter(card => card.group === group).map(card => {
        const known = score(card);
        const badge = card.picture ? '<span class="sp-picture">' + ICON[card.picture] + '</span>' : '';
        return '<button class="sp-card sp-g' + group + (known === 2 ? ' sp-known' : '') + '" data-card="' + card.id + '" aria-label="' + card.label + (known === 2 ? ', выучено' : ', выбрать') + '">' + badge + '<strong>' + card.label + '</strong>' + lamp(known) + '</button>';
      }).join('');
      const next = !available(1) ? 'Выучи одну букву, чтобы открыть слоги.' : !available(2) ? 'Выучи один слог, чтобы открыть слова.' : 'Две искорки — и карточка в памяти.';
      activity = '<div class="sp-tabs" aria-label="Виды карточек">' + tabs + '</div><div class="sp-library"><h3>Чему научим?</h3><p>' + groupHint[group] + '</p><div class="sp-grid">' + choices + '</div><p class="sp-note">' + next + '</p></div>';
    } else {
      let controls;
      const hear = '<button class="sp-listen" data-do="listen">' + ears + ' Послушать</button>';
      if (phase === 'echo') {
        controls = '<div class="sp-task">Найди эту карточку для робота</div><div class="sp-choices">' +
          answerOptions.map(c => '<button data-answer="' + c.id + '">' + c.label + '</button>').join('') + '</div>' + hear;
      } else if (phase === 'again') {
        controls = '<div class="sp-task">Получилось! Закрепим ещё раз?</div><button class="sp-main" data-do="again">Повторить вместе</button>';
      } else {
        const newly = phase === 'done';
        const message = newly ? (current.group === 0 && !cards.some(c => c.group === 1 && score(c) > 0) ? 'Буква в памяти! Теперь можно учить слоги.' : current.group === 1 && !cards.some(c => c.group === 2 && score(c) > 0) ? 'Слог в памяти! Теперь можно учить слова.' : 'Запомнил! Теперь скажу сам.') : 'Эта карточка уже в моей памяти.';
        controls = '<div class="sp-task">' + message + '</div><button class="sp-main" data-do="repeat">' + ears + ' Скажи ещё!</button>';
      }
      if (current.group === 2 && score(current) === 2) controls += linkControls(current);
      activity = '<div class="sp-exercise"><div class="sp-ex-top"><button data-do="library" class="sp-back">‹ К карточкам</button>' + lamp(score(current)) + '</div><div class="sp-flash sp-g' + current.group + '"><small>' + ['Буква','Слог','Слово'][current.group] + '</small><strong>' + current.label + '</strong></div>' + controls + '<p class="sp-feedback" role="status"></p></div>';
    }

    body.innerHTML = '<section class="sp-panel"><div class="sp-radio' + (signal ? ' sp-signal' : '') + '"><canvas width="140" height="144" aria-hidden="true"></canvas><div><small>Голос робота</small><h3>' + stages[st] + '</h3><span class="sp-spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div><div class="sp-count"><b>' + learned + '</b><small>из ' + cards.length + '</small></div></div>' + activity + '</section>';
    const preview = body.querySelector('canvas').getContext('2d');
    preview.scale(2, 2);
    drawPreviewRobot(preview, Game.def, 70, 72, Game.s.hat, true);
    body.querySelector('.sp-panel').addEventListener('click', handle);
    rendered = true;
    if (focusSelector) focusIn(focusSelector);
  }

  function begin(card) {
    current = card;
    const learned = score(card) === 2;
    phase = learned ? 'review' : 'echo';
    if (!learned) answerOptions = shuffledChoices(card);
    render(learned ? '[data-do="repeat"]' : '[data-answer]');
    play(card, learned);
  }

  function handle(event) {
    const button = event.target.closest('button');
    if (!button || button.disabled || robotId !== Game.def.id || UI.sheetKind !== 'speech') return;
    const d = button.dataset;
    if (d.group !== undefined) {
      group = Number(d.group); current = null; phase = 'library';
      render('[data-group="' + group + '"]');
    } else if (d.card) {
      begin(byId.get(d.card));
    } else if (d.answer && phase === 'echo') {
      if (d.answer !== current.id) {
        Snd.sfx.plop();
        button.disabled = true;
        UI.$('sheetBody').querySelector('.sp-feedback').textContent = 'Попробуй найти «' + current.label + '».';
        return;
      }
      const count = Math.min(2, score(current) + 1);
      memory()[current.id] = count;
      phase = count === 2 ? 'done' : 'again';
      if (count === 2) { Game.hint('speech'); Game.stat('speechLearned'); Game.friend(3); Game.need('fun', 3); }
      Game.save();
      render(count === 2 ? '[data-do="repeat"]' : '[data-do="again"]');
      play(current, true);
    } else if (d.link && current && current.group === 2 && score(current) === 2) {
      const situation = situations.find(candidate => candidate.id === d.link);
      if (!situation) return;
      const book = memory();
      if (!book.links || typeof book.links !== 'object') book.links = {};
      const removing = linkedSituation(current) === situation;
      if (removing) delete book.links[current.id];
      else book.links[current.id] = situation.id;
      Game.save();
      render('[data-link="' + situation.id + '"]');
      UI.$('sheetBody').querySelector('.sp-feedback').textContent = removing ? 'Вернули привычный сигнал.' : 'Договорились! ' + situation.name + ' скажу «' + current.label + '».';
      if (!removing) play(current, true);
    } else if (d.do === 'library') {
      const key = current.id;
      if (phase === 'done' && group < 2 && available(group + 1)) group++;
      current = null; phase = 'library';
      render(); focusIn(byId.get(key).group === group ? '[data-card="' + key + '"]' : '[data-card]');
    } else if (d.do === 'again') begin(current);
    else if (d.do === 'repeat' || d.do === 'listen') play(current, d.do === 'repeat');
  }

  function open() {
    Snd.init(); stop();
    previousFocus = document.activeElement;
    current = null; phase = 'library'; robotId = Game.def.id;
    group = available(2) ? 2 : available(1) ? 1 : 0;
    UI.$('tray').hidden = true; UI.$('hint').hidden = true;
    UI.sheetKind = 'speech'; UI.$('sheet').dataset.kind = 'speech';
    UI.$('sheetTitle').textContent = 'Школа речи';
    UI.$('sheetTabs').replaceChildren();
    UI.$('sheet').hidden = false;
    render('[data-card]');
    if (level() === 0 && Room.robot) Room.robot.say('question');
  }

  function close() {
    if (!rendered) return;
    rendered = false; stop();
    UI.$('sheet').classList.remove('speech-open');
    current = null;
    if (previousFocus && previousFocus.isConnected) previousFocus.focus({ preventScroll: true });
    previousFocus = null;
  }

  function react(context) {
    if (!Game.s.started || Game.scene !== Room || UI.sheetKind || document.hidden) return null;
    if (!['feed','wash','sleep','wake','pet','play','hello','ball'].includes(context)) return null;
    const id = Game.def.id;
    const now = performance.now();
    if (now - (replyTimes.get(id) ?? -Infinity) < 2400) return null;
    replyTimes.set(id, now);
    const learned = cards.filter(card => score(card) === 2);
    // The child's chosen associations take priority over the factory phrases.
    let allowed = learned.filter(card => linkedSituation(card)?.contexts.includes(context));
    if (!allowed.length) allowed = learned.filter(card => !linkedSituation(card) && card.contexts?.includes(context));
    if (!allowed.length) {
      const sounds = learned.filter(card => card.group < 2);
      const best = sounds.reduce((n, card) => Math.max(n, card.group), -1);
      allowed = sounds.filter(card => card.group === best);
    }
    if (!allowed.length) {
      if (Room.robot) Room.robot.say('beep');
      return null;
    }
    // Snapshot the active visit as well as the allowlist. stop() cancels an
    // in-flight worker on scene change, switching robot, pause or mute.
    const robot = Room.robot;
    const soundAtRequest = Game.s.sound;
    function speak(proposed) {
      if (Room.robot !== robot || Game.def.id !== id || Game.scene !== Room ||
          UI.sheetKind || document.hidden || Game.s.sound !== soundAtRequest) return null;
      let chosen = allowed.find(card => card.id === proposed);
      if (!chosen) {
        const alternatives = allowed.filter(card => card.id !== lastReply);
        const pool = alternatives.length ? alternatives : allowed;
        chosen = pool[Math.floor(Math.random() * pool.length)];
      }
      lastReply = chosen.id;
      play(chosen, true);
      UI.toast(chosen.label + '!', 'robots');
      return chosen.id;
    }

    if (!selector) return speak(null);
    const candidates = Object.freeze(allowed.map(card => card.id));
    let response;
    try {
      response = selector(Object.freeze({ context, candidates }));
      if (!response || typeof response.then !== 'function') return speak(response);
    } catch (_) { return speak(null); }

    // Resolve a stalled / rejected worker with an ordinary local response.
    // Closing the room or pausing resolves the request silently instead.
    if (cancelSelection) cancelSelection();
    return new Promise(resolve => {
      let done = false;
      const timer = setTimeout(() => finish(null), 900);
      function finish(proposed, cancelled = false) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        cancelSelection = null;
        resolve(cancelled ? null : speak(proposed));
      }
      cancelSelection = () => finish(null, true);
      Promise.resolve(response).then(id => finish(id), () => finish(null));
    });
  }

  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
  return {
    open, close, react, stop,
    profile() { return { stage: stages[level()], learned: cards.filter(card => score(card) === 2).length, total: cards.length }; },
    setSelector(fn) { if (cancelSelection) cancelSelection(); selector = typeof fn === 'function' ? fn : null; },
    getVocabulary() { return cards.filter(card => score(card) === 2).map(card => card.id); },
  };
})();

  }

LOGO.src = window.LOGO_SRC || '';

const DECAY = { food: 1.1, energy: 0.8, clean: 0.5, fun: 1.4 }; // per minute
const today = () => new Date().toISOString().slice(0, 10);

const Game = {
  s: null, scene: null, t: 0, saveT: 0,
  fresh() {
    return {
      v: 2, robot: 'pik', name: 'Пик', started: false,
      needs: { food: 58, energy: 78, clean: 62, fun: 50 },
      bolts: 30, xp: 0, level: 1,
      stats: { catchGames: 0, boltsTotal: 0, washes: 0, dances: 0, sleeps: 0, kicks: 0, melodies: 0, days: 1, feeds: 0, level: 1 },
      owned: {}, hats: {}, hat: null,
      unlocked: { pik: true, plusha: true, shursh: true },
      demoAll: false, sound: true, last: Date.now(), day: today(), hints: {},
    };
  },
  load() {
    const s = Store.load();
    this.s = Object.assign(this.fresh(), s || {});
    for (const k of ['needs', 'stats']) this.s[k] = Object.assign(this.fresh()[k], (s || {})[k] || {});
    // time away: needs drift, but never to zero; a little gift waits
    const away = clamp((Date.now() - this.s.last) / 60000, 0, 600);
    this.away = away;
    this.s.v = 2;
    if (s && away > 1) {
      for (const k in DECAY) this.s.needs[k] = Math.max(Math.min(this.s.needs[k], 22), this.s.needs[k] - DECAY[k] * away * 0.5);
    }
    if (this.s.day !== today()) { this.s.stats.days += 1; this.s.day = today(); }
    Snd.on = this.s.sound;
  },
  save() { if (this.resetting) return; this.s.last = Date.now(); Store.save(this.s); },
  get def() { return ROBOT_BY_ID[this.s.robot] || ROBOTS[0]; },
  need(k, d) { const n = this.s.needs; n[k] = clamp(n[k] + d, 0, 100); UI.needs(); },
  lowestNeed() { let best = null; for (const k in this.s.needs) if (!best || this.s.needs[k] < best.v) best = { k, v: this.s.needs[k] }; return best; },
  stat(k, n = 1) {
    const before = this.s.stats[k] || 0;
    this.s.stats[k] = before + n;
    const stamp = Passport.stamps.find(([key, goal]) => key === k && before < goal && before + n >= goal);
    if (stamp) UI.toast('Новая марка «' + stamp[2] + '»', stamp[4]);
    this.checkUnlocks();
  },
  friend(n, context) {
    if (['pet', 'ball', 'feed', 'wash'].includes(context)) SpeechLab.react(context);
    const s = this.s; s.xp += n;
    const need = 10 + s.level * 6;
    if (s.xp >= need) {
      s.xp -= need; s.level++; s.stats.level = s.level;
      UI.toast(`Дружба: уровень ${s.level}!`, 'heart');
      this.addBolts(10, World.cx, World.H * 0.4);
      if (this.scene === Room && Room.robot) { Room.robot.stop(); Room.robot.play(B.celebrate(Room.robot), 3, 'celebrate'); }
      this.checkUnlocks();
    }
    UI.friend();
  },
  addBolts(n, x, y) {
    // Credit the save immediately. Flying bolts are feedback and may be interrupted.
    this.s.bolts += n; this.s.stats.boltsTotal += n;
    UI.bolts(true); this.checkUnlocks(); this.save();
    const tgt = UI.boltTarget();
    const k = Math.min(n, 10);
    for (let i = 0; i < k; i++) {
      setTimeout(() => {
        const p = FX.add({ kind: 'fly', x: x + rand(-20, 20), y: y + rand(-20, 20), life: 0.7, s: 1.4, layer: 1 });
        const sx = p.x, sy = p.y, cx = (sx + tgt.x) / 2 + rand(-60, 60), cy = Math.min(sy, tgt.y) - 80;
        p.update = true;
        const t0 = performance.now();
        const step = () => {
          const k2 = clamp((performance.now() - t0) / 700, 0, 1), e = easeIn(k2);
          p.x = lerp(lerp(sx, cx, e), lerp(cx, tgt.x, e), e); p.y = lerp(lerp(sy, cy, e), lerp(cy, tgt.y, e), e);
          if (k2 < 1) requestAnimationFrame(step); else Snd.sfx.coin(1 + rand(0.1));
        };
        requestAnimationFrame(step);
      }, i * 70);
    }
  },
  dropBolt(x, y) {
    FX.add({ kind: 'bolt', x, y, vy: -260, vx: rand(-60, 60), g: 900, life: 0.6, floor: y + 30, s: 1.3, vr: 8 });
    setTimeout(() => this.addBolts(1, x, y), 500);
  },
  canUse(def) { return def.access === 'start' || this.s.unlocked[def.id] || this.s.demoAll; },
  checkUnlocks() {
    for (const d of ROBOTS) {
      if (d.access !== 'earn' || this.s.unlocked[d.id] || !d.goal) continue;
      if ((this.s.stats[d.goal.stat] || 0) >= d.goal.n) {
        this.s.unlocked[d.id] = true;
        UI.toast(`Новый друг открыт: ${d.name}!`, 'robots');
        Snd.sfx.fanfare();
        UI.badge('robots', true);
      }
    }
  },
  hint(done) {
    const order = ['pet', 'speech', 'feed', 'knock', 'tap', 'lift'];
    if (done) this.s.hints[done] = true;
    const next = order.find((k) => !this.s.hints[k]);
    UI.hint(next);
  },
  setScene(sc, ...a) { SpeechLab.stop(); if (this.scene && this.scene.leave) this.scene.leave(); this.scene = sc; if (sc.enter) sc.enter(...a); UI.scene(sc.name); },
  update(dt) {
    const s = this.s;
    if (this.scene === Room && s.started) {
      const m = dt / 60, sleeping = Room.robot && Room.robot.mode === 'sleep';
      s.needs.food = Math.max(0, s.needs.food - DECAY.food * m);
      s.needs.clean = Math.max(0, s.needs.clean - DECAY.clean * m);
      s.needs.fun = Math.max(0, s.needs.fun - DECAY.fun * m * (sleeping ? 0.2 : 1));
      s.needs.energy = clamp(s.needs.energy + (sleeping ? 14 : -DECAY.energy) * m, 0, 100);
      if (sleeping && s.needs.energy >= 99.5) Room.wake(false);
      this.saveT += dt;
      if (this.saveT > 4) { this.saveT = 0; this.save(); UI.needs(); }
    }
  },
};
Room.name = 'room';

// ---------------- boot: the studio logo on the robot's own face ----------------
const Boot = {
  name: 'boot', t: 0, robot: null, started: false,
  enter() {
    this.t = 0; this.started = false;
    this.robot = new Robot(Game.def, World, World.cx, World.H * 0.62);
    this.robot.hat = Game.s.hat;
  },
  down() {
    if (this.started) { if (this.t > 1.2) this.t = Math.max(this.t, 4.4); return; }
    this.started = true; this.t = 0; Snd.init(); Snd.on = Game.s.sound;
    Snd.sfx.lightOn();
  },
  move() {}, up() {},
  update(dt) {
    const r = this.robot;
    if (!this.started) { r.t += dt; return; }
    this.t += dt;
    const t = this.t;
    r.update(dt);
    if (t < 2.6) { r.expr = 'closed'; r.exprUntil = r.t + 1; }
    if (!this.chirp && t > 2.6) { this.chirp = true; r.expr = null; r.face('happy', 1.5); r.say('hello'); r.flap = 1; setTimeout(() => (r.flap = 0), 700); }
    if (!this.snd2 && t > 0.5) { this.snd2 = true; Snd.sfx.sparkle(); }
    if (t > 5.2) {
      if (Game.s.started) { Room.greetOnEnter = true; Game.setScene(Room); }
      else Game.setScene(Choose);
    }
  },
  draw(ctx) {
    const W = World.W, H = World.H, t = this.t, r = this.robot;
    if (World.bgDirty || !World.bg) { World.bg = renderRoomBg(Game.s.owned); World.bgDirty = false; }
    const reveal = clamp((t - 3.2) / 1.4, 0, 1), e = easeInOut(reveal);
    ctx.fillStyle = '#0D0A1E'; ctx.fillRect(0, 0, W, H);
    if (reveal > 0) { ctx.globalAlpha = e; ctx.drawImage(World.bg, 0, 0, W, H); ctx.globalAlpha = 1; }
    // camera: start on the face, pull back to the room
    const P = r.pose();
    const big = Math.min(W * 1.15, H * 0.5) / r.def.head.w;
    const normal = World.S * World.depthScale(World.H * 0.62);
    P.px = lerp(big, normal, e);
    const headCY = (GEO.hipY + GEO.neckBase - GEO.neckLen - r.def.head.h / 2) * P.px;
    P.x = W / 2; P.y = lerp(H * 0.45 - headCY, lerp(World.floorTop, World.floorBottom, 0.62), e);
    P.screen = LOGO.complete && LOGO.naturalWidth ? LOGO : null;
    P.screenK = this.started ? clamp(1 - (t - 2.0) / 0.5, 0, 1) * clamp(t / 0.35, 0, 1) : 0;
    P.alpha = this.started ? clamp(t / 0.25, 0, 1) : 0.0;
    P.shadow = reveal > 0.5;
    if (this.started) drawRobot(ctx, r.def, P);
    // captions
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (!this.started) {
      const k = 0.6 + Math.sin(performance.now() / 400) * 0.4;
      ctx.fillStyle = `rgba(120,240,230,${0.25 + k * 0.25})`;
      ctx.beginPath(); ell(ctx, W / 2, H * 0.45, 70, 16); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.font = '900 26px Nunito, system-ui, sans-serif';
      ctx.fillText('Кто-то живёт', W / 2, H * 0.3); ctx.fillText('в твоём телефоне…', W / 2, H * 0.3 + 34);
      ctx.globalAlpha = 0.65 + k * 0.35; ctx.font = '800 18px Nunito, system-ui, sans-serif';
      ctx.fillText('Коснись экрана, чтобы разбудить', W / 2, H * 0.62);
      ctx.globalAlpha = 1;
    } else if (t > 0.4 && t < 3.3) {
      const a = clamp((t - 0.4) / 0.4, 0, 1) * clamp((3.3 - t) / 0.4, 0, 1);
      ctx.globalAlpha = a; ctx.fillStyle = '#FFFFFF'; ctx.font = '900 22px Nunito, system-ui, sans-serif';
      ctx.fillText('Toysberry Game Studio', W / 2, H * 0.13);
      ctx.font = '700 15px Nunito, system-ui, sans-serif'; ctx.fillStyle = '#BFAEF5';
      ctx.fillText('представляет', W / 2, H * 0.13 + 26);
      ctx.globalAlpha = 1;
    }
    if (reveal > 0.6) {
      ctx.globalAlpha = clamp((reveal - 0.6) / 0.4, 0, 1);
      drawTitle(ctx, W / 2, World.topUI * 0.9);
      ctx.globalAlpha = 1;
    }
  },
};
function drawTitle(ctx, x, y) {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 40px Nunito, system-ui, sans-serif';
  ctx.lineWidth = 8; ctx.strokeStyle = '#3B2A80'; ctx.strokeText('Робогочи', x, y);
  const g = ctx.createLinearGradient(0, y - 20, 0, y + 20); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#BDF7EF');
  ctx.fillStyle = g; ctx.fillText('Робогочи', x, y);
  ctx.restore();
}

// ---------------- choose your baby robot ----------------
const Choose = {
  name: 'choose', bots: [], sel: -1, phase: 'pick', t: 0,
  enter() {
    this.t = 0; this.sel = -1; this.phase = 'pick';
    const y = lerp(World.floorTop, World.floorBottom, 0.55);
    this.bots = ['pik', 'plusha', 'shursh'].map((id, i) => {
      const r = new Robot(ROBOT_BY_ID[id], World, World.W * (0.2 + i * 0.3), y + (i === 1 ? 20 : 0));
      r.scaleMul = 0.62; r.idleT = rand(0.5, 2);
      return r;
    });
    UI.choose(null);
  },
  down(x, y) {
    if (this.phase !== 'pick') return;
    const i = this.bots.findIndex((r) => r.hitTest(x, y));
    if (i < 0) return;
    this.select(i);
  },
  select(i) {
    this.sel = i;
    const r = this.bots[i];
    r.stop(); r.play(B.hello(r), 2);
    this.bots.forEach((b, j) => { b.lookAt(r.x, r.y - 60, 1.5); if (j !== i && !b.busy) b.face('look', 1); });
    UI.choose(r.def);
  },
  confirm() {
    const r = this.bots[this.sel];
    Game.s.robot = r.def.id; Game.s.name = r.def.name;
    this.phase = 'name';
    this.bots.forEach((b, j) => {
      if (j === this.sel) return;
      b.stop(); b.play((function* () { b.face('happy', 2); b.say('hello'); b.flap = 1; yield* wait(0.5); b.flap = 0; yield* walk(b, World.W * 0.52, World.floorTop + 18, 1.2, 5); b.gone = true; })(), 3);
    });
    r.stop(); r.play((function* () { yield* walk(r, World.cx, lerp(World.floorTop, World.floorBottom, 0.62), 1, 4); yield* B.happyHop(r, 1); })(), 3);
    UI.nameStep();
  },
  finish(name) {
    Game.s.name = (name || '').trim().slice(0, 12) || Game.def.name;
    Game.s.started = true; Game.s.unlocked[Game.s.robot] = true;
    Game.save();
    const r = this.bots[this.sel];
    Room.setRobot(Game.def);
    Game.setScene(Room);
    Room.robot.x = r.x; Room.robot.y = r.y;
    Room.robot.play(B.happyHop(Room.robot, 2), 2);
    setTimeout(() => Game.hint(), 1500);
  },
  move() {}, up() {},
  update(dt) {
    this.t += dt;
    for (const r of this.bots) {
      if (r.gone) continue;
      r.update(dt);
      if (this.phase === 'pick' && !r.busy) { r.idleT -= dt; if (r.idleT <= 0) { r.idleT = rand(2, 4); r.play(pick([B.question(r), B[TRAITS[r.def.trait]](r), B.happyHop(r, 1)]), 0); } }
      if (r.gone === undefined && this.phase === 'name' && r !== this.bots[this.sel] && r.y < World.floorTop + 30) r.gone = true;
    }
  },
  draw(ctx) {
    if (World.bgDirty || !World.bg) { World.bg = renderRoomBg(Game.s.owned); World.bgDirty = false; }
    ctx.drawImage(World.bg, 0, 0, World.W, World.H);
    drawDockBack(ctx, false); drawDockFront(ctx, false);
    const list = this.bots.filter((r) => !r.gone).sort((a, b) => a.y - b.y);
    for (const r of list) {
      if (this.phase === 'pick' && this.bots[this.sel] === r) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ell(ctx, r.x, r.y, r.px * 0.5, r.px * 0.12); ctx.fill();
      }
      r.draw(ctx);
    }
    FX.draw(ctx, 0);
    drawTitle(ctx, World.W / 2, World.topUI * 0.55);
  },
};

// ---------------- input ----------------
const Input = { id: null };
function localXY(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', (e) => {
  if (!UI.$('sheet').hidden) { UI.closeSheet(); return; }
  Snd.init();
  const p = localXY(e);
  Input.id = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (Game.scene && Game.scene.down) Game.scene.down(p.x, p.y, e.pointerId);
  e.preventDefault();
});
window.addEventListener('pointermove', (e) => {
  const p = localXY(e);
  if (Room.dragFood) { Room.moveFood(p.x, p.y); return; }
  if (Input.id === e.pointerId && Game.scene && Game.scene.move) Game.scene.move(p.x, p.y);
});
const endPointer = (e) => {
  const p = localXY(e);
  if (Room.dragFood) { Room.dropFood(); return; }
  if (Input.id === e.pointerId) { Input.id = null; if (Game.scene && Game.scene.up) Game.scene.up(p.x, p.y); }
};
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.s) { SpeechLab.stop(); Game.save(); } });
window.addEventListener('pagehide', () => { if (Game.s) Game.save(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && window.__rgBack) window.__rgBack();
});

// ---------------- resize & loop ----------------
function resize() {
  const wrap = stage.parentElement;
  const vw = wrap.clientWidth || window.innerWidth, vh = wrap.clientHeight || window.innerHeight;
  let w = vw, h = vh;
  if (w / h > 0.62) w = Math.round(h * 0.5625);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const top = UI.topHeight(), bot = UI.bottomHeight();
  World.layout(w, h, top, bot);
  if (Room.robot) { const p = World.clampFloor(Room.robot.x, Room.robot.y); Room.robot.x = p.x; Room.robot.y = p.y; }
}
window.addEventListener('resize', resize);

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  Game.t += dt;
  const sc = Game.scene;
  if (sc && sc.update) sc.update(dt);
  Game.update(dt);
  FX.update(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (World.shakeAmt > 0.2) { ctx.translate(rand(-1, 1) * World.shakeAmt, rand(-1, 1) * World.shakeAmt); World.shakeAmt *= 0.86; } else World.shakeAmt = 0;
  if (sc && sc.draw) sc.draw(ctx);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // DOM scenes paint their own surface. Repeated reflections on an uncleared
  // backing canvas would become opaque during the parcel's fade into the room.
  if (sc !== Parcel && sc !== Workshop) {
    FX.draw(ctx, 1);
    drawGlass(ctx);
  }
  requestAnimationFrame(frame);
}
// glass of the phone: soft reflection and rounded inner frame
function drawGlass(ctx) {
  const W = World.W, H = World.H;
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, 'rgba(255,255,255,0.07)'); g.addColorStop(0.35, 'rgba(255,255,255,0)'); g.addColorStop(0.36, 'rgba(255,255,255,0.05)'); g.addColorStop(0.42, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(20,12,40,0.35)';
  ctx.beginPath(); rrect(ctx, -2, -2, W + 4, H + 4, 34); ctx.stroke();
  ctx.restore();
}

function boot() {
  Game.load();
  UI.init();
  resize();
  Room.setRobot(Game.def);
  Room.ensureToys();
  Room.greetOnEnter = Game.s.started;
  Game.setScene(Game.s.started ? Room : Parcel);
  window.__rg = { Game, Room, World, B, Boot, Choose, Parcel, SpeechLab, Workshop, Games: window.Games };
  // Android shell hooks: Back closes a sheet / leaves a mini-game first; leaving the app saves and mutes
  window.__rgBack = () => {
    if (Game.scene === Workshop) { Workshop.exit(); return 'stay'; }
    if (Game.scene === Parcel && Game.s.started) { Game.setScene(Room); return 'stay'; }
    if (!UI.$('sheet').hidden) { UI.closeSheet(); return 'stay'; }
    if (!UI.$('tray').hidden) { UI.$('tray').hidden = true; return 'stay'; }
    if (Game.scene && (Game.scene.name === 'catch' || Game.scene.name === 'simon')) { Games.exit(); return 'stay'; }
    Game.save(); return 'exit';
  };
  window.__rgAppPause = () => { SpeechLab.stop(); Game.save(); Snd.Music.stop(); };
  window.__rgAppResume = () => { Snd.init(); };
  requestAnimationFrame(frame);
}

boot();
</script>
