<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#EFE7F7}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../src/core.js"></script>
<script src="../src/robots.js"></script>
<script src="../src/draw_robot.js"></script>
<script>
const q = new URLSearchParams(location.search);
const cols = +(q.get('cols')||5), cellW = +(q.get('cw')||260), cellH = +(q.get('ch')||300);
const list = q.get('ids') ? q.get('ids').split(',').map(id=>ROBOT_BY_ID[id]) : ROBOTS;
const exprs = (q.get('expr')||'normal').split(',');
const rows = Math.ceil(list.length*exprs.length/cols);
const cv = document.getElementById('c'); DPR = 2;
cv.width = cols*cellW*DPR; cv.height = rows*cellH*DPR; cv.style.width = cols*cellW+'px'; cv.style.height = rows*cellH+'px';
const ctx = cv.getContext('2d'); ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.font = '600 16px sans-serif'; ctx.textAlign='center';
let i = 0;
for (const def of list) for (const ex of exprs) {
  const cx = (i%cols)*cellW + cellW/2, cy = Math.floor(i/cols)*cellH + cellH - 50;
  const P = defaultPose(); P.x = cx; P.y = cy; P.px = 145; P.t = 1.3 + i*0.7; P.expr = ex; P.blush = (ex==='happy'||ex==='love')?1:0;
  P.turn = +(q.get('turn')||0); P.lookX = +(q.get('look')||0); P.bill = +(q.get('bill')||0); P.hat = q.get('hat');
  if (q.get('var')) { P.turn = [0,-0.6,0.6,0.3,-0.3][i%5]; P.tilt=[0,0.08,-0.06,0.05,0][i%5]; P.ant=[0,0.3,-0.25,0.1,0][i%5]; }
  drawRobot(ctx, def, P);
  ctx.fillStyle='#3A2A50'; ctx.fillText(def.name + (exprs.length>1?' · '+ex:''), cx, cy+34);
  i++;
}
document.title='ready';
</script></body></html>
